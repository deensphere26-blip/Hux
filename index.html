    /* ==========================================================
       Mobile Settings: freeze scroll when Birthday header pins.
       Measures the Birthday header's LIVE position on every scroll
       tick — no pre-computed scrollTop, no drift, no overshoot.
       User can scroll back UP to unlock.
       ========================================================== */

    let _settingsFreezeHandler = null;
    let _settingsFrozen = false;
    let _settingsFreezePoint = 0;

    function teardownSettingsFreeze() {
      const content =
        document.querySelector('.content');

      if (
        content &&
        _settingsFreezeHandler
      ) {
        content.removeEventListener(
          'scroll',
          _settingsFreezeHandler
        );
      }

      if (content) {
        content.classList.remove(
          'settings-frozen'
        );
      }

      _settingsFreezeHandler = null;
      _settingsFrozen = false;
      _settingsFreezePoint = 0;
    }

    function installSettingsFreeze() {
      // Mobile only
      if (
        !window.matchMedia(
          '(max-width: 880px)'
        ).matches
      ) {
        return;
      }

      const content =
        document.querySelector('.content');

      if (!content) return;

      const sections =
        content.querySelectorAll(
          '.settings-page .settings-section'
        );

      if (sections.length < 5) {
        alert(
          'FREEZE BAILED — only ' +
          sections.length +
          ' sections found'
        );

        return;
      }

      const birthdaySection = sections[2];
      const privacySection = sections[4];

      const birthdayHeader =
        birthdaySection.querySelector(
          '.settings-fixed-top'
        );

      const birthdayCard =
        birthdaySection.querySelector(
          '.card'
        );

      const privacyCard =
        privacySection.querySelector(
          '.card'
        );

      if (
        !birthdayHeader ||
        !birthdayCard ||
        !privacyCard
      ) {
        return;
      }

      const PIN_TOP = 68;
      const ARABIC_TOP = 100;
      const PRIVACY_TOP = 132;

      // Bottom nav bar height + iOS safe-area + a small breathing gap.
      const bottomNavEl =
        document.querySelector('.bottomnav');

      const navH = bottomNavEl
        ? bottomNavEl.getBoundingClientRect().height
        : 80;

      const safeArea =
        parseFloat(
          getComputedStyle(
            document.documentElement
          ).getPropertyValue(
            'env(safe-area-inset-bottom)'
          )
        ) || 0;

      const BOTTOM_RESERVED =
        navH + 16;

      // How many pixels of vertical space the pinned Birthday + Arabic + Privacy
      // headers occupy BELOW the Birthday pin line.
      const pinnedStackHeight =
        (ARABIC_TOP - PIN_TOP) +
        (PRIVACY_TOP - ARABIC_TOP);

      // = 32 + 32 = 64px

      const computeFreezePoint = () => {
        const wasFrozen = _settingsFrozen;

        if (wasFrozen) {
          content.classList.remove(
            'settings-frozen'
          );
        }

        // Live measurements
        const bdayHeaderTop =
          birthdayHeader.getBoundingClientRect().top;

        const bdayCardH =
          birthdayCard.getBoundingClientRect().height;

        const arabicCardH =
          sections[3]
            .querySelector('.card')
            .getBoundingClientRect()
            .height;

        const privacyCardH =
          privacyCard.getBoundingClientRect().height;

        // Total space needed BELOW the Birthday pin line so that
        // Birthday card + Arabic header + Arabic card + Privacy header + Privacy card
        // all fit above the bottom nav.
        const neededBelowPin =
          bdayCardH
          + (ARABIC_TOP - PIN_TOP)
          + arabicCardH
          + (PRIVACY_TOP - ARABIC_TOP)
          + privacyCardH
          + 200;

        // Available viewport space below the Birthday pin line, minus the nav bar.
        const viewportH =
          window.innerHeight;

        const availableBelowPin =
          viewportH -
          PIN_TOP -
          BOTTOM_RESERVED;

        // If everything fits naturally, we lock when the Birthday header
        // would reach its pin line. If it DOESN'T fit, we lock EARLIER —
        // pulling up by the shortfall so the whole stack is on-screen.
        const shortfall =
          Math.max(
            0,
            neededBelowPin -
              availableBelowPin
          );

        // scrollTop at which Birthday header reaches PIN_TOP:
        const scrollAtPin =
          content.scrollTop +
          (bdayHeaderTop - PIN_TOP);

        // Lock EARLIER by the shortfall so the entire stack fits.
        _settingsFreezePoint =
          Math.max(
            0,
            scrollAtPin - shortfall
          );

        if (wasFrozen) {
          content.classList.add(
            'settings-frozen'
          );
        }
      };

      const lock = () => {
        computeFreezePoint();

        content.scrollTop =
          _settingsFreezePoint;

        content.classList.add(
          'settings-frozen'
        );

        _settingsFrozen = true;
      };

      const onScroll = () => {
        if (_settingsFrozen) {
          if (
            content.scrollTop >
            _settingsFreezePoint + 0.5
          ) {
            content.scrollTop =
              _settingsFreezePoint;
          } else if (
            content.scrollTop <
            _settingsFreezePoint - 2
          ) {
            content.classList.remove(
              'settings-frozen'
            );

            _settingsFrozen = false;
          }

          return;
        }

        // Trigger: once we're within `shortfall` px of the pin point, lock.
        // We compute the trigger dynamically so it stays in sync with the live layout.
        const bdayHeaderTop =
          birthdayHeader.getBoundingClientRect().top;

        const bdayCardH =
          birthdayCard.getBoundingClientRect().height;

        const arabicCardH =
          sections[3]
            .querySelector('.card')
            .getBoundingClientRect()
            .height;

        const privacyCardH =
          privacyCard.getBoundingClientRect().height;

        const neededBelowPin =
          bdayCardH
          + (ARABIC_TOP - PIN_TOP)
          + arabicCardH
          + (PRIVACY_TOP - ARABIC_TOP)
          + privacyCardH
          + 200;

        const availableBelowPin =
          window.innerHeight -
          PIN_TOP -
          BOTTOM_RESERVED;

        const shortfall =
          Math.max(
            0,
            neededBelowPin -
              availableBelowPin
          );

        // Birthday header's current distance from the pin line:
        const distanceFromPin =
          bdayHeaderTop - PIN_TOP;

        if (
          distanceFromPin <= shortfall
        ) {
          lock();
        }
      };

      // If we enter Settings already past the trigger, lock right away.
      {
        const bdayHeaderTop =
          birthdayHeader.getBoundingClientRect().top;

        const bdayCardH =
          birthdayCard.getBoundingClientRect().height;

        const arabicCardH =
          sections[3]
            .querySelector('.card')
            .getBoundingClientRect()
            .height;

        const privacyCardH =
          privacyCard.getBoundingClientRect().height;

        const neededBelowPin =
          bdayCardH
          + (ARABIC_TOP - PIN_TOP)
          + arabicCardH
          + (PRIVACY_TOP - ARABIC_TOP)
          + privacyCardH
          + 200;

        const availableBelowPin =
          window.innerHeight -
          PIN_TOP -
          BOTTOM_RESERVED;

        const shortfall =
          Math.max(
            0,
            neededBelowPin -
              availableBelowPin
          );

        if (
          bdayHeaderTop - PIN_TOP <=
          shortfall
        ) {
          lock();
        }
      }

      _settingsFreezeHandler = onScroll;

      content.addEventListener(
        'scroll',
        onScroll,
        { passive: true }
      );
    }

    function bindSettings() {
      $$('[data-notif]').forEach(
        b => b.onclick = async () => {
          const k = b.dataset.notif;

          S.settings.notif[k] =
            !S.settings.notif[k];

          await setJSON(
            'settings',
            S.settings
          );

          render();
        }
      );

      $$('[data-fontsz]').forEach(
        b => b.onclick = async () => {
          S.settings.arabicFontSize =
            b.dataset.fontsz;

          applyArabicSize(
            b.dataset.fontsz
          );

          $$('[data-fontsz]').forEach(
            x => {
              x.classList.toggle(
                'btn-primary',
                x.dataset.fontsz ===
                  b.dataset.fontsz
              );

              x.classList.toggle(
                'btn-ghost',
                x.dataset.fontsz !==
                  b.dataset.fontsz
              );
            }
          );

          await setJSON(
            'settings',
            S.settings
          );
        }
      );

      const bdayBtn =
        $('#birthday-save');

      if (bdayBtn) {
        bdayBtn.onclick = async () => {
          const val =
            $('#birthday-input').value;

          S.settings.birthday =
            val || null;

          await setJSON(
            'settings',
            S.settings
          );

          toast(
            val
              ? 'Birthday saved. We\u2019ll remind you each year.'
              : 'Birthday cleared.'
          );
        };
      }

      const del =
        $('#delete-acct');

      if (del) {
        del.onclick = async () => {
          if (
            !confirm(
              'This will permanently erase all your saved Deen Sphere data — prayers, routine, Qur\'an progress, bookmarks, adhkar, reflections and chat history. Your login, profile picture and Settings will remain. Continue?'
            )
          ) {
            return;
          }

          const dayKeysToWipe =
            Object.keys(S.dayCache || {});

          // ---- WIPE LOCAL ACCOUNT DATA ----
          try {
            const rm = [];

            for (
              let i = 0;
              i < localStorage.length;
              i++
            ) {
              const k =
                localStorage.key(i);

              if (!k) continue;

              // Explicitly protect settings + pfp
              // (and their namespaced variants)
              if (
                k === 'settings' ||
                k === 'pfp'
              ) {
                continue;
              }

              if (
                k.endsWith(':settings') ||
                k.endsWith(':pfp')
              ) {
                continue;
              }

              const isAccountKey =
                k.startsWith('u:') ||
                k.startsWith('day:') ||
                /(^|:)day:\d{4}-\d{2}-\d{2}$/.test(k);

              const isKnownGlobal = [
                'onboarding-done',
                'quran-progress',
                'quran-bookmark',
                'bookmarks',
                'tawhid-progress',
                'audio-position',
                'completed-surahs',
                'routine-struct',
                'guide-history'
              ].includes(k);

              if (
                isAccountKey ||
                isKnownGlobal
              ) {
                rm.push(k);
              }
            }

            rm.forEach(k =>
              localStorage.removeItem(k)
            );
          } catch (e) {}

          // ---- Wipe the cloud copy too (keep settings + pfp) ----
          try {
            const user =
              window.fb?.auth?.currentUser;

            if (user) {
              const keys = [
                'onboarding-done',
                'quran-progress',
                'quran-bookmark',
                'bookmarks',
                'tawhid-progress',
                'completed-surahs',
                'routine-struct',
                'audio-position',
                'guide-history'
              ];

              const blankDay = (ds) => ({
                date: ds,
                salah: {
                  fajr: 'pending',
                  dhuhr: 'pending',
                  asr: 'pending',
                  maghrib: 'pending',
                  isha: 'pending'
                },
                routine: {},
                adhkar: {
                  morning: false,
                  evening: false
                },
                quranVerses: 0,
                quranVersesRead: {},
                reflection: null
              });

              const writes =
                keys.map(k => {
                  const ref =
                    window.fb.doc(
                      window.fb.db,
                      'users',
                      user.uid,
                      'data',
                      k
                    );

                  const val =
                    k === 'quran-progress'
                      ? {
                          surah: 1,
                          verse: 1
                        }
                      : k === 'quran-bookmark'
                        ? null
                        : k === 'bookmarks'
                          ? []
                          : k === 'tawhid-progress'
                            ? {}
                            : k === 'completed-surahs'
                              ? []
                              : k === 'routine-struct'
                                ? null
                                : k === 'audio-position'
                                  ? null
                                  : k === 'guide-history'
                                    ? []
                                    : k === 'onboarding-done'
                                      ? true
                                      : null;

                  return window.fb.setDoc(
                    ref,
                    {
                      value: val,
                      updatedAt: Date.now()
                    }
                  );
                });

              // Overwrite EVERY day record we know about, not just today.
              dayKeysToWipe.forEach(ds => {
                writes.push(
                  window.fb.setDoc(
                    window.fb.doc(
                      window.fb.db,
                      'users',
                      user.uid,
                      'data',
                      'day:' + ds
                    ),
                    {
                      value: blankDay(ds),
                      updatedAt: Date.now()
                    }
                  )
                );
              });

              await Promise.all(writes);
            }
          } catch (e) {
            console.warn(e);
          }

          // ---- Kill all live listeners so stale data can't repaint ----
          unsubscribeAllCloudListeners();

          _subscribedDayKey = null;

          // ---- Re-subscribe to a clean cloud state ----
          subscribeToGlobalKeys();
          subscribeToCurrentDay(true);

          // ---- Refresh whatever screen the user is on — stay logged in ----
          render();

          // If we're on the tracker, force a fresh hydrate from the now-blank cache.
          if (S.screen === 'tracker') {
            S.dayCache = {};
            hydrateTracker();
          }

          toast(
            'All your saved data has been erased.'
          );
        };
      }
    }

    function bindDeenGuide() {
      const send = async (forcedText) => {
        if (S.guideThinking) return;

        const inp = $('#guide-input');

        const text =
          (forcedText || inp.value).trim();

        if (!text) return;

        S.guideMsgs =
          S.guideMsgs || [];

        S.guideMsgs.push({
          role: 'user',
          text
        });

        S.guideThinking = true;
        S.guideThinkStage =
          'Analyzing question...';

        render();
        bindDeenGuide();

        const thread =
          $('#guide-thread');

        if (thread) {
          thread.scrollTop =
            thread.scrollHeight;
        }

        try {
          S.guideThinkStage =
            'Searching the web for Islamic sources...';

          render();
          bindDeenGuide();

          try {
            const tavilyResp =
              await fetch('/api/search', {
                method: 'POST',
                headers: {
                  'Content-Type':
                    'application/json'
                },
                body: JSON.stringify({
                  query: text
                })
              });

            const tavilyData =
              await tavilyResp.json();

            if (
              tavilyData.results &&
              tavilyData.results.length > 0
            ) {
              webContext =
                tavilyData.results
                  .map(r =>
                    `Source: ${r.url}\nTitle: ${r.title}\nContent: ${r.content}`
                  )
                  .join('\n\n');
            }

            console.warn(

              webErr

            webContext =

          bindDeenGuide();

    /* ============================= SCREEN ACTION BINDER ============================= */

    /* ============================= INIT ============================= */

    window.addEventListener(
      'DOMContentLoaded',
      async () => {

        _bindAudioBarOnce();
        _bindSeekOnce();

        document.addEventListener(
          'visibilitychange',
          () => {
            if (
              document.visibilityState === 'visible' &&
              window.fb?.auth?.currentUser
            ) {
              subscribeToGlobalKeys();
              subscribeToCurrentDay();
            }
          }
        );

        window.addEventListener(
          'focus',
          () => {
            if (window.fb?.auth?.currentUser) {
              subscribeToGlobalKeys();
              subscribeToCurrentDay();
            }
          }
        );

        window.addEventListener(
          'online',
          () => {
            if (window.fb?.auth?.currentUser) {
              subscribeToGlobalKeys();
              subscribeToCurrentDay();
            }
          }
        );

        const SPLASH_START = Date.now();
        const MIN_SPLASH_MS = 500;

        // Mobile Firebase IndexedDB restore can take 2-3s. Give it room.
        const isMobileUA =
          /Android|iPhone|iPad|iPod|Mobile/i.test(
            navigator.userAgent
          ) ||
          window.matchMedia(
            '(max-width: 880px)'
          ).matches;

        const MAX_WAIT_MS =
          isMobileUA
            ? 4000
            : 1500;

        const themeBtn =
          document.getElementById(
            'theme-toggle'
          );

        if (themeBtn) {
          themeBtn.addEventListener(
            'click',
            (e) => {
              e.preventDefault();
              e.stopPropagation();

              toggleTheme();
            }
          );

          themeBtn.style.touchAction =
            'manipulation';
        }

        const urlParams =
          new URLSearchParams(
            window.location.search
          );

        const oobCode =
          urlParams.get('oobCode');

        const mode =
          urlParams.get('mode');

        if (
          oobCode &&
          (
            mode === 'resetPassword' ||
            mode === null
          )
        ) {
          _resetCode = oobCode;

          render();

          await loadAll();

          try {
            window.history.replaceState(
              {},
              document.title,
              window.location.pathname
            );
          } catch (e) {}

          go('reset-password');

          return;
        }

        render();

        // ---- Wait for auth + loadAll (bounded) ----
        const workPromise =
          (async () => {

            if (window.fb) {
              await new Promise(
                resolve => {
                  let done = false;

                  const finish = () => {
                    if (done) return;

                    done = true;
                    resolve();
                  };

                  const unsub =
                    window.fb.onAuthStateChanged(
                      window.fb.auth,
                      async (user) => {
                        const newUid =
                          user?.uid || null;

                        if (
                          S._lastUid ===
                          newUid
                        ) {
                          try {
                            unsub();
                          } catch (_) {}

                          finish();
                          return;
                        }

                        S._lastUid =
                          newUid;

                        if (user) {
                          S.profile = {
                            name:
                              user.displayName ||
                              'Friend',

                            email:
                              user.email,

                            uid:
                              user.uid,

                            joined:
                              user.metadata?.creationTime ||
                              new Date().toISOString(),

                            photoURL:
                              user.photoURL ||
                              null
                          };

                          await setJSON(
                            'profile',
                            S.profile
                          );
                        }

                        try {
                          unsub();
                        } catch (_) {}

                        finish();
                      }
                    );

                  // Hard safety: if Firebase never fires,
                  // don't hang forever
                  setTimeout(
                    () => {
                      try {
                        unsub();
                      } catch (_) {}

                      finish();
                    },
                    MAX_WAIT_MS
                  );
                }
              );
            }

            try {
              await Promise.race([
                loadAll(),
                new Promise(
                  r =>
                    setTimeout(
                      r,
                      MAX_WAIT_MS
                    )
                )
              ]);
            } catch (e) {
              console.warn(
                'loadAll failed or timed out:',
                e
              );
            }
          })();

        await Promise.race([
          workPromise,
          new Promise(
            r =>
              setTimeout(
                r,
                MAX_WAIT_MS + 200
              )
          )
        ]);

        const elapsed =
          Date.now() -
          SPLASH_START;

        if (
          elapsed <
          MIN_SPLASH_MS
        ) {
          await new Promise(
            r =>
              setTimeout(
                r,
                MIN_SPLASH_MS -
                  elapsed
              )
          );
        }

        // ---- Persistent auth listener
        // (for later sign-in / sign-out) ----
        if (window.fb) {
          window.fb.onAuthStateChanged(
            window.fb.auth,
            async (user) => {
              const newUid =
                user?.uid || null;

              const uidChanged =
                S._lastUid !== newUid;

              if (!uidChanged) {
                if (user) {
                  subscribeToGlobalKeys();
                  subscribeToCurrentDay();
                }

                return;
              }

              S._lastUid = newUid;

              if (user) {
                unsubscribeAllCloudListeners();

                _subscribedDayKey =
                  null;

                S.profile = {
                  name:
                    user.displayName ||
                    'Friend',

                  email:
                    user.email,

                  uid:
                    user.uid,

                  joined:
                    user.metadata?.creationTime ||
                    new Date().toISOString(),

                  photoURL:
                    user.photoURL ||
                    null
                };

                await setJSON(
                  'profile',
                  S.profile
                );

                await loadAll();

                subscribeToGlobalKeys();
                subscribeToCurrentDay(true);

                // If we're sitting on splash or auth but the user is actually signed in,
                // jump straight to the correct screen — do not wait for another event.
                if (
                  S.screen === 'splash' ||
                  S.screen === 'auth'
                ) {
                  if (
                    S.settings &&
                    S.settings.setupDone
                  ) {
                    const restored =
                      readLastScreen();

                    go(
                      restored.screen ||
                        'home',
                      restored.arg
                    );
                  } else {
                    go(
                      'setup-location'
                    );
                  }
                } else if (
                  S.screen &&
                  S.screen !== 'splash'
                ) {
                  render();
                }
              } else {
                unsubscribeAllCloudListeners();

                _subscribedDayKey = null;

				        S.profile = null;
        S.settings = null;
        S.dayCache = {};
        S.bookmarks = [];
        S.quranProgress = { surah: 1, verse: 1 };
        S.quranBookmark = null;
        S.guideMsgs = [];
        S.completedSurahs = [];
        S.routineStruct = null;
        S.tawhidProgress = {};
        S.routineViewDate = null;
        S.trackerRange = 'week';
        S.adhkarCat = null;
        S.hadithCat = null;
        S.sunnahCat = null;
        S.onbIdx = 0;
        S.arg = undefined;
        S.guideThinking = false;
        S.guideThinkStage = '';
      }
    });
  }

  // ---- Determine which screen to show ----
  const decideAndGo = () => {
    if (S.profile && S.settings && S.settings.setupDone) {
      const restored = readLastScreen();
      go(restored.screen || 'home', restored.arg);
    } else if (S.profile) {
      go('setup-location');
    } else {
      go('auth');
    }
  };

  try {
    await Promise.race([
      bootSplash(),
      new Promise(r => setTimeout(r, 2500))
    ]);
  } catch (e) {
    console.warn('bootSplash failed:', e);
  }

  // If bootSplash didn't manage to leave splash, force the correct screen.
  if (S.screen === 'splash') {
    decideAndGo();
  }

  // On mobile, Firebase often resolves AFTER we've already navigated to
  // 'auth' (because S.profile was null at the time). When that happens,
  // re-navigate to the correct screen instead of leaving the user on auth.
  // We give Firebase one more chance to fire within a longer window.
  setTimeout(() => {
    if (
      S.profile &&
      S.settings &&
      S.settings.setupDone &&
      S.screen === 'auth'
    ) {
      const restored = readLastScreen();
      go(restored.screen || 'home', restored.arg);
    }
  }, 2500);

  setTimeout(() => {
    if (
      S.profile &&
      S.settings &&
      S.settings.setupDone &&
      S.screen === 'auth'
    ) {
      const restored = readLastScreen();
      go(restored.screen || 'home', restored.arg);
    }
  }, 5000);

  applyArabicSize(
    S.settings &&
    S.settings.arabicFontSize
  );
});


/* ============================= THEME TOGGLE FUNCTIONS ============================= */

function applyTheme(mode, persist = true) {
  document.documentElement.setAttribute(
    'data-theme',
    mode
  );

  const meta =
    document.querySelector(
      'meta[name="theme-color"]'
    );

  if (meta) {
    meta.setAttribute(
      'content',
      mode === 'light'
        ? '#FFFFFF'
        : '#000000'
    );
  }

  if (persist) {
    try {
      localStorage.setItem(
        'theme',
        mode
      );

      // A manual toggle is an override for today only.
      // Tomorrow the app automatically chooses the theme
      // from the current time.
      localStorage.setItem(
        'theme-override-date',
        new Date()
          .toISOString()
          .slice(0, 10)
      );
    } catch (e) {}
  }
}

function toggleTheme() {
  const cur =
    document.documentElement.getAttribute(
      'data-theme'
    ) || 'dark';

  const next =
    cur === 'dark'
      ? 'light'
      : 'dark';

  // Synchronous flip. No fade, no opacity change,
  // no rAF, no overlay.
  // The browser repaints once, straight into the new theme —
  // no split-second washed-out state on any of the colored elements.
  applyTheme(next);
}


/* ============================= ARABIC FONT SIZE ============================= */

function applyArabicSize(mode) {
  document.documentElement.setAttribute(
    'data-arabic-size',
    mode || 'medium'
  );
}


/* ==================== BLOCK SWIPE-BACK FROM LEAVING THE APP ==================== */

(function installSwipeBackGuard() {
  const isTouch =
    ('ontouchstart' in window) ||
    navigator.maxTouchPoints > 0;

  const isMobileUA =
    /Android|iPhone|iPad|iPod|Mobile/i.test(
      navigator.userAgent
    );

  if (!isTouch && !isMobileUA) return;

  // Seed one extra history entry so the first swipe-back
  // doesn't leave the app.
  try {
    history.pushState(
      { __deenGuard: true },
      '',
      location.href
    );
  } catch (e) {}

  // Whenever the user swipes back, immediately re-push
  // a guard entry so the app never falls off the history stack
  // (which causes the black screen).
  window.addEventListener(
    'popstate',
    () => {
      try {
        history.pushState(
          { __deenGuard: true },
          '',
          location.href
        );
      } catch (e) {}
    }
  );

  // Re-seed when the tab comes back into focus.
  // iOS Safari sometimes drops the extra entry when backgrounded.
  document.addEventListener(
    'visibilitychange',
    () => {
      if (
        document.visibilityState === 'visible'
      ) {
        try {
          history.pushState(
            { __deenGuard: true },
            '',
            location.href
          );
        } catch (e) {}
      }
    }
  );
})();
