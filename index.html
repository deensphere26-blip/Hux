  /* Mirror the desktop Settings sticky stack on mobile */

  .settings-page .settings-section {
    position: relative;
  }

  /* Base sticky header — same pattern as desktop */
  .settings-page .settings-fixed-top {
    position: sticky;
    top: 121px;
    z-index: 44;
    background: var(--bg);
    background-color: var(--bg) !important;
    padding: 10px 0 12px 0;
    margin-bottom: 0;
    border-bottom: 1px solid var(--border);
    isolation: isolate;
    box-shadow: 0 10px 0 0 var(--bg);
  }

  .settings-page .settings-fixed-top::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: -100vmax;
    right: -100vmax;
    background: var(--bg);
    z-index: -1;
    pointer-events: none;
  }

  .settings-page .settings-fixed-top::after {
    content: "";
    position: absolute;
    left: -100vmax;
    right: -100vmax;
    bottom: 100%;
    height: 12px;
    background: var(--bg);
    z-index: -1;
    pointer-events: none;
  }

  /* 1–3: Prayer, Notifications, Birthday — same top, each replaces the previous.
     Higher z-index on later headers makes them cover the previous one cleanly. */
  .settings-page .settings-section:nth-of-type(1) .settings-fixed-top {
    top: 121px;
    z-index: 44;
  }
  .settings-page .settings-section:nth-of-type(2) .settings-fixed-top {
    top: 121px;
    z-index: 45;

  .settings-page .settings-section:nth-of-type(3) .settings-fixed-top {

      { cat: "Morning", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا", meaning: "O Allah, I ask You for beneficial knowledge, good provision, and accepted deeds.", source: "Sunan Ibn Majah (Hadith 925) — graded Sahih" },
      { cat: "Morning", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَأَعُوذُ بِكَ مِنَ النَّارِ", meaning: "O Allah, I ask You for Paradise and seek refuge in You from the Fire.", source: "Sunan Abi Dawud (Hadith 792) — graded Sahih" },
      { cat: "Morning", ar: "اللَّهُمَّ اجْعَلْنِي مِنَ التَّوَّابِينَ وَاجْعَلْنِي مِنَ الْمُتَطَهِّرِينَ", meaning: "O Allah, make me among those who constantly repent and make me among those who purify themselves.", source: "Jami at-Tirmidhi (Hadith 55) — graded Sahih" },

		    }
    function fmtBirthday(bd) {
      if (!bd) return 'Not set';
      const [y, m, d] = bd.split('-').map(Number);
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return months[m - 1] + ' ' + d + (y ? ', ' + y : '');
    }

    function isRamadanMonth() {
      try {
        const parts = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { month: 'numeric' })
          .formatToParts(new Date());
        const m = parts.find(p => p.type === 'month')?.value;
        return String(m) === '9';
      } catch (e) { return false; }
    }
    function hijriDayOfMonth() {
      try {
        const parts = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { day: 'numeric' })
          .formatToParts(new Date());
        return parseInt(parts.find(p => p.type === 'day')?.value || '0', 10);
      } catch (e) { return 0; }
    }

    /* ============================= RENDER: SHELL ============================= */
       function go(screen, arg, verseArg) {
      // Always tear down any Settings freeze when navigating
      teardownSettingsFreeze();

      if (window._quranScrollHandler) {
        window.removeEventListener('scroll', window._quranScrollHandler, true);
        window._quranScrollHandler = null;
      }
      if (window._quranScrollTimer) {
        clearTimeout(window._quranScrollTimer);
        window._quranScrollTimer = null;
      }

      const leavingSplash = (S.screen === 'splash' && screen !== 'splash');
      

      const doNavigation = () => {
        S.screen = screen;
        S.arg = arg;
        S.verseArg = verseArg;

               try {
          if (['home', 'salah', 'routine', 'quran-library', 'quran-reader', 'adhkar', 'hadith',
            'tawhid', 'sunnah', 'ramadan', 'tracker', 'profile', 'settings', 'sources',
            'deenguide', 'jumuah', 'birthday', 'reflection'].includes(screen)) {
            localStorage.setItem(_lsKey('lastScreen'), screen);
            if (arg !== undefined) localStorage.setItem(_lsKey('lastArg'), String(arg));
            else localStorage.removeItem(_lsKey('lastArg'));
            // Backup to sessionStorage too — survives bfcache restores better on mobile.
            try {
              sessionStorage.setItem('__lastScreen', screen);
              if (arg !== undefined) sessionStorage.setItem('__lastArg', String(arg));
              else sessionStorage.removeItem('__lastArg');
            } catch (_) {}
          }
        } catch (e) { }

        render();

        if (screen === 'profile') {
          (async () => {
            try {
              const fresh = await getJSON('quran-progress');
              if (fresh && fresh.surah && fresh.verse) S.quranProgress = fresh;
              const el = document.getElementById('profile-quran-progress');
              if (el) {
                const sur = SURAHS.find(s => s.num === S.quranProgress.surah);
                el.textContent = (sur ? sur.translit : 'Surah ' + S.quranProgress.surah) + ' ' + S.quranProgress.verse;
              }
            } catch (e) { }
          })();
        }
      };

           doNavigation();
    }

    function navHtml(active) {
      const items = SIDE_NAV
        .map(([id, label, icon]) =>
          `<button class="navitem ${active === id ? 'active' : ''}" data-nav="${id}">${ICONS[icon]}<span>${label}</span></button>`).join('');
      return `<div class="sidebar">
            <div class="brand">${logoSvg(26)}<div><div class="brand-name">Deen Sphere</div><div class="brand-sub">Daily companion</div></div></div>
            <div class="navlist">${items}</div>
            <div class="navfoot"><button class="navitem" data-nav="profile">${ICONS.profile}<span>Profile</span></button>
            <button class="navitem" data-action="logout">${ICONS.logout}<span>Log out</span></button></div>
          </div>`;
    }

    function bottomNavHtml(active) {
      return `<div class="bottomnav"><ul>${BOTTOM_NAV.map(([id, label, icon]) =>
        `<li><button class="${active === id ? 'active' : ''}" data-nav="${id}">${ICONS[icon]}${label}</button></li>`).join('')}</ul></div>`;
    }

    function logoSvg(size) {
      return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" fill="none"><path d="M8 30V20a12 12 0 0124 0v10" stroke="#2FAE7B" stroke-width="2.6" stroke-linecap="round"/><circle cx="20" cy="10" r="2.4" fill="#C9A961"/></svg>`;
    }

    function render() {
      const app = $('#app');
      document.body.classList.toggle('profile-locked', S.screen === 'profile');
      const s = S.screen;

      if (s === 'splash') {
        app.innerHTML = renderSplash();
        return;
      }

      if (s === 'onboarding') {
        app.innerHTML = renderOnboarding();
        bindOnboarding();
        return;
      }

      if (s === 'auth') {
        app.innerHTML = renderAuth();
        bindAuth();
        return;
      }

      if (s === 'forgot-password') {
        app.innerHTML = renderForgotPassword();
        bindForgotPassword();
        return;
      }

      if (s === 'reset-password') {
        app.innerHTML = renderResetPassword();
        bindResetPassword();
        return;
      }

      if (s === 'setup-location') {
        app.innerHTML = renderSetupLocation();
        bindSetupLocation();
        return;
      }

      if (s === 'setup-calc') {
        app.innerHTML = renderSetupCalc();
        bindSetupCalc();
        return;
      }

      if (s === 'setup-birthday') {
        app.innerHTML = renderSetupBirthday();
        bindSetupBirthday();
        return;
      }

      if (s === 'setup-notif') {
        app.innerHTML = renderSetupNotif();
        bindSetupNotif();
        return;
      }

      const activeNavId = s === 'quran-reader' ? 'quran-library' : s;
      let bodyHtml = '';

      if (s === 'home') bodyHtml = renderHome();
      else if (s === 'routine') bodyHtml = renderRoutine();
      else if (s === 'quran-library') bodyHtml = renderQuranLibrary();
      else if (s === 'quran-reader') bodyHtml = renderQuranReader(S.arg);
      else if (s === 'adhkar') bodyHtml = renderAdhkar();
      else if (s === 'hadith') bodyHtml = renderHadith();
      else if (s === 'tawhid') bodyHtml = renderTawhid();
      else if (s === 'sunnah') bodyHtml = renderSunnah();
      else if (s === 'jumuah') bodyHtml = renderJumuah();
      else if (s === 'birthday') bodyHtml = renderBirthday();
      else if (s === 'ramadan') bodyHtml = renderRamadan();
      else if (s === 'reflection') bodyHtml = renderReflection();
      else if (s === 'tracker') bodyHtml = renderTracker();
      else if (s === 'profile') bodyHtml = renderProfile();
      else if (s === 'settings') bodyHtml = renderSettings();
      else if (s === 'sources') bodyHtml = renderSources();
      else if (s === 'deenguide') bodyHtml = renderDeenGuide();
      else bodyHtml = renderHome();

      const existingShell = app.querySelector('.shell');
      const existingContent = app.querySelector('.content');

      if (existingShell && existingContent) {
        // Shell already exists — swap content instantly, no fade, no blink
        existingContent.innerHTML = bodyHtml;

        // Update which nav item is active without rebuilding the nav
        $$('.navitem[data-nav]').forEach(b => {
          b.classList.toggle('active', b.dataset.nav === activeNavId);
        });

        $$('.bottomnav button[data-nav]').forEach(b => {
          b.classList.toggle('active', b.dataset.nav === activeNavId);
        });
      } else {
        app.innerHTML = `<div class="shell">
              ${navHtml(activeNavId)}
              <div class="main">
              <div class="topbar">${logoSvg(22)}<span style="font-weight:700;font-size:15px;margin-left:6px;flex:1">Deen Sphere</span>
                <button data-nav="settings" style="color:var(--tx2)">${ICONS.settings}</button>
              </div>
              <div class="content">${bodyHtml}</div>
              </div>
              ${bottomNavHtml(activeNavId)}
            </div>`;
      }

      bindGlobalNav();
      bindScreenActions(s);

      if (s === 'home') startCountdown();
      else stopCountdown();
    }

    function bindGlobalNav() {
      $$('[data-nav]').forEach(b => b.onclick = () => go(b.dataset.nav));
      const lo = $('[data-action="logout"]');
      if (lo) lo.onclick = doLogout;
    }

    /* ============================= SPLASH / ONBOARDING / AUTH ============================= */

    function renderSplash() {
      return `<div class="scr" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg)">
            ${logoSvg(56)}
            <div style="font-size:26px;font-weight:800;letter-spacing:.5px">DEEN SPHERE</div>
            <div style="color:var(--tx2);font-size:13.5px">Your daily companion for Salah, Qur\u2019an and Deen.</div>
          </div>`;
    }

    const ONBOARD_SLIDES = [
      {
        t: 'Strengthen your daily connection with Allah',
        d: 'Track your Salah, Qur\u2019an and daily worship in one peaceful space.'
      },
      {
        t: 'Build consistency, one day at a time',
        d: 'Create a sustainable daily routine without pressure or guilt.'
      },
      {
        t: 'Learn your Deen from authentic sources',
        d: 'Explore Qur\u2019an, authentic Hadith, Tawhid, duas and Sunnah.'
      },
    ];

    function renderOnboarding() {
      const i = S.onbIdx || 0;
      const sl = ONBOARD_SLIDES[i];

      const dots = ONBOARD_SLIDES.map((_, idx) =>
        `<div style="width:${idx === i ? 18 : 6}px;height:6px;border-radius:4px;background:${idx === i ? 'var(--green-l)' : 'var(--border)'};transition:width .2s"></div>`
      ).join('');

      return `<div class="scr" style="min-height:100vh;display:flex;flex-direction:column;padding:32px 26px;">
            <div style="text-align:right">
              <button class="btn-text" id="ob-skip">Skip</button>
            </div>

            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;max-width:380px;margin:0 auto;">
              ${logoSvg(40)}
              <div style="font-size:22px;font-weight:700;line-height:1.35">${sl.t}</div>
              <div style="color:var(--tx2);font-size:14.5px;line-height:1.6">${sl.d}</div>
            </div>

            <div style="display:flex;justify-content:center;gap:6px;margin-bottom:22px;">
              ${dots}
            </div>

            <button class="btn btn-primary btn-block" id="ob-next">
              ${i === ONBOARD_SLIDES.length - 1 ? 'Get Started' : 'Next'}
            </button>
          </div>`;
    }

    function bindOnboarding() {
      $('#ob-skip').onclick = async () => {
        S.onboardingDone = true;
        await setJSON('onboarding-done', true);
        go('auth');
      };

      $('#ob-next').onclick = async () => {
        const i = S.onbIdx || 0;

        if (i < ONBOARD_SLIDES.length - 1) {
          S.onbIdx = i + 1;
          render();
        } else {
          S.onboardingDone = true;
          await setJSON('onboarding-done', true);
          go('auth');
        }
      };
    }

    /* ===== Restore-last-screen helpers (used by DOMContentLoaded below) ===== */

    const VALID_RESTORE_SCREENS = [
      'home',
      'routine',
      'quran-library',
      'quran-reader',
      'adhkar',
      'hadith',
      'tawhid',
      'sunnah',
      'ramadan',
      'tracker',
      'profile',
      'settings',
      'sources',
      'deenguide',
      'jumuah',
      'birthday',
      'reflection'
    ];

    function readLastScreen() {
      let lastScreen = null;
      let lastArg = null;

      try {
        lastScreen = localStorage.getItem(_lsKey('lastScreen'));
        lastArg = localStorage.getItem(_lsKey('lastArg'));
      } catch (e) {}

      if (!lastScreen) {
        try {
          lastScreen = sessionStorage.getItem('__lastScreen');
          lastArg = sessionStorage.getItem('__lastArg');
        } catch (e) {}
      }

      if (!lastScreen || !VALID_RESTORE_SCREENS.includes(lastScreen)) {
        return { screen: null, arg: undefined };
      }

      if (lastScreen === 'quran-reader') {
        const num = parseInt(lastArg, 10);

        if (!(num >= 1 && num <= 114)) {
          return { screen: 'quran-library', arg: undefined };
        }

        return { screen: 'quran-reader', arg: num };
      }

      return {
        screen: lastScreen,
        arg: undefined
      };
    }

    async function bootSplash() {
      subscribeToGlobalKeys();
      subscribeToCurrentDay(true);

      // If DOMContentLoaded already restored a screen, don't touch it.
      if (S.screen !== 'splash') {
        applyArabicSize(S.settings && S.settings.arabicFontSize);
        return;
      }

      let targetScreen;
      let targetArg;

      if (S.profile && S.settings && S.settings.setupDone) {
        // Restore the last screen the user was on, if it's valid.
        const restored = readLastScreen();
        targetScreen = restored.screen || 'home';
        targetArg = restored.arg;
      } else if (!S.profile) {
        targetScreen = 'auth';
      } else {
        targetScreen = 'setup-location';
      }

      go(targetScreen, targetArg);
      applyArabicSize(S.settings && S.settings.arabicFontSize);
    }

    /* ============================= AUTHENTICATION ============================= */

    let _authMode = 'signin';

    function renderAuth() {
      const mode = _authMode;
      const isSignUp = mode === 'signup';

      return `<div class="scr" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
              <div style="width:100%;max-width:400px;">
                <div style="display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:24px;">
                  ${logoSvg(40)}
                  <div style="font-size:19px;font-weight:700">Welcome to Deen Sphere</div>
                  <div style="color:var(--tx2);font-size:13.5px;text-align:center">
                    ${isSignUp ? 'Create your account to begin your journey.' : 'Sign in to sync and save your daily worship.'}
                  </div>
                </div>

                <div style="display:flex;background:var(--card-el);border:1px solid var(--border);border-radius:var(--r-sm);padding:4px;margin-bottom:18px;">
                  <button id="tab-signin" style="flex:1;padding:9px;border-radius:7px;font-size:13.5px;font-weight:600;transition:all .15s;${!isSignUp ? 'background:var(--green);color:#fff;' : 'color:var(--tx2);'}">Sign In</button>
                  <button id="tab-signup" style="flex:1;padding:9px;border-radius:7px;font-size:13.5px;font-weight:600;transition:all .15s;${isSignUp ? 'background:var(--green);color:#fff;' : 'color:var(--tx2);'}">Sign Up</button>
                </div>

                <button class="btn btn-ghost btn-block" id="google-btn" style="margin-bottom:14px;">
                  <svg width="16" height="16" viewBox="0 0 24 24" style="margin-right:2px;"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                  Continue with Google
                </button>

                <div class="divider"></div>

                <div style="display:flex;flex-direction:column;gap:10px;">
                  ${isSignUp ? `<input id="auth-name" placeholder="Full name" autocomplete="name">` : ''}
                  <input id="auth-email" placeholder="Email" type="email" autocomplete="email">

                  <div class="password-wrapper">
                    <input id="auth-pass" placeholder="Password (min 6 characters)" type="password" autocomplete="${isSignUp ? 'new-password' : 'current-password'}">

                    <button type="button" class="eye-btn" onclick="togglePass('auth-pass', this)">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                      </svg>
                    </button>
                  </div>
                </div>

                ${!isSignUp ? `
                  <div style="text-align:right;margin:10px 0 14px;">
                    <button class="btn-text" id="forgot-btn" style="font-size:12.5px;">Forgot password?</button>
                  </div>
                ` : `<div style="height:24px;"></div>`}

                <button class="btn btn-primary btn-block" id="auth-submit">
                  ${isSignUp ? 'Create Account' : 'Sign In'}
                </button>

                <div style="text-align:center;color:var(--tx3);font-size:11.5px;margin-top:16px;line-height:1.6;">
                  By continuing you agree to the Terms and Privacy Policy.<br>
                  All data stays saved to your account, even after logging out.
                </div>
              </div>
            </div>`;
    }

    function bindAuth() {
      $('#tab-signin').onclick = () => {
        _authMode = 'signin';
        render();
      };

      $('#tab-signup').onclick = () => {
        _authMode = 'signup';
        render();
      };

      $('#google-btn').onclick = async () => {
        try {
          const result = await window.fb.signInWithPopup(window.fb.auth, window.fb.googleProvider);
          const u = result.user;

          S.profile = {
            name: u.displayName || 'Friend',
            email: u.email,
            uid: u.uid,
            joined: u.metadata.creationTime,
            photoURL: u.photoURL || null
          };

          await setJSON('profile', S.profile);
          await loadAll();

          if (!S.settings.setupDone) {
            go('setup-location');
          } else {
            go('home');
          }
        } catch (e) {
          console.error(e);

          if (e.code === 'auth/popup-closed-by-user') return;

          if (e.code === 'auth/popup-blocked') {
            toast('Popup blocked. Allow popups and try again.');
            return;
          }

          toast('Google sign-in failed: ' + (e.code || e.message));
        }
      };

      const forgotBtn = $('#forgot-btn');

      if (forgotBtn) {
        forgotBtn.onclick = () => go('forgot-password');
      }

      $('#auth-submit').onclick = async () => {
        const isSignUp = _authMode === 'signup';
        const name = isSignUp ? ($('#auth-name')?.value || '').trim() : '';
        const email = ($('#auth-email')?.value || '').trim();
        const pass = $('#auth-pass')?.value || '';

        if (!email || !email.includes('@')) {
          toast('Enter a valid email address.');
          return;
        }

        if (!pass || pass.length < 6) {
          toast('Password must be at least 6 characters.');
          return;
        }

        if (isSignUp && !name) {
          toast('Please enter your full name.');
          return;
        }

        const btn = $('#auth-submit');
        const originalText = btn.textContent;

        btn.textContent = isSignUp ? 'Creating account…' : 'Signing in…';
        btn.disabled = true;

        try {
          if (isSignUp) {
            const cred = await window.fb.createUserWithEmailAndPassword(
              window.fb.auth,
              email,
              pass
            );

            if (name) {
              await window.fb.updateProfile(cred.user, { displayName: name });
            }

            S.profile = {
              name: name || 'Friend',
              email,
              uid: cred.user.uid,
              joined: new Date().toISOString(),
              photoURL: null
            };

            await setJSON('profile', S.profile);
            await loadAll();

            toast('Welcome to Deen Sphere, ' + name.split(' ')[0] + '!');

            if (!S.settings.setupDone) {
              go('setup-location');
            } else {
              go('home');
            }
          } else {
            const cred = await window.fb.signInWithEmailAndPassword(
              window.fb.auth,
              email,
              pass
            );

            S.profile = {
              name: cred.user.displayName || (email.split('@')[0]),
              email: cred.user.email,
              uid: cred.user.uid,
              joined: cred.user.metadata?.creationTime || new Date().toISOString(),
              photoURL: cred.user.photoURL || null
            };

            await setJSON('profile', S.profile);
            await loadAll();

            toast('Welcome back, ' + S.profile.name.split(' ')[0] + '!');

            if (!S.settings.setupDone) {
              go('setup-location');
            } else {
              go('home');
            }
          }
        } catch (e) {
          console.error('Auth error:', e);
          btn.textContent = originalText;
          btn.disabled = false;
          handleAuthError(e, isSignUp);
        }
      };

      ['auth-name', 'auth-email', 'auth-pass'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
              $('#auth-submit')?.click();
            }
          });
        }
      });
    }

    function handleAuthError(e, isSignUp) {
      const code = e?.code || '';

      if (code === 'auth/email-already-in-use') {
        toast('This email is already registered. Try signing in.');
      } else if (code === 'auth/invalid-email') {
        toast('Invalid email address.');
      } else if (code === 'auth/weak-password') {
        toast('Password is too weak.');
      } else if (code === 'auth/user-not-found') {
        toast('No account found with this email.');
      } else if (code === 'auth/wrong-password' || code === 'auth/invalid-credential') {
        toast('Incorrect email or password.');

    /* ---------- Mobile-only logout pop-up ---------- */

    function openLogoutModal() {
      const bd = document.getElementById('logout-modal-backdrop');
      const md = document.getElementById('logout-modal');

      if (!bd || !md) return;

      bd.style.display = 'block';
      md.style.display = 'block';

      void bd.offsetWidth;

      bd.style.opacity = '1';
      md.style.opacity = '1';
      md.style.transform = 'translate(-50%,-50%) scale(1)';

      const bindTap = (el, fn) => {
        if (!el) return;

        let tapped = false;

        const handler = (e) => {
          if (tapped) return;

          tapped = true;

          if (e) {
            e.preventDefault();
            e.stopPropagation();
          }

          fn();

          setTimeout(() => {
            tapped = false;
          }, 400);
        };

        el.addEventListener('click', handler);
        el.style.touchAction = 'manipulation';
        el.style.webkitTapHighlightColor = 'transparent';
        el.style.cursor = 'pointer';
      };

      bindTap(document.getElementById('logout-modal-x'), closeLogoutModal);
      bindTap(document.getElementById('logout-modal-cancel'), closeLogoutModal);
      bindTap(document.getElementById('logout-modal-backdrop'), closeLogoutModal);

      bindTap(document.getElementById('logout-modal-confirm'), () => {
        closeLogoutModal();
        performLogout();
      });

      document.addEventListener('keydown', _logoutEscHandler);
    }

    function closeLogoutModal() {
      const bd = document.getElementById('logout-modal-backdrop');
      const md = document.getElementById('logout-modal');

      if (!bd || !md) return;

      bd.style.opacity = '0';
      md.style.opacity = '0';
      md.style.transform = 'translate(-50%,-50%) scale(.92)';

      setTimeout(() => {
        bd.style.display = 'none';
        md.style.display = 'none';
      }, 200);

      document.removeEventListener('keydown', _logoutEscHandler);
    }

    function _logoutEscHandler(e) {
      if (e.key === 'Escape') closeLogoutModal();
    }

    function doLogout() {
      const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
        || window.matchMedia('(max-width: 880px)').matches;

      if (isMobile) {
        openLogoutModal();
      } else {
        if (confirm('Log out of Deen Sphere? Your saved worship data will still be here next time you log in.')) {
          performLogout();
        }
      }

    async function performLogout() {
      const uid = window.fb?.auth?.currentUser?.uid || null;

      try {
        if (window.fb) {
          await window.fb.signOut(window.fb.auth);
        }
      } catch (e) {}

      try {
        const prefix = 'u:' + uid + ':';
        const rm = [];

        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);

          if (k && (k.startsWith(prefix) || k === 'profile')) {
            rm.push(k);
          }
        }

        rm.forEach(k => localStorage.removeItem(k));
      } catch (e) {}

      S.profile = null;
      S.settings = null;
      S.dayCache = {};
      S.bookmarks = [];
      S.quranProgress = { surah: 1, verse: 1 };
      S.guideMsgs = [];
      S.completedSurahs = [];

    function nextPrayerInfo() {
      const t = todaysTimes();
      const order = [
        ['Fajr', t.fajr],
        ['Dhuhr', t.dhuhr],
        ['Asr', t.asr],
        ['Maghrib', t.maghrib],
        ['Isha', t.isha]
      ];

      const now = new Date();
      let next = null;
      let prev = null;
      let cur = null;

      for (let i = 0; i < order.length; i++) {
        if (order[i][1] > now) {
          next = {
            label: order[i][0],
            time: order[i][1]
          };

          if (i > 0) {
            prev = {
              label: order[i - 1][0],
              time: order[i - 1][1]
            };
          }

          cur = i > 0 ? order[i - 1][0] : null;
          break;
        }
      }

      if (!next) {
        const tmr = new Date();
        tmr.setDate(tmr.getDate() + 1);

        const tt = timesForDate(tmr);

        next = {
          label: 'Fajr',
          time: tt.fajr
        };

        prev = {
          label: 'Isha',
          time: order[4][1]
        };

        cur = 'Isha';
      }

      return {
        order,
        next,
        prev,
        current: cur,
        times: t
      };
    }

    async function hydrateHome() {
      const ds = dateStr(new Date());
      const day = await getDay(ds);
      const t = todaysTimes();

      const order = [
        ['fajr', 'Fajr', t.fajr],
        ['dhuhr', 'Dhuhr', t.dhuhr],
        ['asr', 'Asr', t.asr],
        ['maghrib', 'Maghrib', t.maghrib],
        ['isha', 'Isha', t.isha]
      ];

      const now = new Date();
      const listEl = $('#salah-list');

      if (!listEl) return;

      listEl.innerHTML = order.map(([k, label, time]) => {
        const status = day.salah[k];
        const passed = time < now;
        let tag;

        if (status === 'completed') {
          tag = `<span class="tag tag-green">Completed</span>`;
        } else if (passed) {
          tag = `<span class="tag tag-amber">Missed</span>`;
        } else {
          tag = `<span class="tag tag-muted">Upcoming</span>`;
        }

        return `<div class="checkrow">
            <button class="chk ${status === 'completed' ? 'done' : ''}" data-salah="${k}"></button>
            <div style="flex:1">
              <div class="rowtitle">${label}</div>
              <div class="rowsub">${fmtTime(time)}</div>
            </div>
            ${tag}
          </div>`;
      }).join('') +
      (order.some(([k]) =>
        day.salah[k] !== 'completed' &&
        order.find(o => o[0] === k)[2] < now
      ) ?
        `<div style="padding:12px 4px 2px;color:var(--tx2);font-size:12.5px;font-style:italic;">Return to Allah and continue.</div>`
        : '');

      // Delegated handler — survives re-renders, ignores Android touch+click double-fire
      if (!listEl.dataset.salahDelegated) {
        listEl.dataset.salahDelegated = '1';

        listEl.addEventListener('click', async (e) => {
          const b = e.target.closest('[data-salah]');

          if (!b || !listEl.contains(b)) return;

          e.preventDefault();
          e.stopPropagation();

          if (b.dataset.busy === '1') return;

          b.dataset.busy = '1';

          setTimeout(() => {
            try {
              delete b.dataset.busy;
            } catch (_) {}
          }, 500);

          const dsNow = dateStr(new Date());
          const fresh = await getDay(dsNow);
          const k = b.dataset.salah;

          fresh.salah[k] =
            fresh.salah[k] === 'completed'
              ? 'pending'
              : 'completed';

          await saveDay(dsNow, fresh);
          hydrateHome();
        }, { passive: false });
      }

      const completed = order.filter(([k]) =>
        day.salah[k] === 'completed'
      ).length;

      const routineVals = Object.values(day.routine || {});
      const routineDone = routineVals.filter(v => v).length;

      let quranRows = '';
      let anyQuran = false;

      if (day.quranVersesRead && typeof day.quranVersesRead === 'object') {
        for (const s of Object.keys(day.quranVersesRead)) {
          const arr = day.quranVersesRead[s];

          if (!Array.isArray(arr) || !arr.length) continue;

          const surahNum = parseInt(s, 10);
          const surMeta = SURAHS.find(x => x.num === surahNum);

          if (!surMeta) continue;

          const reached = Math.max(...arr);
          const total = surMeta.verses;
          const pct = Math.round((reached / total) * 100);

          anyQuran = true;

          quranRows += `<div class="checkrow" style="cursor:pointer;" data-quran-jump="${surahNum}">
                  <div class="rowtitle" style="flex:1">${surMeta.translit}</div>
                  <div style="font-weight:700">${reached} / ${total} \u00b7 ${pct}%</div>
                </div>`;
        }

      const quranBlock = anyQuran
        ? quranRows
        : `<div class="checkrow">
            <div class="rowtitle" style="flex:1">Qur\u2019an</div>
            <div style="font-weight:700">Not yet</div>
          </div>`;

      $('#progress-summary').innerHTML = `
            <div class="checkrow">
              <div class="rowtitle" style="flex:1">Salah</div>
              <div style="font-weight:700">${completed} / 5</div>
            </div>

              <div class="rowtitle" style="flex:1">Routine</div>
              <div style="font-weight:700">${routineDone} / ${routineVals.length || 0}</div>
            </div>
          `;

      $$('[data-quran-jump]').forEach(el => {
        el.onclick = () => {
          go('quran-reader', parseInt(el.dataset.quranJump, 10));
        };
      });
    }

      if (!el) return;

      const struct = getRoutineStruct();

      const picker = $('#routine-date');

      if (picker) {
        picker.onchange = () => {
          const v = picker.value;

          if (!v || v > today) {
            picker.value = today;
            toast('Cannot view future days.');
            return;
          }

          S.routineViewDate = v;
          render();
        };
      }

      const pastBanner = !isToday ? `
            <div class="card" style="margin-bottom:14px;background:var(--gold-dim);border-color:var(--gold);">

		              <div style="font-size:13px;color:var(--tx);line-height:1.6;">
                You are viewing <strong>${new Date(ds + 'T00:00:00').toDateString()}</strong>. Changes you make will be saved to that date.
              </div>
              <button class="btn btn-ghost btn-block" style="margin-top:10px;" id="routine-back-today">Jump to today</button>
            </div>` : '';

      const sections = struct.map(([secKey, secLabel, items], secIndex) => {
        const isFirstSec = secIndex === 0;
        const isLastSec = secIndex === struct.length - 1;

        return `
            <div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;">
              <div class="pg-sub" style="font-weight:600;color:var(--tx);margin:0;">${esc(secLabel)}</div>
              <div style="display:flex;gap:2px;align-items:center;">
                <button class="btn-text" data-move-sec-up="${secKey}" ${isFirstSec ? 'disabled style="opacity:.3;"' : ''} style="font-size:14px;padding:2px 6px;" title="Move section up">⬆</button>
                <button class="btn-text" data-move-sec-down="${secKey}" ${isLastSec ? 'disabled style="opacity:.3;"' : ''} style="font-size:14px;padding:2px 6px;" title="Move section down">⬇</button>
                <button class="btn-text" data-rename-sec="${secKey}" style="font-size:12px;padding:4px 8px;" title="Rename section">✎</button>
                <button class="btn-text" data-del-sec="${secKey}" style="font-size:12px;padding:4px 8px;color:var(--amber);" title="Delete section">🗑</button>
              </div>
            </div>

            <div class="card" style="margin-bottom:6px;">
            ${items.length === 0 ? `<div class="rowsub" style="padding:8px 4px;">No items yet — add one below.</div>` : ''}
            ${items.map(([ik, il], itemIndex) => {
          const done = !!day.routine[ik];
          const isFirstItem = itemIndex === 0;
          const isLastItem = itemIndex === items.length - 1;

          return `<div class="checkrow">
                <div style="display:flex;flex-direction:column;gap:2px;margin-right:6px;">
                  <button class="btn-text" data-move-item-up="${ik}" data-sec="${secKey}" ${isFirstItem ? 'disabled style="opacity:.3;"' : ''} style="font-size:10px;padding:0;line-height:1;" title="Move up">▲</button>
                  <button class="btn-text" data-move-item-down="${ik}" data-sec="${secKey}" ${isLastItem ? 'disabled style="opacity:.3;"' : ''} style="font-size:10px;padding:0;line-height:1;" title="Move down">▼</button>
                </div>
                <button class="chk ${done ? 'done' : ''}" data-r="${ik}"></button>
                <div style="flex:1;min-width:0;">
                  <div class="rowtitle" data-edit-item="${ik}" style="${done ? 'color:var(--tx2);text-decoration:line-through' : ''};cursor:pointer;" title="Tap to edit">${esc(il)}</div>
                </div>
                <button class="btn-text" data-del-item="${ik}" style="font-size:12px;padding:4px 8px;color:var(--amber);" title="Delete item">✕</button>
              </div>`;
        }).join('')}

            <button class="btn-text" data-add-item="${secKey}" style="display:block;width:100%;text-align:left;padding:10px 4px;color:var(--green-l);font-size:13px;font-weight:600;border-top:1px solid var(--border);margin-top:2px;">+ Add item to "${esc(secLabel)}"</button>
            </div>`;
      }).join('');

      const controls = `
            <div class="card" style="margin-top:14px;background:var(--bg2);">
              <button class="btn btn-ghost btn-block" id="routine-add-section" style="margin-bottom:8px;">+ Add new section</button>
              <button class="btn btn-ghost btn-block" id="routine-reset" style="color:var(--amber);">Reset routine to default</button>
            </div>`;

      el.innerHTML = pastBanner + sections + controls;

      const back = $('#routine-back-today');
      if (back) back.onclick = () => {
        S.routineViewDate = null;
        render();
      };

      // Delegated handler for routine checkboxes — same anti-replay guard
      if (!el.dataset.routineDelegated) {
        el.dataset.routineDelegated = '1';

        el.addEventListener('click', async (e) => {
          const b = e.target.closest('[data-r]');

          if (!b || !el.contains(b)) return;

          e.preventDefault();
          e.stopPropagation();

          if (b.dataset.busy === '1') return;

          b.dataset.busy = '1';

          setTimeout(() => {
            try {
              delete b.dataset.busy;
            } catch (_) {}
          }, 500);

          const dsNow = S.routineViewDate || dateStr(new Date());
          const fresh = await getDay(dsNow);
          const k = b.dataset.r;

          fresh.routine[k] = !fresh.routine[k];

          await saveDay(dsNow, fresh);
          hydrateRoutine();
        }, { passive: false });
      }

      $$('[data-edit-item]').forEach(el => el.onclick = async () => {
        const ik = el.dataset.editItem;
        const current = el.textContent;
        const next = prompt('Edit item name:', current);

        if (next === null) return;

        const trimmed = next.trim();

        if (!trimmed) {
          toast('Item name cannot be empty.');
          return;
        }

        const st = cloneRoutineStruct();

        for (const [, , items] of st) {
          for (const it of items) {
            if (it[0] === ik) {
              it[1] = trimmed;
            }
          }
        }

        await saveRoutineStruct(st);
        toast('Item updated.');
        hydrateRoutine();
      });

      $$('[data-del-item]').forEach(b => b.onclick = async (e) => {
        e.stopPropagation();

        const ik = b.dataset.delItem;

        if (!confirm('Delete this routine item?')) return;

        const st = cloneRoutineStruct().map(
          ([k, l, items]) => [k, l, items.filter(it => it[0] !== ik)]
        );

        await saveRoutineStruct(st);

        if (day.routine[ik] !== undefined) {
          delete day.routine[ik];
          await saveDay(ds, day);
        }

        toast('Item deleted.');
        hydrateRoutine();
      });

      $$('[data-add-item]').forEach(b => b.onclick = async () => {
        const secKey = b.dataset.addItem;
        const name = prompt('New routine item:');

        if (name === null) return;

        const trimmed = name.trim();

        if (!trimmed) {
          toast('Name cannot be empty.');
          return;
        }

        const st = cloneRoutineStruct();

        for (const [k, , items] of st) {
          if (k === secKey) {
            const ik =
              'x' +
              Date.now().toString(36) +
              Math.random().toString(36).slice(2, 5);

            items.push([ik, trimmed]);
          }
        }

        await saveRoutineStruct(st);
        toast('Item added.');
        hydrateRoutine();
      });

      const addSec = $('#routine-add-section');

      if (addSec) addSec.onclick = async () => {
        const label = prompt('New section name (e.g. "Study Time"):');

        if (label === null) return;

        const trimmed = label.trim();

        if (!trimmed) {
          toast('Section name cannot be empty.');
          return;
        }

        const st = cloneRoutineStruct();
        const secKey = 'sec' + Date.now().toString(36);

        st.push([secKey, trimmed, []]);

        await saveRoutineStruct(st);
        toast('Section added.');
        hydrateRoutine();
      };

      $$('[data-rename-sec]').forEach(b => b.onclick = async () => {
        const secKey = b.dataset.renameSec;
        const st = cloneRoutineStruct();
        const sec = st.find(s => s[0] === secKey);

        if (!sec) return;

        const next = prompt('Rename section:', sec[1]);

        if (next === null) return;

        const trimmed = next.trim();

        if (!trimmed) {
          toast('Section name cannot be empty.');
          return;
        }

        sec[1] = trimmed;

        await saveRoutineStruct(st);
        toast('Section renamed.');
        hydrateRoutine();
      });

      $$('[data-del-sec]').forEach(b => b.onclick = async () => {
        const secKey = b.dataset.delSec;

        if (!confirm('Delete this entire section and all its items?')) return;

        const st = cloneRoutineStruct().filter(([k]) => k !== secKey);

        await saveRoutineStruct(st);
        toast('Section deleted.');
        hydrateRoutine();
      });

      $$('[data-move-sec-up]').forEach(b => b.onclick = async () => {
        const secKey = b.dataset.moveSecUp;
        const st = cloneRoutineStruct();
        const idx = st.findIndex(s => s[0] === secKey);

        if (idx > 0) {
          [st[idx - 1], st[idx]] = [st[idx], st[idx - 1]];
          await saveRoutineStruct(st);
          hydrateRoutine();
        }
      });

      $$('[data-move-sec-down]').forEach(b => b.onclick = async () => {
        const secKey = b.dataset.moveSecDown;
        const st = cloneRoutineStruct();
        const idx = st.findIndex(s => s[0] === secKey);

        if (idx > -1 && idx < st.length - 1) {
          [st[idx + 1], st[idx]] = [st[idx], st[idx + 1]];
          await saveRoutineStruct(st);
          hydrateRoutine();
        }
      });

      $$('[data-move-item-up]').forEach(b => b.onclick = async () => {
        const ik = b.dataset.moveItemUp;
        const secKey = b.dataset.sec;
        const st = cloneRoutineStruct();
        const sec = st.find(s => s[0] === secKey);

        if (!sec) return;

        const items = sec[2];
        const idx = items.findIndex(it => it[0] === ik);

        if (idx > 0) {
          [items[idx - 1], items[idx]] = [items[idx], items[idx - 1]];
          await saveRoutineStruct(st);
          hydrateRoutine();
        }
      });

      $$('[data-move-item-down]').forEach(b => b.onclick = async () => {
        const ik = b.dataset.moveItemDown;
        const secKey = b.dataset.sec;
        const st = cloneRoutineStruct();
        const sec = st.find(s => s[0] === secKey);

        if (!sec) return;

        const items = sec[2];
        const idx = items.findIndex(it => it[0] === ik);

        if (idx > -1 && idx < items.length - 1) {
          [items[idx + 1], items[idx]] = [items[idx], items[idx + 1]];
          await saveRoutineStruct(st);
          hydrateRoutine();
        }
      });

      const rst = $('#routine-reset');

      if (rst) rst.onclick = async () => {
        if (!confirm('Reset the routine back to the default set of sections and items?')) return;

        await saveRoutineStruct(cloneDefaultRoutine());
        toast('Routine reset to default.');
        hydrateRoutine();
      };
    }

    function cloneRoutineStruct() {
      return getRoutineStruct().map(
        ([k, l, items]) => [k, l, items.map(([ik, il]) => [ik, il])]
      );
    }

    /* ============================= QUR'AN ============================= */

    function renderQuranLibrary() {
      return `
        <div class="pg-head">
          <div class="pg-title">Qur\u2019an</div>
          <div class="pg-sub">All 114 Surahs. A verified-source disclaimer applies where noted below.</div>
        </div>

        <div class="quran-fixed-top">
          <input id="quran-search" placeholder="Search by number, Arabic, English or transliteration">
          <div id="continue-reading"></div>
        </div>

        <div id="quran-grid" style="padding-top: 4px;"></div>

        <div class="card" style="margin-top:18px;background:var(--bg2)">
          <div class="rowsub" style="line-height:1.6">
            Full Qur\u2019an \u2014 all 114 surahs with <strong style="color:var(--green-l)">Uthmani Arabic</strong>,
            <strong style="color:var(--green-l)">Junagarhi Urdu</strong> (Indo-Pak standard), and English (Sahih International).
            Source: Al-Quran Cloud API.
          </div>
        </div>`;
    }

    async function hydrateQuranLibrary() {
      renderQuranGrid('');

      const s = $('#quran-search');

      if (s) {
        s.oninput = () => renderQuranGrid(s.value.trim().toLowerCase());
      }

      const fresh = await getJSON('quran-progress');

      if (fresh && fresh.surah && fresh.verse) {
        S.quranProgress = fresh;
      }

      const cr = $('#continue-reading');

      if (!cr) return;

      const p = S.quranProgress || { surah: 1, verse: 1 };

      if (p.surah === 1 && p.verse === 1) {
        cr.innerHTML = '';
        return;
      }

      const sur = SURAHS.find(x => x.num === p.surah);

      if (!sur) {
        cr.innerHTML = '';
        return;
      }

      cr.innerHTML = `<button class="card" data-nav="quran-reader" data-arg="${sur.num}" style="width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;">
            <div>
              <div class="rowsub">Continue reading</div>
              <div style="font-weight:700">${sur.translit} \u2014 Verse ${p.verse}</div>
            </div>
            ${ICONS.chevron}
          </button>`;

      $('[data-nav="quran-reader"]').onclick = () =>
        go('quran-reader', sur.num);
    }

    function renderQuranGrid(q) {
      const grid = $('#quran-grid');

      if (!grid) return;

      const list = SURAHS.filter(s =>
        !q ||
        String(s.num) === q ||
        s.arName.includes(q) ||
        s.enName.toLowerCase().includes(q) ||
        s.translit.toLowerCase().includes(q)
      );

      grid.innerHTML = list.map(s => {
        const has = S.completedSurahs.includes(s.num);

        return `<button class="card" data-open="${s.num}" style="width:100%;text-align:left;display:flex;align-items:center;gap:14px;margin-bottom:8px;">
            <div style="width:36px;height:36px;border-radius:10px;background:var(--card-el);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--tx2);flex-shrink:0;">${pad(s.num)}</div>

            <div style="flex:1;min-width:0;">
              <div style="display:flex;justify-content:space-between;">
                <span style="font-weight:600;">${s.translit}</span>
                <span class="arabic" style="font-size:17px;line-height:1;">${s.arName}</span>
              </div>

              <div class="rowsub">
                ${s.enName} \u2022 ${s.verses} verses \u2022 ${s.place}
              </div>
            </div>

            ${has
              ? `<span class="tag tag-green">Read</span>`
              : `<span class="tag tag-muted">Preview</span>`}

            </button>`;
      }).join('') || `<div class="empty">No surah matches your search.</div>`;

      $$('[data-open]').forEach(b =>
        b.onclick = () => go('quran-reader', parseInt(b.dataset.open))
      );
    }

    function renderQuranReader(num) {
      const s = SURAHS.find(x => x.num === num);

      if (!s) {
        setTimeout(() => go('quran-library'), 0);
        return `<div class="card empty">Loading Qur\u2019an library…</div>`;
      }

      setTimeout(() => fetchAndRenderQuran(num), 0);

      return `<button class="btn-text" data-nav="quran-library" style="display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;">
        ${ICONS.back} Qur\u2019an library
      </button>

      <div style="text-align:center;margin-bottom:22px;">
        <div class="arabic-q" style="font-size:26px;">${s.arName}</div>
        <div style="color:var(--tx2);font-size:14px;margin-top:4px;">
          ${s.translit} \u2014 ${s.enName} \u2022 ${s.verses} verses \u2022 ${s.place}
        </div>
      </div>

      <div class="card" style="text-align:center;padding:50px 20px;color:var(--tx2);">
        <div style="font-size:15px;margin-bottom:8px;">Loading full text\u2026</div>
        <div style="font-size:12px;color:var(--tx3);">
          Fetching Indo-Pak Qur\u2019an (Arabic + Urdu) from verified source
        </div>
      </div>`;
    }

    async function fetchAndRenderQuran(num) {
      try {
        let data = null;
        const cacheKey = 'quran-surah-v2-' + num;

        try {
          const cached = localStorage.getItem(cacheKey);

          if (cached) {
            const parsed = JSON.parse(cached);

            if (Date.now() - (parsed.__cachedAt || 0) < 30 * 24 * 3600 * 1000) {
              data = parsed;
            }
          }
        } catch (e) {}

        if (!data) {
          const url =
            'https://api.alquran.cloud/v1/surah/' +
            num +
            '/editions/quran-uthmani,en.sahih';

          const resp = await fetch(url);

          if (!resp.ok) {
            throw new Error('API error ' + resp.status);
          }

          const json = await resp.json();
          const arabic = json.data?.[0];
          const english = json.data?.[1];

          if (!arabic || !arabic.ayahs) {
            throw new Error('Invalid response');
          }

          data = {
            surah: num,
            name: arabic.name,
            englishName: arabic.englishName,
            numberOfAyahs: arabic.numberOfAyahs,
            revelationType: arabic.revelationType,

            verses: arabic.ayahs.map((a, i) => ({
              num: a.numberInSurah,
              ar: a.text,
              en: english?.ayahs?.[i]?.text || ''
            })),

            __cachedAt: Date.now()
          };

          try {
            localStorage.setItem(cacheKey, JSON.stringify(data));
          } catch (e) {}
        }

        const meta = SURAHS.find(x => x.num === num);

        if (S.screen !== 'quran-reader' || S.arg !== num) return;

        const container = $('.content');

        if (!container) return;

        const bismillah = (num !== 1 && num !== 9) ? `
            <div class="card" style="padding:18px;text-align:center;margin-bottom:18px;border-color:var(--green);background:var(--green-dim);">
              <div class="arabic-q" style="font-size:22px;">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
              <div style="font-size:12px;color:var(--tx3);margin-top:6px;">Bismillah ar-Rahman ar-Raheem</div>
            </div>` : '';

        container.innerHTML = `
            <button class="btn-text" data-nav="quran-library" style="display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;">
              ${ICONS.back} Qur\u2019an library
            </button>

            <div style="text-align:center;margin-bottom:22px;">
              <div class="arabic-q" style="font-size:28px;">${data.name}</div>
              <div style="color:var(--tx2);font-size:14px;margin-top:4px;">
                ${meta.translit} \u2014 ${meta.enName} \u2022 ${data.numberOfAyahs} verses \u2022 ${meta.place}
              </div>
            </div>

            ${bismillah}

            <div class="card" style="padding:14px;margin-bottom:16px;">
              <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
                <div style="flex:1;min-width:200px;">
                  <label style="font-size:12px;color:var(--tx3);display:block;margin-bottom:6px;">Reciter</label>
                  <div style="font-size:14px;font-weight:600;color:var(--tx);padding:6px 0;">Yasser Al-Dosari</div>
                  <div style="font-size:12px;color:var(--tx2);line-height:1.5;">
                    Soothing, calm, gentle — with Yasser CDN fallback for verse audio where needed.
                  </div>
                </div>

                <div style="display:flex;gap:8px;padding-top:18px;">
                  <button class="btn btn-primary" id="play-whole-surah">
                    ${(_qAudio && _isPlayingFullSurah && _currentSurahNum === num && !_qAudio.paused)
                      ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg> Pause`
                      : `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Play Surah`}
                  </button>
                </div>
              </div>
            </div>

            ${data.verses.map(v => {
          const bm = S.bookmarks.some(b => b.surah === num && b.verse === v.num);

          return `
              <div class="card" data-verse-num="${v.num}" style="margin-bottom:14px;padding:20px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                  <div style="display:flex;align-items:center;gap:8px;">
                    <button class="btn-text" data-play="${num}:${v.num}" style="display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 6px;">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                      </svg>
                      Play
                    </button>

                    <span class="tag tag-green" style="font-size:11px;">
                      ${meta.translit} ${v.num}
                    </span>
                  </div>

                  <button class="btn-text" data-bm="${v.num}" style="display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 6px;">
                    ${ICONS.bookmark}
                    ${bm ? 'Saved' : 'Save'}
                  </button>
                </div>

                <div class="arabic-q" style="font-size:24px;line-height:2.15;text-align:right;">
                  ${v.ar}
                </div>

                <div style="margin-top:14px;font-size:13.5px;color:var(--tx2);line-height:1.7;">
                  ${v.en}
                </div>
              </div>`;
            }).join('')}

            <div class="card" style="margin-top:18px;background:var(--bg2);">
              <div class="rowsub" style="line-height:1.6;">
                Qur\u2019an text source: Al-Quran Cloud API. Audio uses the configured reciter/CDN fallback.
              </div>
            </div>`;

        bindQuranReader(num);
      } catch (e) {
        console.error('Quran load error:', e);

        const container = $('.content');

        if (container) {
          container.innerHTML = `
            <div class="card">
              <div style="font-weight:700;margin-bottom:8px;">Could not load this Surah</div>
              <div class="rowsub">Please check your internet connection and try again.</div>
              <button class="btn btn-primary" style="margin-top:12px;" onclick="fetchAndRenderQuran(${num})">
                Try again
              </button>
            </div>`;
        }
      }
    }

    /* ============================= HADITH ============================= */

    function renderHadith() {
      const cats = [...new Set(HADITH.map(h => h.cat))];
      const activeCat = S.hadithCat || 'All';
      const allCats = ['All', ...cats];

      return `<div class="pg-head">
          <div class="pg-title">Hadith</div>
          <div class="pg-sub">A small library of well-established, authentically graded narrations.</div>
        </div>

        <div class="hadith-fixed-top">
          <div style="display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;">
            ${allCats.map(c => `
              <button data-hadcat="${c}" style="flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:600;border:1px solid ${activeCat === c ? 'var(--green)' : 'var(--border)'};background:${activeCat === c ? 'var(--green-dim)' : 'var(--card-el)'};color:${activeCat === c ? 'var(--green-l)' : 'var(--tx2)'};">${c}</button>
            `).join('')}
          </div>
        </div>

        <div id="hadith-list"></div>`;
    }

    function bindHadith() {
      const renderList = () => {
        const container = document.getElementById('hadith-list');

        if (!container) return;

        const cats = [...new Set(HADITH.map(h => h.cat))];
        const activeCat = S.hadithCat || 'All';

    let _ramadanTimer = null;

    function _hijriFromJD(jd) {
      const islamic = jd - 1948439.5;
      const cycles = Math.floor(islamic / 10631);
      let rem = islamic - cycles * 10631;
      let yearIdx = Math.floor(rem / 354.36667);
      rem -= Math.floor(yearIdx * 354.36667);

      const leapInCycle = [2, 5, 7, 10, 13, 16, 18, 21, 24, 26, 29];
      const isLeapYear = leapInCycle.includes(yearIdx + 1);

      const monthLens = [30, 29, 30, 29, 30, 29, 30, 29, 30, 29, 30, isLeapYear ? 30 : 29];

      let daysLeft = Math.floor(rem);
      let month = 1, day = 1;

      for (let m = 0; m < 12; m++) {
        if (daysLeft < monthLens[m]) {
          month = m + 1;
          day = daysLeft + 1;
          break;
        }

        daysLeft -= monthLens[m];
      }

      return {
        day,
        month,
        year: cycles * 30 + yearIdx + 1
      };
    }

    function _julianDay(y, m, d) {
      if (m <= 2) {
        y -= 1;
        m += 12;
      }

      const A = Math.floor(y / 100);
      const B = 2 - A + Math.floor(A / 4);

      return Math.floor(365.25 * (y + 4716)) +
        Math.floor(30.6001 * (m + 1)) +
        d +
        B -
        1524.5;
    }

    function _hijriFromDate(d) {
      try {
        const parts = new Intl.DateTimeFormat(
          'en-u-ca-islamic-umalqura',
          {
            day: 'numeric',
            month: 'numeric',
            year: 'numeric'
          }
        ).formatToParts(d);

        const day = parseInt(
          parts.find(p => p.type === 'day')?.value || '0',
          10
        );

        const month = parseInt(
          parts.find(p => p.type === 'month')?.value || '0',
          10
        );

        const year = parseInt(
          parts.find(p => p.type === 'year')?.value || '0',
          10
        );

        if (
          day > 0 &&
          month > 0 &&
          year > 0 &&
          month <= 12
        ) {
          return { day, month, year };
        }
      } catch (e) {}

      return _hijriFromJD(
        _julianDay(
          d.getFullYear(),
          d.getMonth() + 1,
          d.getDate()
        )
      );
    }

    function _findRamadanStart(nearDate) {
      let best = null;
      let bestDist = Infinity;

      for (let i = -400; i <= 400; i++) {
        const d = new Date(nearDate);

        d.setHours(0, 0, 0, 0);
        d.setDate(d.getDate() + i);

        const h = _hijriFromDate(d);

        if (h.month === 9 && h.day === 1) {
          const dist = Math.abs(d - nearDate);

          if (dist < bestDist) {
            best = d;
            bestDist = dist;
          }
        }
      }

      return best;
    }

    function _findShawwalStart(ramadanStart) {
      for (let i = 1; i <= 40; i++) {
        const d = new Date(ramadanStart);

        d.setDate(d.getDate() + i);

        const h = _hijriFromDate(d);

        if (h.month === 10 && h.day === 1) {
          return d;
        }
      }

      const fb = new Date(ramadanStart);
      fb.setDate(fb.getDate() + 30);

      return fb;
    }

    function _startRamadanCountdown(target) {
      if (_ramadanTimer) {
        clearInterval(_ramadanTimer);
      }

      const tick = () => {
        const el = document.getElementById('ramadan-countdown');

        if (!el) {
          clearInterval(_ramadanTimer);
          _ramadanTimer = null;
          return;
        }

        const now = new Date();
        let diff = target - now;

        if (diff <= 0) {
          el.innerHTML = `
            <div style="font-size:22px;font-weight:800;color:var(--green-l);">
              Ramadan Mubarak!
            </div>`;

          clearInterval(_ramadanTimer);
          _ramadanTimer = null;
          return;
        }

        const d = Math.floor(diff / 86400000);
        diff -= d * 86400000;

        const h = Math.floor(diff / 3600000);
        diff -= h * 3600000;

        const m = Math.floor(diff / 60000);
        diff -= m * 60000;

        const s = Math.floor(diff / 1000);

        const cell = (v, lab) =>
          `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
            <div style="font-size:34px;font-weight:800;color:var(--green-l);line-height:1;font-variant-numeric:tabular-nums;">

              ${lab}
            </div>
          </div>`;

        el.innerHTML = `
          <div style="display:flex;justify-content:center;gap:16px;align-items:flex-start;">
            ${cell(d, 'Days')}

            <div style="font-size:28px;font-weight:800;color:var(--tx3);line-height:1;">

            </div>

            ${cell(h, 'Hours')}

            <div style="font-size:28px;font-weight:800;color:var(--tx3);line-height:1;">
              :
            </div>

            ${cell(m, 'Minutes')}

            <div style="font-size:28px;font-weight:800;color:var(--tx3);line-height:1;">
              :
            </div>

            ${cell(s, 'Seconds')}
          </div>`;
      };

      tick();

      _ramadanTimer = setInterval(tick, 1000);
    }

    async function hydrateTracker() {
      const range = S.trackerRange || 'week';

      const sel = document.getElementById('tracker-range');

      if (sel) {
        sel.onchange = () => {
          S.trackerRange = sel.value;
          hydrateTracker();
        };
      }

      const now = new Date();
      const todayStr = dateStr(now);
      let days = [];

      if (range === 'week') {
        const dayOfWeek = now.getDay();
        const mondayOffset =
          dayOfWeek === 0 ? -6 : 1 - dayOfWeek;

        const monday = new Date(now);

        monday.setDate(now.getDate() + mondayOffset);
        monday.setHours(0, 0, 0, 0);

        for (let i = 0; i < 7; i++) {
          const d = new Date(monday);

          d.setDate(monday.getDate() + i);

          days.push(d);
        }
      } else {
        const y = now.getFullYear();
        const m = now.getMonth();
        const daysInMonth =
          new Date(y, m + 1, 0).getDate();

        for (let d = 1; d <= daysInMonth; d++) {
          days.push(new Date(y, m, d));
        }
      }

      const todayStr2 = dateStr(new Date());

      const allRecords = await Promise.all(
        days.map(dd => {
          const ds = dateStr(dd);

          if (ds === todayStr2) {
            delete S.dayCache[ds];
            return getJSON('day:' + ds);
          }

          if (S.dayCache[ds]) {
            return Promise.resolve(S.dayCache[ds]);
          }

          return getJSON('day:' + ds);
        })
      );

      const emptyDay = () => ({
        salah: {},
        routine: {},
        adhkar: {},
        quranVerses: 0,
        quranVersesRead: {}
      });

      let totalPct = 0;
      let countedDays = 0;

      let catTotals = {
        salah: 0,
        salahMax: 0,
        routine: 0,
        routineMax: 0,
        adhkar: 0,
        adhkarMax: 0,
        quranVerses: 0,
        quranVersesMax: 0
      };

      let dayResults = [];

      const routineMaxFromStruct =
        getRoutineStruct().reduce(
          (sum, s) => sum + s[2].length,
          0
        ) || 16;

      for (let i = 0; i < days.length; i++) {
        const dd = days[i];
        const ds = dateStr(dd);
        const isFuture = dd > now && ds !== todayStr;

        // A day with no record is treated as an empty (0%) day.
        const rec = allRecords[i] || emptyDay();

        let salahDone = 0;
        let salahMax = 5;

        let routineDone = 0;
        let routineMax = routineMaxFromStruct;

        let adhkarDone = 0;
        let adhkarMax = 2;

        let quranVerses = 0;
        let quranGoal = 50;

        salahDone =
          Object.values(rec.salah || {})
            .filter(v => v === 'completed').length;

        const rv = Object.values(rec.routine || {});
        routineDone = rv.filter(Boolean).length;

        adhkarDone =
          (rec.adhkar?.morning ? 1 : 0) +
          (rec.adhkar?.evening ? 1 : 0);

        // Qur'an contributes the full 15% for a day as soon as at least
        // one verse is bookmarked/read that day.
        let quranActivity = false;

        if (
          rec.quranVersesRead &&
          typeof rec.quranVersesRead === 'object'
        ) {
          for (const sur of Object.keys(rec.quranVersesRead)) {
            const arr = rec.quranVersesRead[sur];

            if (Array.isArray(arr) && arr.length) {
              quranActivity = true;
              break;
            }
          }
        }

        if (!quranActivity && rec.quranVerses > 0) {
          quranActivity = true;
        }

        // A bookmark is also valid Qur'an activity for that bookmark's date.
        // This lets even one bookmarked verse contribute the full 15% for that day.
        if (!quranActivity && Array.isArray(S.bookmarks)) {
          quranActivity = S.bookmarks.some(bm => {
            if (!bm || !bm.date || !bm.surah || !bm.verse) return false;

            const bmDate = new Date(bm.date);

            return !Number.isNaN(bmDate.getTime()) &&
              dateStr(bmDate) === ds;
          });
        }

        quranVerses = quranActivity ? quranGoal : 0;

        const pS = salahMax
          ? salahDone / salahMax
          : 0;

        const pR = routineMax
          ? routineDone / routineMax
          : 0;

        const pA = adhkarMax
          ? adhkarDone / adhkarMax
          : 0;

        const pQ = quranGoal
          ? Math.min(quranVerses / quranGoal, 1)
          : 0;

        const dayPct = Math.round(
          pS * 40 +
          pR * 30 +
          pA * 15 +
          pQ * 15
        );

        catTotals.salah += salahDone;
        catTotals.salahMax += salahMax;

        catTotals.routine += routineDone;
        catTotals.routineMax += routineMax;

        catTotals.adhkar += adhkarDone;
        catTotals.adhkarMax += adhkarMax;

        catTotals.quranVerses += quranVerses;
        catTotals.quranVersesMax += quranGoal;

        if (!isFuture) {
          totalPct += dayPct;
          countedDays++;
        }

        dayResults.push({
          ds,
          dayPct,
          rec,
          dd,
          isFuture
        });
      }

      // ---- Weekly / Monthly average ----
      // Every PAST day counts, whether or not it was opened/ticked.
      // Future days are ignored so the rest of the week doesn't drag you down.
      let pctSum = 0;
      let pastDays = 0;

      for (const dr of dayResults) {
        if (dr.isFuture) continue;

        pastDays++;

        const rec = dr.rec || emptyDay();

        const salahDone =
          Object.values(rec.salah || {})
            .filter(v => v === 'completed').length;

        const salahPct =
          (salahDone / 5) * 100;

        const routineDone =
          Object.values(rec.routine || {})
            .filter(Boolean).length;

        const rMax =
          getRoutineStruct().reduce(
            (s, x) => s + x[2].length,
            0
          ) || 16;

        const routinePct =
          (routineDone / rMax) * 100;

        const adhkarDone =
          (rec.adhkar?.morning ? 1 : 0) +
          (rec.adhkar?.evening ? 1 : 0);

        const adhkarPct =
          (adhkarDone / 2) * 100;

        let quranPct = 0;
        let readSomething = false;

        if (
          rec.quranVersesRead &&
          typeof rec.quranVersesRead === 'object'
        ) {
          for (const s of Object.keys(rec.quranVersesRead)) {
            const arr = rec.quranVersesRead[s];

            if (Array.isArray(arr) && arr.length) {
              readSomething = true;
              break;
            }
          }
        }

        if (!readSomething && rec.quranVerses > 0) {
          readSomething = true;
        }

        // A bookmark on this date also counts as Qur'an activity.
        if (!readSomething && Array.isArray(S.bookmarks)) {
          readSomething = S.bookmarks.some(bm => {
            if (!bm || !bm.date || !bm.surah || !bm.verse) return false;

            const bmDate = new Date(bm.date);

            return !Number.isNaN(bmDate.getTime()) &&
              dateStr(bmDate) === dr.ds;
          });
        }

        // Any Qur'an activity gives the full Qur'an category weight of 15% for that day.
        if (readSomething) {
          quranPct = 100;
        }

        const dayScore =
          salahPct * 0.40 +
          routinePct * 0.30 +
          adhkarPct * 0.15 +
          quranPct * 0.15;

        pctSum += dayScore;
      }

      const avgPct =
        pastDays > 0
          ? Math.round(pctSum / pastDays)
          : 0;

      // ---------- OVERALL CARD ----------
      const overall =
        document.getElementById('tracker-overall');

      if (overall) {
        let trend = '';

        if (range === 'week') {
          const first3 =
            dayResults
              .slice(0, 3)
              .filter(d => !d.isFuture);

          const last3 =
            dayResults
              .slice(4, 7)
              .filter(d => !d.isFuture);

          const avgOf = arr =>
            arr.length
              ? Math.round(
                  arr.reduce(
                    (s, x) => s + x.dayPct,
                    0
                  ) / arr.length
                )
              : null;

          const a1 = avgOf(first3);
          const a2 = avgOf(last3);

          if (a1 !== null && a2 !== null) {
            const diff = a2 - a1;

            if (diff >= 5) {
              trend = `
                <span style="color:var(--green-l);font-size:13px;font-weight:600;">
                  ↑ Up ${diff}%
                </span>`;
            } else if (diff <= -5) {
              trend = `
                <span style="color:var(--amber);font-size:13px;font-weight:600;">
                  ↓ Down ${Math.abs(diff)}%
                </span>`;
            } else {
              trend = `
                <span style="color:var(--tx3);font-size:13px;font-weight:600;">
                  → Steady
                </span>`;
            }
          }
        }

        const totalDays =
          range === 'week'
            ? 7
            : days.length;

        overall.innerHTML = `
          <div style="padding:18px 20px;">
            <div style="position:relative;">
              <div class="rowsub" style="margin-bottom:2px;">
                ${range === 'week'
                  ? 'Weekly average'
                  : 'Monthly average'}
              </div>

              <div style="font-size:30px;font-weight:800;color:var(--green-l);">
                ${avgPct}%
              </div>

              <div style="margin-top:4px;">
                ${trend}
              </div>
            </div>
          </div>`;
      }

	        viewport.addEventListener('pointermove', (e) => {
        if (!_cropperState.img) return;
        e.preventDefault();

        if (

        ) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );

          const scaleFactor =
            dist / _cropperState.startPinchDist;

          _cropperState.zoom = Math.max(
            1,
            Math.min(
              4,
              _cropperState.startZoom * scaleFactor
            )
          );

          slider.value = _cropperState.zoom;
          updateCropperTransform();
        } else if (_cropperState.isDragging) {
          _cropperState.offsetX =
            e.clientX - _cropperState.startX;

          _cropperState.offsetY =
            e.clientY - _cropperState.startY;

          updateCropperTransform();
        }
      });

      const endDrag = (e) => {
        _cropperState.isDragging = false;
        _cropperState.isPinching = false;

        try {
          viewport.releasePointerCapture(e.pointerId);
        } catch (_) {}
      };

      viewport.addEventListener('pointerup', endDrag);

    function cropAndResize(state) {
      return new Promise((resolve, reject) => {
        const imgEl = $('#pfp-crop-image');

        if (!imgEl) {
          return reject('No image element');
        }

        const canvas = document.createElement('canvas');
        const size = 200;

        canvas.width = size;
        canvas.height = size;

        const ctx = canvas.getContext('2d');

        const viewport =
          $('#pfp-crop-viewport').getBoundingClientRect();

        const vw = viewport.width;
        const vh = viewport.height;

        const totalScale =
          state.baseScale * state.zoom;

        const viewportCenterX = vw / 2;
        const viewportCenterY = vh / 2;

        const imgCenterX =
          viewportCenterX + state.offsetX;

        const imgCenterY =
          viewportCenterY + state.offsetY;

        const sx =
          (imgCenterX - vw / 2) / totalScale;

        const sy =
          (imgCenterY - vh / 2) / totalScale;

        const sWidth =
          vw / totalScale;

        const sHeight =
          vh / totalScale;

        ctx.drawImage(
          imgEl,
          sx,
          sy,
          sWidth,
          sHeight,
          0,
          0,
          size,
          size
        );

        resolve(
          canvas.toDataURL(
            'image/jpeg',
            0.7
          )
        );
      });
    }

                  sharpness: 128
                }
              ]
            },
            audio: false
          });

        video.srcObject = _webcamStream;

        // Force the camera out of any auto-boosted "low light" mode.
        // Some cheap webcams ignore `advanced` in the initial call —
        // re-applying on the live track fixes the orange cast.
        try {
          const track =
            _webcamStream.getVideoTracks()[0];

          const caps =
            track.getCapabilities
              ? track.getCapabilities()
              : {};

          const wants = {};

          if (
            caps.exposureMode &&
            caps.exposureMode.includes('continuous')
          ) {
            wants.exposureMode = 'continuous';
          }

          if (
            caps.whiteBalanceMode &&
            caps.whiteBalanceMode.includes('continuous')
          ) {
            wants.whiteBalanceMode = 'continuous';
          }

          if (caps.colorTemperature) {
            wants.colorTemperature = 5200;
          }

          if (caps.brightness) {
            wants.brightness = 128;
          }

          if (caps.contrast) {
            wants.contrast = 128;
          }

          if (caps.saturation) {
            wants.saturation = 100;
          }

          if (Object.keys(wants).length) {
            await track
              .applyConstraints({
                advanced: [wants]
              })
              .catch(() => {});
          }
        } catch (_) {}
      } catch (e) {
        console.warn('Camera error:', e);

        let msg =
          'Could not access the camera.';

        if (e.name === 'NotAllowedError') {
          msg =
            'Camera permission was denied. Allow camera access in your browser settings, or use "Choose from gallery".';
        } else if (
          e.name === 'NotFoundError' ||
          e.name === 'DevicesNotFoundError'
        ) {
          msg =
            'No camera found on this device. Please use "Choose from gallery" instead.';
        } else if (
          e.name === 'NotReadableError'
        ) {
          msg =
            'Your camera is already in use by another app. Close it and try again.';
        }

        errEl.textContent = msg;
        errEl.classList.add('show');
      }
    }

    function closeWebcam() {
      const overlay = $('#webcam-overlay');
      const video = $('#webcam-video');

      if (!overlay) return;

      if (_webcamStream) {
        try {
          _webcamStream
            .getTracks()
            .forEach(t => t.stop());
        } catch (e) {}

        _webcamStream = null;
      }

      if (video) {
        video.srcObject = null;
      }

      overlay.classList.remove('show');

      setTimeout(() => {
        overlay.style.display = 'none';
      }, 200);
    }

    function captureWebcamPhoto() {
      const video = $('#webcam-video');
      const canvas = $('#webcam-canvas');

      if (!video || !canvas || !_webcamStream) {
        return;
      }

      const vw = video.videoWidth;
      const vh = video.videoHeight;

      if (!vw || !vh) {
        toast(
          'Camera not ready yet. Wait a moment and try again.'
        );

        return;
      }

      const side = Math.min(vw, vh);

      const sx = (vw - side) / 2;
      const sy = (vh - side) / 2;

      const size = 200;

      canvas.width = size;
      canvas.height = size;

      const ctx = canvas.getContext('2d');

      ctx.translate(size, 0);
      ctx.scale(-1, 1);

      ctx.drawImage(
        video,
        sx,
        sy,
        side,
        side,
        0,
        0,
        size,
        size
      );

      const dataUrl =
        canvas.toDataURL(
          'image/jpeg',
          0.7
        );

      (async () => {
        try {
          closeWebcam();

          await setJSON('pfp', {
            dataUrl
          });

          S.profile = S.profile || {};
          S.profile.photoURL = dataUrl;

          toast(
            'Profile picture updated.'
          );

          render();
        } catch (e) {
          console.error(e);
          toast('Could not save image.');
        }
      })();
    }
