      color: var(--amber);
    }

      color: var(--amber);
    }

    /* ==================== DESKTOP WEBCAM MODAL ==================== */
    .webcam-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      transition: opacity .2s ease;
    }

    .webcam-overlay.show {
      display: flex;
      opacity: 1;
    }

    .webcam-modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 22px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
      transform: translateY(10px) scale(.98);
      transition: transform .2s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .webcam-overlay.show .webcam-modal {
      transform: translateY(0) scale(1);
    }

    .webcam-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--tx3);
      background: transparent;
      padding: 0;
      transition: background .15s, color .15s;
    }

    .webcam-close:hover {
      background: var(--card-el);
      color: var(--tx);
    }

    .webcam-viewport {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      background: #1a1a1a;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      isolation: isolate;
    }

    .webcam-viewport video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1) translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
      filter: none;
      background: transparent;
    }

    .webcam-error {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: var(--tx2);
      font-size: 13.5px;
      line-height: 1.6;
      background: var(--card-el);
    }

    .webcam-error.show {
      display: flex;
    }

    .webcam-actions {
      display: flex;
      gap: 10px;
    }

    /* ============ MOBILE PROFILE — Saved Ayahs (matches desktop) ============ */
    @media (max-width: 880px) {
      body.profile-locked .main {
        height: 100vh;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      body.profile-locked .topbar {
        flex-shrink: 0;
        position: relative;
        z-index: 100;
        background: var(--bg2);
      }

      body.profile-locked .content {
        flex: 1 1 auto;

        height: auto;
        padding: 0 16px calc(80px + env(safe-area-inset-bottom));

        flex-direction: column;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;

      body.profile-locked .profile-head,

      body.profile-locked .profile-bookmarks-heading,

      body.profile-locked .profile-bookmarks-box {
        flex: 0 0 auto !important;

        max-height: 160px !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;

        scrollbar-width: auto !important;
        scrollbar-color: var(--border) transparent !important;

      body.profile-locked .profile-bookmarks-box::-webkit-scrollbar {
        width: 8px !important;
        height: 8px !important;
      }

      body.profile-locked .profile-bookmarks-box::-webkit-scrollbar-track {
        background: transparent !important;
      }

      body.profile-locked .profile-bookmarks-box::-webkit-scrollbar-thumb {
        background: var(--border) !important;
        border-radius: 8px !important;
      }

      body.profile-locked .profile-bookmarks-box::-webkit-scrollbar-thumb:hover {
        background: var(--tx3) !important;

      body.profile-locked .profile-actions-row {
        display: grid !important;

      body.profile-locked .profile-actions-row > button {
        width: 100% !important;
        margin: 0 !important;
        padding: 12px 8px !important;
        font-size: 13.5px !important;
        white-space: nowrap !important;
        justify-content: center !important;
      }
    }

    /* ============================= HELPERS ============================= */
    const $ = s => document.querySelector(s);
    const $$ = s => Array.from(document.querySelectorAll(s));
    const dtr = d => d * Math.PI / 180;
    const rtd = r => r * 180 / Math.PI;
    const dsin = d => Math.sin(d * Math.PI / 180);
    const dcos = d => Math.cos(d * Math.PI / 180);
    const dtan = d => Math.tan(d * Math.PI / 180);
    const darcsin = x => Math.asin(Math.max(-1, Math.min(1, x))) * 180 / Math.PI;
    const darccos = x => Math.acos(Math.max(-1, Math.min(1, x))) * 180 / Math.PI;
    const darctan = x => Math.atan(x) * 180 / Math.PI;
    const darctan2 = (y, x) => Math.atan2(y, x) * 180 / Math.PI;
    const fixAngle = a => {
      a = a % 360;
      return a < 0 ? a + 360 : a;
    };

    function pad(n) {
      return String(n).padStart(2, '0');

    function dateStr(d) {
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

    function fmtTime(d) {
      if (!d) return '--:--';
      let h = d.getHours(), m = d.getMinutes();
      let ap = h >= 12 ? 'PM' : 'AM';
      let h12 = h % 12;
      if (h12 === 0) h12 = 12;
      return h12 + ':' + pad(m) + ' ' + ap;
    }

    function fmtDur(ms) {
      if (ms < 0) ms = 0;
      let s = Math.floor(ms / 1000);
      let h = Math.floor(s / 3600);
      s -= h * 3600;
      let m = Math.floor(s / 60);
      s -= m * 60;
      return pad(h) + ':' + pad(m) + ':' + pad(s);
    }

    /* ============================= ADHKAR SPEECH ============================= */
    let _speechCurrentBtn = null;
    let _arAudio = null;
    let _arabicVoice = null;

    function _pickArabicVoice() {
      const voices = window.speechSynthesis.getVoices() || [];

      const preferred = [
        v => /^ar-SA/i.test(v.lang),
        v => /^ar-EG/i.test(v.lang),
        v => /^ar/i.test(v.lang),
        v => /Arabic/i.test(v.name),
      ];

      for (const t of preferred) {
        const found = voices.find(t);
        if (found) {
          _arabicVoice = found;
          return found;
        }
      }

      return null;
    }

    if (typeof window !== 'undefined' && window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = () => {
        _pickArabicVoice();
      };
      _pickArabicVoice();
    }

    function _playArabic(text) {
      return new Promise((resolve) => {
        const synth = window.speechSynthesis;

        if (!synth || !text || !text.trim()) {
          resolve();
          return;
        }

        if (!_arabicVoice) _pickArabicVoice();

        const u = new SpeechSynthesisUtterance(text);
        u.lang = (_arabicVoice && _arabicVoice.lang)
          ? _arabicVoice.lang
          : 'ar-SA';

        if (_arabicVoice) u.voice = _arabicVoice;

        u.rate = 0.85;
        u.pitch = 1.0;
        u.volume = 1.0;

        let done = false;

        const finish = () => {
          if (done) return;
          done = true;
          resolve();
        };

        u.onend = finish;
        u.onerror = finish;

        synth.speak(u);

        setTimeout(
          finish,
          Math.min(30000 + text.length * 100, 90000)
        );
      });
    }

    function _loadVoices() {
      return new Promise((resolve) => {
        const synth = window.speechSynthesis;

        if (!synth) return resolve([]);

        let voices = synth.getVoices();

        if (voices && voices.length) {
          return resolve(voices);
        }

        let tries = 0;

        const iv = setInterval(() => {
          voices = synth.getVoices();
          tries++;

          if ((voices && voices.length) || tries > 20) {
            clearInterval(iv);
            resolve(voices || []);
          }
        }, 120);
      });
    }

    function _pickEnglishVoice(voices) {
      if (!voices || !voices.length) {
        voices = window.speechSynthesis.getVoices() || [];
      }

      const preferred = [
        v => /Google UK English Female/i.test(v.name),
        v => /Google US English/i.test(v.name),
        v => /Microsoft (Aria|Jenny|Guy|Zira|David)/i.test(v.name),
        v => /Samantha/i.test(v.name),
        v => v.lang === 'en-GB',
        v => v.lang === 'en-US',
        v => /^en/i.test(v.lang),
      ];

      for (const t of preferred) {
        const f = voices.find(t);
        if (f) return f;
      }

      return null;
    }

    function _playEnglish(text, onDone) {
      const synth = window.speechSynthesis;

      if (!synth || !text) {
        if (onDone) onDone();
        return;
      }

      const voices = synth.getVoices() || [];
      const enVoice = _pickEnglishVoice(voices);

      const u = new SpeechSynthesisUtterance(text);

      u.lang = (enVoice && enVoice.lang)
        ? enVoice.lang
        : 'en-US';

      if (enVoice) u.voice = enVoice;

      u.rate = 0.95;

      u.onend = () => {
        if (onDone) onDone();
      };

      u.onerror = () => {
        if (onDone) onDone();
      };

      synth.speak(u);
    }

    function _stopSpeech() {
      try {
        window.speechSynthesis.cancel();
      } catch (e) {}

      if (_arAudio) {
        try {
          _arAudio.pause();
        } catch (e) {}
        _arAudio = null;
      }

      if (_speechCurrentBtn) {
        _speechCurrentBtn.innerHTML =
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Play';

        _speechCurrentBtn = null;
      }
    }

    async function speakAdhkar(btnEl, arabic, english) {
      if (_speechCurrentBtn === btnEl) {
        _stopSpeech();
        return;
      }

      _stopSpeech();

      await _loadVoices();

      _speechCurrentBtn = btnEl;

      btnEl.innerHTML =
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg> Pause';

      const finish = () => {
        if (_speechCurrentBtn === btnEl) {
          btnEl.innerHTML =
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Play';

          _speechCurrentBtn = null;
        }
      };

      if (arabic && arabic.trim()) {
        await _playArabic(arabic);

        if (english && english.trim()) {
          _playEnglish(english, finish);
        } else {
          finish();
        }
      } else if (english && english.trim()) {
        _playEnglish(english, finish);
      } else {
        finish();
      }
    }

    if (typeof window !== 'undefined' && window.speechSynthesis) {
      _loadVoices();
    }

    function _lsKey(key) {
      const uid = window.fb?.auth?.currentUser?.uid || 'guest';
      return 'u:' + uid + ':' + key;
    }

    async function getJSON(key) {
      try {
        const v = localStorage.getItem(_lsKey(key));

        if (v !== null) {
          const parsed = JSON.parse(v);

          if (parsed !== null) {
            return parsed;
          }
        }
      } catch (e) {}

      try {
        const v = localStorage.getItem(key);

        if (v !== null) {
          const parsed = JSON.parse(v);

          if (parsed !== null) {
            return parsed;
          }
        }
      } catch (e) {}

      try {
        const user = window.fb?.auth?.currentUser;

        if (user) {
          const ref = window.fb.doc(
            window.fb.db,
            'users',
            user.uid,
            'data',
            key
          );

          const snap = await window.fb.getDoc(ref);

          if (snap.exists()) {
            const val = snap.data().value;

            localStorage.setItem(
              _lsKey(key),
              JSON.stringify(val)
            );

            return val;
          }
        }
      } catch (e) {
        console.warn('cloud read failed', e);
      }

      return null;
    }

    async function setJSON(key, val) {
      try {
        localStorage.setItem(
          _lsKey(key),
          JSON.stringify(val)
        );
      } catch (e) {}

      try {
        const user = window.fb?.auth?.currentUser;

        if (user) {
          const ref = window.fb.doc(
            window.fb.db,
            'users',
            user.uid,
            'data',
            key
          );

          await window.fb.setDoc(
            ref,
            {
              value: val,
              updatedAt: Date.now()
            }
          );
        }
      } catch (e) {
        console.warn('cloud write failed', e);
      }

      return true;
    }

    /* ---- Real-time cloud sync ---- */
    const _cloudListeners = {};

    function subscribeToKey(key, onRemoteChange) {
      const user = window.fb?.auth?.currentUser;

      if (!user) return;

      const listenerId = user.uid + ':' + key;

      if (_cloudListeners[listenerId]) {
        try {
          _cloudListeners[listenerId]();
        } catch (e) {}

        delete _cloudListeners[listenerId];
      }

      try {
        const ref = window.fb.doc(
          window.fb.db,
          'users',
          user.uid,
          'data',
          key
        );

        const unsub = window.fb.onSnapshot(
          ref,
          (snap) => {
            if (!snap.exists()) return;

            const val = snap.data().value;

            try {
              localStorage.setItem(
                _lsKey(key),
                JSON.stringify(val)
              );
            } catch (e) {}

            onRemoteChange(val);
          },
          (err) => {
            console.warn(
              'Cloud listener error for',
              key,
              err
            );

            delete _cloudListeners[listenerId];
          }
        );

        _cloudListeners[listenerId] = unsub;
      } catch (e) {
        console.warn(
          'Failed to subscribe to',
          key,
          e
        );
      }
    }

    function unsubscribeAllCloudListeners() {
      Object.keys(_cloudListeners).forEach(k => {
        try {
          _cloudListeners[k]();
        } catch (e) {}

        delete _cloudListeners[k];
      });
    }

    /* ============================= PRAYER CALCULATION ============================= */
    const CALC_METHODS = {
      MWL: {
        label: 'Muslim World League',
        fajr: 18,
        ishaAngle: 17
      },

      ISNA: {
        label: 'Islamic Society of North America',
        fajr: 15,
        ishaAngle: 15
      },

      EGYPT: {
        label: 'Egyptian General Authority',
        fajr: 19.5,
        ishaAngle: 17.5
      },

      KARACHI: {
        label: 'University of Islamic Sciences, Karachi',
        fajr: 18,
        ishaAngle: 18
      },

      UMMALQURA: {
        label: 'Umm al-Qura University, Makkah',
        fajr: 18.5,
        ishaMinutes: 90
      },
    };

    function julianDay(y, m, d) {
      if (m <= 2) {
        y -= 1;
        m += 12;
      }

      const A = Math.floor(y / 100);
      const B = 2 - A + Math.floor(A / 4);

      return Math.floor(365.25 * (y + 4716))
        + Math.floor(30.6001 * (m + 1))
        + d + B - 1524.5;
    }

    function sunPosition(jd) {
      const D = jd - 2451545.0;

      const g = fixAngle(
        357.529 + 0.98560028 * D
      );

      const q = fixAngle(
        280.459 + 0.98564736 * D
      );

      const L = fixAngle(
        q +
        1.915 * dsin(g) +
        0.020 * dsin(2 * g)
      );

      const e = 23.439 - 0.00000036 * D;

      let RA =
        darctan2(
          dcos(e) * dsin(L),
          dcos(L)
        ) / 15;

      RA = (RA % 24 + 24) % 24;

      const qh = (q / 15 % 24 + 24) % 24;

      let eqt = qh - RA;

      if (eqt > 12) eqt -= 24;
      if (eqt < -12) eqt += 24;

      const decl =
        darcsin(dsin(e) * dsin(L));

      return {
        decl,
        eqt
      };
    }

    function hourAngle(angleDeg, lat, decl) {
      const num =
        -dsin(angleDeg) -
        dsin(lat) * dsin(decl);

      const den =
        dcos(lat) * dcos(decl);

      return darccos(num / den) / 15;
    }

    function hoursToDate(baseDate, hoursLocal) {
      const d = new Date(baseDate);

      d.setHours(0, 0, 0, 0);

      return new Date(
        d.getTime() + hoursLocal * 3600000
      );
    }

    function computePrayerTimesFor(
      date,
      lat,
      lng,
      tz,
      methodKey,
      asrMethod
    ) {
      const method =
        CALC_METHODS[methodKey] ||
        CALC_METHODS.MWL;

      const jd = julianDay(
        date.getFullYear(),
        date.getMonth() + 1,
        date.getDate()
      );

      const {
        decl,
        eqt
      } = sunPosition(
        jd + 0.5 - lng / 360
      );

      const dhuhrHours =
        12 - eqt - lng / 15 + tz;

      const fajrHours =
        dhuhrHours -
        hourAngle(
          method.fajr,
          lat,
          decl
        );

      const sunriseHours =
        dhuhrHours -
        hourAngle(
          0.833,
          lat,
          decl
        );

      const sunsetHours =
        dhuhrHours +
        hourAngle(
          0.833,
          lat,
          decl
        );

      const t =
        asrMethod === 'hanafi'
          ? 2
          : 1;

      const asrAlt =
        darctan(
          1 /
          (
            t +
            dtan(
              Math.abs(lat - decl)
            )
          )
        );

      const asrHours =
        dhuhrHours +
        hourAngle(
          -asrAlt,
          lat,
          decl
        );

      const maghribHours =
        sunsetHours;

      let ishaHours;

      if (method.ishaMinutes) {
        ishaHours =
          maghribHours +
          method.ishaMinutes / 60;
      } else {
        ishaHours =
          dhuhrHours +
          hourAngle(
            method.ishaAngle,
            lat,
            decl
          );
      }

      return {
        fajr: hoursToDate(date, fajrHours),
        sunrise: hoursToDate(date, sunriseHours),
        dhuhr: hoursToDate(date, dhuhrHours),
        asr: hoursToDate(date, asrHours),
        maghrib: hoursToDate(date, maghribHours),
        isha: hoursToDate(date, ishaHours),
      };
    }

    function todaysTimes() {
      const s = S.settings;

      return computePrayerTimesFor(
        new Date(),
        s.location.lat,
        s.location.lng,
        localTzOffset(),
        s.calcMethod,
        s.asrMethod
      );
    }

    function timesForDate(date) {
      const s = S.settings;

      return computePrayerTimesFor(
        date,
        s.location.lat,
        s.location.lng,
        localTzOffset(),
        s.calcMethod,
        s.asrMethod
      );
    }

    function localTzOffset() {
      return -new Date().getTimezoneOffset() / 60;
    }

                } catch (_) {}

                  pctFromClientX(
                    e.clientX
                  )

              'pointermove',
              e => {

                  !_isSeeking ||
                  usingTouch ||
                  e.pointerType === 'touch'

                  pctFromClientX(
                    e.clientX

        d = {

      S.dayCache[ds] = d;

    async function saveDay(ds, d) {
      const key = 'day:' + ds;

      const cached =
        S.dayCache[ds] || {};

      d = {
        ...cached,
        ...d,
        salah: {
          ...(cached.salah || {}),
          ...(d.salah || {})
        },
        routine: {
          ...(cached.routine || {}),
          ...(d.routine || {})
        },
        adhkar: {
          ...(cached.adhkar || {}),
          ...(d.adhkar || {})
        }
      };

      S.dayCache[ds] = d;

      await setJSON(
        key,
        d
      );

      surahNum,
      verseNum

      if (!surahNum || !verseNum) return;

      const ds =
        dateStr(new Date());

      const day =
        await getDay(ds);

      if (!day.quranVersesRead) {
        day.quranVersesRead = {};
      }

      if (!day.quranVersesRead[surahNum]) {
        day.quranVersesRead[surahNum] = [];
      }

      const arr =

    async function saveCroppedProfilePhoto() {
      const imgEl = $('#pfp-crop-image');
      const viewport = $('#pfp-crop-viewport');

      if (!imgEl || !viewport || !_cropperState.img) {
        toast('Please choose an image first.');
        return;
      }

      const rect = viewport.getBoundingClientRect();
      const size = Math.min(rect.width, rect.height);

      const canvas = document.createElement('canvas');
      const outputSize = 512;

      canvas.width = outputSize;
      canvas.height = outputSize;

      const ctx = canvas.getContext('2d');

      const totalScale =
        _cropperState.baseScale *
        _cropperState.zoom;

      const iw =
        imgEl.naturalWidth *
        totalScale;

      const ih =
        imgEl.naturalHeight *
        totalScale;

      const x =
        (rect.width - iw) / 2 +
        _cropperState.offsetX;

      const y =
        (rect.height - ih) / 2 +
        _cropperState.offsetY;

      const sourceX =
        Math.max(
          0,
          -x / totalScale
        );

      const sourceY =
        Math.max(
          0,
          -y / totalScale
        );

      const sourceSize =
        size / totalScale;

      ctx.drawImage(
        imgEl,
        sourceX,
        sourceY,
        sourceSize,
        sourceSize,
        0,
        0,
        outputSize,
        outputSize
      );

      const dataUrl =
        canvas.toDataURL(
          'image/jpeg',
          0.86
        );

      closePfpModal();

      S.profile =
        S.profile || {};

      S.profile.photoURL =
        dataUrl;

      await setJSON(
        'pfp',
        { dataUrl }
      );

      await setJSON(
        'profile',
        S.profile
      );

      try {
        const u =
          window.fb?.auth?.currentUser;

        if (u) {
          await window.fb.updateProfile(
            u,
            { photoURL: dataUrl }
          );
        }
      } catch (e) { }

      toast(
        'Profile picture updated.'
      );

      render();
    }

    function closeWebcam() {
      const overlay =
        $('#webcam-overlay');

      const video =
        $('#webcam-video');

      if (video?.srcObject) {
        video.srcObject
          .getTracks()
          .forEach(track =>
            track.stop()
          );

        video.srcObject = null;
      }

      if (!overlay) return;

      overlay.classList.remove(
        'show'
      );

      setTimeout(() => {
        overlay.style.display =
          'none';
      }, 200);

    async function captureWebcamPhoto() {
      const video =
        $('#webcam-video');

      if (!video ||
          !video.videoWidth ||
          !video.videoHeight) {
        toast(
          'Camera is not ready yet.'
        );
        return;
      }

      const canvas =
        document.createElement(
          'canvas'
        );

      const size =
        Math.min(
          video.videoWidth,
          video.videoHeight
        );

      canvas.width = 512;
      canvas.height = 512;

      const ctx =
        canvas.getContext('2d');

      const sx =
        (video.videoWidth - size) / 2;

      const sy =
        (video.videoHeight - size) / 2;

      ctx.drawImage(
        video,
        sx,
        sy,
        size,
        size,
        0,
        0,
        512,
        512
      );

      const dataUrl =
        canvas.toDataURL(
          'image/jpeg',
          0.86
        );

      closeWebcam();

      S.profile =
        S.profile || {};

      S.profile.photoURL =
        dataUrl;

      await setJSON(
        'pfp',
        { dataUrl }
      );

      await setJSON(
        'profile',
        S.profile
      );

      try {
        const u =
          window.fb?.auth?.currentUser;

        if (u) {
          await window.fb.updateProfile(
            u,
            { photoURL: dataUrl }
          );
        }
      } catch (e) { }

      toast(
        'Profile picture updated.'
      );

      render();
    }

       /* ============================= THEME TOGGLE FUNCTIONS ============================= */
    function applyTheme(mode, persist = true) {
      document.documentElement.setAttribute('data-theme', mode);

      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', mode === 'light' ? '#FFFFFF' : '#000000');

      if (persist) {
        try {
          localStorage.setItem('theme', mode);
          // A manual toggle is an override for today only. Tomorrow the
          // app automatically chooses the theme from the current time.
          localStorage.setItem('theme-override-date', new Date().toISOString().slice(0, 10));
        } catch (e) { }
      }
    }

    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = cur === 'dark' ? 'light' : 'dark';

      // Synchronous flip. No fade, no opacity change, no rAF, no overlay.
      // The browser repaints once, straight into the new theme — no
      // split-second washed-out state on any of the colored elements.
      applyTheme(next);
    }

        /* ============================= ARABIC FONT SIZE ============================= */
    function applyArabicSize(mode) {
      document.documentElement.setAttribute('data-arabic-size', mode || 'medium');
    }

    /* ==================== BLOCK SWIPE-BACK FROM LEAVING THE APP ==================== */
    (function installSwipeBackGuard() {
      const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
      const isMobileUA = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
      if (!isTouch && !isMobileUA) return;

      // Seed one extra history entry so the first swipe-back doesn't leave the app.
      try {
        history.pushState({ __deenGuard: true }, '', location.href);
      } catch (e) {}

      // Whenever the user swipes back, immediately re-push a guard entry
      // so the app never falls off the history stack (which causes the black screen).
      window.addEventListener('popstate', () => {
        try {
          history.pushState({ __deenGuard: true }, '', location.href);
        } catch (e) {}
      });

      // Re-seed when the tab comes back into focus
      // (iOS Safari sometimes drops the extra entry when backgrounded).
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          try {
            history.pushState({ __deenGuard: true }, '', location.href);
          } catch (e) {}
        }
      });
    })();
  </script>
