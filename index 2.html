      { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عِلْمٍ لَا يَنْفَعُ، وَمِنْ قَلْبٍ لَا يَخْشَعُ، وَمِنْ نَفْسٍ لَا تَشْبَعُ، وَمِنْ دَعْوَةٍ لَا يُسْتَجَابُ لَهَا", meaning: "O Allah, I seek refuge in You from knowledge that does not benefit, from a heart that is not humble, from a soul that is not satisfied, and from a supplication that is not answered.", source: "Sahih Muslim (2722)" },
      { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ احْفَظْنِي بِحِفْظِكَ، وَتَوَلَّنِي بِرِعَايَتِكَ", meaning: "O Allah, protect me with Your protection and take care of me with Your care.", source: "Ahmad (4/217) — graded Hasan" },
      { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ طَهِّرْ لِي قَلْبِي وَنَقِّ لِي عَمَلِي", meaning: "O Allah, purify my heart for me and cleanse my deeds for me.", source: "Ahmad (4/340) — graded Hasan" },
      { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ لَا تَجْعَلْ فِي قَلْبِي غِلًّا لِلْمُؤْمِنِينَ", meaning: "O Allah, do not place any resentment in my heart toward the believers.", source: "Surah Al-Hashr (59:10)" },
      { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ ارْزُقْنِي حُبَّكَ وَحُبَّ رَسُولِكَ ﷺ", meaning: "O Allah, grant me the love of You and the love of Your Messenger ﷺ.", source: "Jami at-Tirmidhi (3490) — graded Hasan" },
      { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ أَعِنِّي عَلَى طَاعَتِكَ وَاجْعَلْنِي مِنْ عِبَادِكَ الصَّالِحِينَ الْمُخْلِصِينَ", meaning: "O Allah, help me to obey You and make me among Your righteous and sincere servants.", source: "Ahmad (3/128) — graded Hasan" },
      { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ ثَبِّتْنِي بِالْقَوْلِ الثَّابِتِ فِي الْحَيَاةِ الدُّنْيَا وَفِي الْآخِرَةِ", meaning: "O Allah, keep me firm with the steadfast word in this life and in the Hereafter.", source: "Sahih al-Bukhari (1369)" },
      { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اجْعَلْنِي مِنْ عِبَادِكَ الشَّاكِرِينَ الصَّابِرِينَ الذَّاكِرِينَ", meaning: "O Allah, make me among Your grateful, patient, and ever-remembering servants.", source: "Ahmad (2/176) — graded Hasan" },

      { cat: "General", ar: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", meaning: "Glory be to Allah, and praise be to Him.", source: "Sahih al-Bukhari, Sahih Muslim" },
      { cat: "General", ar: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ", meaning: "How perfect Allah is and I praise Him by the number of His creation, His pleasure, the weight of His throne, and the ink of His words.", source: "Sahih Muslim (2726)" },
      { cat: "General", ar: "سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلَا إِلَهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ", meaning: "Glory be to Allah, praise be to Allah, there is no god but Allah, and Allah is the Greatest.", source: "Sahih Muslim (2694)" },
      { cat: "General", ar: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ", meaning: "Glory be to Allah and praise be to Him; glory be to Allah, the Magnificent. (Two phrases light on the tongue, heavy on the scales, beloved to the Most Merciful)", source: "Sahih al-Bukhari (6406), Sahih Muslim (2694)" },
      { cat: "General", ar: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", meaning: "There is no god but Allah alone, He has no partner. His is the dominion and His is the praise, and He is capable of all things. (recite 100 times daily)", source: "Sahih al-Bukhari (3293), Sahih Muslim (2691)" },
      { cat: "General", ar: "سُبْحَانَ اللَّهِ", meaning: "Glory be to Allah.", source: "Sahih Muslim (2691)" },
      { cat: "General", ar: "الْحَمْدُ لِلَّهِ", meaning: "All praise is for Allah.", source: "Sahih Muslim (2137)" },
      { cat: "General", ar: "اللَّهُ أَكْبَرُ", meaning: "Allah is the Greatest.", source: "Sahih al-Bukhari (6218)" },
      { cat: "General", ar: "لَا إِلَهَ إِلَّا اللَّهُ", meaning: "There is no god but Allah.", source: "Sahih Muslim (2691)" },
      { cat: "General", ar: "أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ", meaning: "I seek forgiveness from Allah and turn to Him in repentance. (recite 100 times daily)", source: "Sahih al-Bukhari (6307), Sahih Muslim (2702)" },
      { cat: "General", ar: "رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ، إِنَّكَ أَنْتَ التَّوَّابُ الْغَفُورُ", meaning: "My Lord, forgive me and accept my repentance. Indeed, You are the Accepting of repentance, the Forgiving.", source: "Jami at-Tirmidhi (3434) — graded Sahih" },
      { cat: "General", ar: "أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ وَأَتُوبُ إِلَيْهِ", meaning: "I seek forgiveness from Allah, the Magnificent, and turn to Him in repentance.", source: "Sunan Abi Dawud (1517) — graded Sahih" },
      { cat: "General", ar: "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", meaning: "O Allah, You are my Lord, none has the right to be worshipped except You. You created me and I am Your servant... (Sayyid al-Istighfar — the best way of seeking forgiveness)", source: "Sahih al-Bukhari (6306)" },
      { cat: "General", ar: "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ", meaning: "Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.", source: "Sahih al-Bukhari (6389)" },
      { cat: "General", ar: "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ", meaning: "There is no might nor power except with Allah.", source: "Sahih al-Bukhari (6384), Sahih Muslim (2704)" },
      { cat: "General", ar: "حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ", meaning: "Allah is sufficient for us, and He is the best Disposer of affairs.", source: "Sahih al-Bukhari (4563)" },
      { cat: "General", ar: "حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ، وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ", meaning: "Allah is sufficient for me. There is no god but He, in Him I put my trust, and He is the Lord of the Mighty Throne. (recite 7 times)", source: "Abu Dawud (5081) — graded Sahih" },
      { cat: "General", ar: "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ", meaning: "In the name of Allah, with whose name nothing on earth or in the heavens can cause harm. He is the All-Hearing, the All-Knowing. (recite 3 times)", source: "Abu Dawud (5088), at-Tirmidhi (3388) — graded Sahih" },
      { cat: "General", ar: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ", meaning: "O Allah, send Your blessings upon Muhammad and upon the family of Muhammad.", source: "Sahih al-Bukhari (3370)" },
      { cat: "General", ar: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ", meaning: "O Allah, send blessings upon Muhammad and the family of Muhammad, as You sent blessings upon Ibrahim and the family of Ibrahim. Indeed, You are Praiseworthy, Most Glorious.", source: "Sahih al-Bukhari (3370), Sahih Muslim (406)" },
      { cat: "General", ar: "اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ", meaning: "O Allah, bless Muhammad and the family of Muhammad, as You blessed Ibrahim and the family of Ibrahim. Indeed, You are Praiseworthy, Most Glorious.", source: "Sahih al-Bukhari (3370), Sahih Muslim (406)" },
      { cat: "General", ar: "مَنْ صَلَّى عَلَيَّ صَلَاةً وَاحِدَةً صَلَّى اللَّهُ عَلَيْهِ بِهَا عَشْرًا", meaning: "Whoever sends one blessing upon me, Allah sends ten blessings upon him. (Hadith encouraging abundant salawat)", source: "Sahih Muslim (408)" },
      { cat: "General", ar: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ", meaning: "How perfect Allah is and I praise Him by the number of His creation, His pleasure, the weight of His throne, and the ink of His words.", source: "Sahih Muslim (2726)" },
      { cat: "General", ar: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، يُحْيِي وَيُمِيتُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", meaning: "There is no god but Allah alone, no partner has He. His is the dominion and His is the praise. He gives life and causes death, and He is capable of all things. (recite 10 times)", source: "Jami at-Tirmidhi (3534) — graded Hasan" },
      { cat: "General", ar: "سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلَا إِلَهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ", meaning: "Glory be to Allah, praise be to Allah, there is no god but Allah, Allah is the Greatest, and there is no might nor power except with Allah, the Most High, the Most Magnificent.", source: "Sahih Muslim (2137)" },
      { cat: "General", ar: "الْبَاقِيَاتُ الصَّالِحَاتُ: سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ", meaning: "The enduring righteous deeds: Glory be to Allah, praise be to Allah, there is no god but Allah, Allah is the Greatest.", source: "Sahih Muslim (2691)" },
      { cat: "General", ar: "كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَنِ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ", meaning: "Two phrases light on the tongue, heavy on the scales, beloved to the Most Merciful: Glory be to Allah and praise be to Him; glory be to Allah, the Magnificent.", source: "Sahih al-Bukhari (6406), Sahih Muslim (2694)" },
      { cat: "General", ar: "أَفْضَلُ الذِّكْرِ: لَا إِلَهَ إِلَّا اللَّهُ، وَأَفْضَلُ الدُّعَاءِ: الْحَمْدُ لِلَّهِ", meaning: "The best dhikr is 'there is no god but Allah', and the best supplication is 'all praise is for Allah'.", source: "Jami at-Tirmidhi (3383) — graded Hasan" },
      { cat: "General", ar: "مَنْ قَالَ: لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، فِي يَوْمٍ مِائَةَ مَرَّةٍ، كَانَتْ لَهُ عَدْلَ عَشْرِ رِقَابٍ", meaning: "Whoever says 'there is no god but Allah alone, He has no partner, His is the dominion and His is the praise, and He is capable of all things' 100 times in a day, it will be as if he freed ten slaves.", source: "Sahih al-Bukhari (3293), Sahih Muslim (2691)" },
      { cat: "General", ar: "مَنْ قَالَ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، فِي يَوْمٍ مِائَةَ مَرَّةٍ، حُطَّتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ", meaning: "Whoever says 'glory be to Allah and praise be to Him' 100 times in a day, his sins will be wiped away even if they are like the foam of the sea.", source: "Sahih al-Bukhari (6405), Sahih Muslim (2691)" },
      { cat: "General", ar: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ", meaning: "How perfect Allah is and I praise Him by the number of His creation, by His pleasure, by the weight of His throne, and by the ink of His words.", source: "Sahih Muslim (2726)" },
      { cat: "General", ar: "اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ، دِقَّهُ وَجِلَّهُ، وَأَوَّلَهُ وَآخِرَهُ، وَعَلَانِيَتَهُ وَسِرَّهُ", meaning: "O Allah, forgive me all my sins: the small and the great, the first and the last, the public and the private.", source: "Sahih Muslim (483)" },
      { cat: "General", ar: "اللَّهُمَّ طَهِّرْ قَلْبِي مِنَ النِّفَاقِ، وَعَمَلِي مِنَ الرِّيَاءِ", meaning: "O Allah, purify my heart from hypocrisy and my deeds from showing off.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ", meaning: "O Allah, help me to remember You, to give thanks to You, and to worship You in the best manner.", source: "Sunan Abi Dawud (1522) — graded Sahih" },
      { cat: "General", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَأَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ", meaning: "O Allah, I seek refuge in You from worry and grief, and I seek refuge in You from incapacity and laziness.", source: "Sahih al-Bukhari (6363)" },
      { cat: "General", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبُخْلِ، وَأَعُوذُ بِكَ مِنَ الْجُبْنِ، وَأَعُوذُ بِكَ أَنْ أُرَدَّ إِلَى أَرْذَلِ الْعُمُرِ", meaning: "O Allah, I seek refuge in You from miserliness, from cowardice, and from being returned to the most decrepit age.", source: "Sahih al-Bukhari (6374)" },
      { cat: "General", ar: "اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ", meaning: "O Allah, You are Peace and from You comes peace. Blessed are You, O Owner of majesty and honour.", source: "Sahih Muslim (591)" },
      { cat: "General", ar: "اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ", meaning: "O Allah, none can withhold what You give, and none can give what You withhold, and no wealth or majesty can benefit anyone, for from You is all wealth and majesty.", source: "Sahih al-Bukhari (844), Sahih Muslim (593)" },
      { cat: "General", ar: "اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ", meaning: "O Allah, Knower of the unseen and the witnessed, Originator of the heavens and the earth, Lord and Sovereign of all things, I bear witness that none has the right to be worshipped except You.", source: "Jami at-Tirmidhi (3392) — graded Sahih" },
      { cat: "General", ar: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ", meaning: "There is no god but Allah alone, He has no partner, His is the dominion and His is the praise, and He is capable of all things — to the number of His creation, His pleasure, the weight of His throne, and the ink of His words.", source: "Sahih Muslim (2726)" },
      { cat: "General", ar: "رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ", meaning: "Our Lord, let not our hearts deviate after You have guided us, and grant us mercy from Yourself. Indeed, You are the Bestower.", source: "Surah Aal-Imran (3:8)" },
      { cat: "General", ar: "رَبَّنَا آتِنَا مِنْ لَدُنْكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا", meaning: "Our Lord, grant us mercy from Yourself and guide us rightly in our affair.", source: "Surah Al-Kahf (18:10)" },
      { cat: "General", ar: "رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي وَاحْلُلْ عُقْدَةً مِنْ لِسَانِي يَفْقَهُوا قَوْلِي", meaning: "My Lord, expand for me my chest, ease for me my task, and untie the knot from my tongue that they may understand my speech.", source: "Surah Ta-Ha (20:25-28)" },
      { cat: "General", ar: "رَبِّ زِدْنِي عِلْمًا", meaning: "My Lord, increase me in knowledge.", source: "Surah Ta-Ha (20:114)" },
      { cat: "General", ar: "رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا", meaning: "Our Lord, grant us from among our spouses and offspring comfort to our eyes, and make us leaders of the righteous.", source: "Surah Al-Furqan (25:74)" },
      { cat: "General", ar: "رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالْإِيمَانِ وَلَا تَجْعَلْ فِي قُلُوبِنَا غِلًّا لِلَّذِينَ آمَنُوا رَبَّنَا إِنَّكَ رَءُوفٌ رَحِيمٌ", meaning: "Our Lord, forgive us and our brothers who preceded us in faith, and do not place in our hearts any resentment toward those who have believed. Our Lord, indeed You are Kind and Merciful.", source: "Surah Al-Hashr (59:10)" },
      { cat: "General", ar: "اللَّهُمَّ أَعْطِنِي مِنْ خَيْرِ مَا تُعْطِي عِبَادَكَ الصَّالِحِينَ", meaning: "O Allah, grant me the best of what You grant Your righteous servants.", source: "Ahmad (3/313) — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَمَا يُقَرِّبُنِي إِلَيْهَا مِنْ قَوْلٍ أَوْ عَمَلٍ", meaning: "O Allah, I ask You for Paradise and for whatever brings me closer to it, whether by word or by deed.", source: "Jami at-Tirmidhi (3541) — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ أَجِرْنِي مِنَ النَّارِ", meaning: "O Allah, protect me from the Fire.", source: "Sunan Abi Dawud (792) — graded Sahih" },
      { cat: "General", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالسَّدَادَ", meaning: "O Allah, I ask You for guidance and steadfastness.", source: "Sahih Muslim (2725)" },
      { cat: "General", ar: "اللَّهُمَّ ثَبِّتْنِي عَلَى الْحَقِّ وَلَا تُزِغْ قَلْبِي", meaning: "O Allah, keep me firm upon the truth and do not let my heart deviate.", source: "Ahmad (4/305) — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ أَصْلِحْ لِي دِينِي الَّذِي هُوَ عِصْمَةُ أَمْرِي، وَأَصْلِحْ لِي دُنْيَايَ الَّتِي فِيهَا مَعَاشِي، وَأَصْلِحْ لِي آخِرَتِي الَّتِي فِيهَا مَعَادِي", meaning: "O Allah, set right my religion which is the safeguard of my affairs, set right my worldly life in which is my livelihood, and set right my Hereafter to which is my return.", source: "Sahih Muslim (2720)" },
      { cat: "General", ar: "اللَّهُمَّ اجْعَلْ خَيْرَ عُمْرِي آخِرَهُ، وَخَيْرَ عَمَلِي خَاتِمَتَهُ، وَخَيْرَ أَيَّامِي يَوْمَ أَلْقَاكَ", meaning: "O Allah, make the best part of my life its end, the best of my deeds its conclusion, and the best of my days the Day I meet You.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ وَالْمُعَافَاةَ الدَّائِمَةَ فِي الدِّينِ وَالدُّنْيَا وَالْآخِرَةِ", meaning: "O Allah, I ask You for pardon, well-being, and lasting protection in my religion, worldly life, and Hereafter.", source: "Al-Adab Al-Mufrad (699) — graded Sahih" },
      { cat: "General", ar: "اللَّهُمَّ أَحْسِنْ عَاقِبَتَنَا فِي الْأُمُورِ كُلِّهَا، وَأَجِرْنَا مِنْ خِزْيِ الدُّنْيَا وَعَذَابِ الْآخِرَةِ", meaning: "O Allah, make our outcome good in all affairs, and save us from the disgrace of this world and the punishment of the Hereafter.", source: "Ahmad (5/255) — graded Sahih by al-Albani" },
      { cat: "General", ar: "يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ", meaning: "O Turner of hearts, make my heart firm upon Your religion.", source: "Jami at-Tirmidhi (3522) — graded Sahih" },
      { cat: "General", ar: "اللَّهُمَّ مُصَرِّفَ الْقُلُوبِ صَرِّفْ قُلُوبَنَا عَلَى طَاعَتِكَ", meaning: "O Allah, Director of hearts, direct our hearts to Your obedience.", source: "Sahih Muslim (2654)" },
      { cat: "General", ar: "رَضِيتُ بِاللَّهِ رَبًّا وَبِالْإِسْلَامِ دِينًا وَبِمُحَمَّدٍ ﷺ نَبِيًّا", meaning: "I am pleased with Allah as Lord, Islam as religion, and Muhammad ﷺ as prophet.", source: "Abu Dawud (1529), at-Tirmidhi (3389) — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ الْعِلْمِ وَخَيْرَ الْعَمَلِ وَخَيْرَ النَّتِيجَةِ", meaning: "O Allah, I ask You for the best of knowledge, the best of deeds, and the best of outcomes.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ طَهِّرْ قَلْبِي وَنَقِّ عَمَلِي وَاجْعَلْنِي مِنَ الْمُخْلَصِينَ", meaning: "O Allah, purify my heart, cleanse my deeds, and make me among the sincere.", source: "Ahmad (4/340) — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ اجْعَلْنِي مِنَ الْمُتَّقِينَ الَّذِينَ لَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ", meaning: "O Allah, make me among the righteous who will have no fear nor will they grieve.", source: "Ahmad (4/234) — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ ارْزُقْنِي بِرَّ وَالِدَيَّ وَاجْعَلْنِي مِنَ الْبَارِّينَ", meaning: "O Allah, grant me kindness to my parents and make me among the dutiful.", source: "Ahmad (5/382) — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ", meaning: "O Allah, forgive me, my parents, and all believing men and women.", source: "Ahmad (5/252) — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ اجْعَلْنِي مِنْ أَهْلِ الْجَنَّةِ وَبَاعِدْنِي مِنَ النَّارِ", meaning: "O Allah, make me among the people of Paradise and distance me from the Fire.", source: "Ahmad (3/461) — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ وَالْمَغْفِرَةَ وَالرَّحْمَةَ", meaning: "O Allah, I ask You for well-being, forgiveness, and mercy.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ اخْتِمْ لِي بِخَيْرٍ وَاجْعَلْ عَاقِبَتِي إِلَى خَيْرٍ", meaning: "O Allah, seal my life with goodness and make my ending good.", source: "Ahmad (6/315) — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ يَسِّرْ لِي كُلَّ عَسِيرٍ وَسَهِّلْ لِي كُلَّ صَعْبٍ", meaning: "O Allah, make every difficulty easy for me and make every hardship smooth for me.", source: "Ahmad (2/185) — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ أَعِنِّي عَلَى طَاعَتِكَ وَاجْعَلْنِي مِنْ عِبَادِكَ الصَّالِحِينَ الْمُخْلِصِينَ", meaning: "O Allah, help me to obey You and make me among Your righteous and sincere servants.", source: "Ahmad (3/128) — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ ثَبِّتْنِي بِالْقَوْلِ الثَّابِتِ فِي الْحَيَاةِ الدُّنْيَا وَفِي الْآخِرَةِ", meaning: "O Allah, keep me firm with the steadfast word in this life and in the Hereafter.", source: "Sahih al-Bukhari (1369)" },
      { cat: "General", ar: "اللَّهُمَّ اجْعَلْنِي مِنْ عِبَادِكَ الشَّاكِرِينَ الصَّابِرِينَ الذَّاكِرِينَ", meaning: "O Allah, make me among Your grateful, patient, and ever-remembering servants.", source: "Ahmad (2/176) — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ ارْحَمْنِي بِرَحْمَتِكَ الَّتِي وَسِعَتْ كُلَّ شَيْءٍ", meaning: "O Allah, have mercy on me with the mercy that encompasses all things.", source: "Ahmad (4/170) — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ، وَعَافِنِي فِيمَنْ عَافَيْتَ، وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ", meaning: "O Allah, guide me among those You have guided, grant me well-being among those You have granted well-being, and take me as a close ally among those You have taken as close allies.", source: "Sunan Abi Dawud (1425), Jami at-Tirmidhi (464) — graded Sahih" },
      { cat: "General", ar: "اللَّهُمَّ بَارِكْ لِي فِي مَا رَزَقْتَنِي وَقِنِي شَرَّ مَا مَنَعْتَنِي", meaning: "O Allah, bless me in what You have provided me and protect me from the evil of what You have withheld from me.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ ارْزُقْنِي حُبَّكَ وَحُبَّ مَنْ يَنْفَعُنِي حُبُّهُ عِنْدَكَ", meaning: "O Allah, grant me Your love and the love of those whose love benefits me with You.", source: "Jami at-Tirmidhi (3490) — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ نَفْسًا بِكَ مُطْمَئِنَّةً، تُؤْمِنُ بِلِقَائِكَ، وَتَرْضَى بِقَضَائِكَ", meaning: "O Allah, I ask You for a soul that finds tranquillity in You, that believes in meeting You, and that is content with Your decree.", source: "Sunan an-Nasa'i (1305) — graded Sahih" },
      { cat: "General", ar: "اللَّهُمَّ أَصْلِحْ قَلْبِي وَنَقِّهِ مِنَ الْحِقْدِ وَالْحَسَدِ", meaning: "O Allah, set right my heart and purify it from malice and envy.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ حَبِّبْ إِلَيَّ الْإِيمَانَ وَزَيِّنْهُ فِي قَلْبِي، وَكَرِّهْ إِلَيَّ الْكُفْرَ وَالْفُسُوقَ وَالْعِصْيَانَ", meaning: "O Allah, make faith beloved to me and beautify it in my heart, and make disbelief, transgression, and disobedience hateful to me.", source: "Ahmad (3/128) — graded Sahih" },
      { cat: "General", ar: "اللَّهُمَّ ارْزُقْنِي حُسْنَ الْخَاتِمَةِ", meaning: "O Allah, grant me a good end.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ لَا تَجْعَلِ الدُّنْيَا أَكْبَرَ هَمِّي وَلَا مَبْلَغَ عِلْمِي", meaning: "O Allah, do not make the world my greatest concern nor the limit of my knowledge.", source: "Jami at-Tirmidhi (3502) — graded Hasan" },
      { cat: "General", ar: "اللَّهُمَّ اجْعَلْنِي مِنَ الذَّاكِرِينَ الشَّاكِرِينَ الصَّابِرِينَ", meaning: "O Allah, make me among those who remember You, thank You, and are patient.", source: "Ahmad (2/176) — graded Hasan" }];

    const HADITH = [
      { cat: "Faith", text: "Actions are judged by intentions, and every person will have what they intended. So whoever migrated for Allah and His Messenger, his migration is for Allah and His Messenger; and whoever migrated for a worldly gain or to marry a woman, his migration is for what he migrated for.", source: "Sahih al-Bukhari (1), Sahih Muslim (1907) — narrated by Umar ibn al-Khattab" },
      { cat: "Faith", text: "None of you truly believes until he loves for his brother what he loves for himself.", source: "Sahih al-Bukhari (13), Sahih Muslim (45) — narrated by Anas ibn Malik" },
      { cat: "Faith", text: "Whoever believes in Allah and the Last Day, let him speak good or remain silent. Whoever believes in Allah and the Last Day, let him honour his neighbour. Whoever believes in Allah and the Last Day, let him honour his guest.", source: "Sahih al-Bukhari (6018), Sahih Muslim (47) — narrated by Abu Hurayrah" },
      { cat: "Faith", text: "Islam is built upon five: the testimony that there is no god but Allah and Muhammad is His Messenger, establishing the prayer, giving zakah, fasting Ramadan, and pilgrimage to the House.", source: "Sahih al-Bukhari (8), Sahih Muslim (16) — narrated by Ibn Umar" },
      { cat: "Faith", text: "The strong believer is better and more beloved to Allah than the weak believer, though both hold good. Be eager for what benefits you, seek help from Allah, and do not become helpless.", source: "Sahih Muslim (2664) — narrated by Abu Hurayrah" },
      { cat: "Faith", text: "Whoever dies knowing that there is no god worthy of worship except Allah, alone without partner, will enter Paradise.", source: "Sahih Muslim (26) — narrated by Uthman ibn Affan" },
      { cat: "Faith", text: "Iman is seventy-odd branches — the highest is the statement 'there is no god but Allah', and the lowest is removing harm from the path, and modesty is a branch of iman.", source: "Sahih al-Bukhari (9), Sahih Muslim (35) — narrated by Abu Hurayrah" },
      { cat: "Faith", text: "Faith has sixty-odd branches, and modesty is a branch of faith.", source: "Sahih al-Bukhari (9) — narrated by Abu Hurayrah" },
      { cat: "Faith", text: "Whoever among you sees something wrong, let him change it with his hand; if he cannot, then with his tongue; if he cannot, then with his heart — and that is the weakest of faith.", source: "Sahih Muslim (49) — narrated by Abu Sa'id al-Khudri" },
      { cat: "Faith", text: "The believer is not the one who eats his fill while his neighbour goes hungry.", source: "Sahih al-Bukhari (1125 in al-Adab al-Mufrad), graded Sahih — narrated by Ibn Abbas" },
      { cat: "Faith", text: "By Allah, he does not believe; by Allah, he does not believe; by Allah, he does not believe — the one whose neighbour is not safe from his harm.", source: "Sahih al-Bukhari (6016) — narrated by Abu Hurayrah" },
      { cat: "Faith", text: "A Muslim is one from whose tongue and hand other Muslims are safe. A muhajir is one who abandons what Allah has forbidden.", source: "Sahih al-Bukhari (10), Sahih Muslim (40) — narrated by Abdullah ibn Amr" },
      { cat: "Faith", text: "Do not envy one another, do not outbid one another, do not hate one another, do not turn away from one another, and do not undercut one another. Be servants of Allah as brothers.", source: "Sahih Muslim (2564) — narrated by Abu Hurayrah" },

      { cat: "Tawhid", text: "Allah has ninety-nine names — one hundred minus one. Whoever enumerates them will enter Paradise.", source: "Sahih al-Bukhari (2736), Sahih Muslim (2677) — narrated by Abu Hurayrah" },
      { cat: "Tawhid", text: "Whoever says 'there is no god but Allah' sincerely from his heart will enter Paradise.", source: "Sahih al-Bukhari (99 in some editions) — narrated by Mu'adh ibn Jabal" },
      { cat: "Tawhid", text: "The best dhikr is 'there is no god but Allah', and the best supplication is 'all praise is for Allah'.", source: "Jami at-Tirmidhi (3383) — graded Hasan — narrated by Jabir" },
      { cat: "Tawhid", text: "Whoever says 'there is no god but Allah alone, He has no partner, His is the dominion and His is the praise, and He is capable of all things' one hundred times a day, it will be as if he freed ten slaves.", source: "Sahih al-Bukhari (3293), Sahih Muslim (2691) — narrated by Abu Hurayrah" },
      { cat: "Tawhid", text: "Whoever says 'glory be to Allah and praise be to Him' one hundred times a day, his sins will be wiped away even if they are like the foam of the sea.", source: "Sahih al-Bukhari (6405), Sahih Muslim (2691) — narrated by Abu Hurayrah" },
      { cat: "Tawhid", text: "Two phrases are light on the tongue, heavy on the scales, beloved to the Most Merciful: 'glory be to Allah and praise be to Him', 'glory be to Allah, the Magnificent'.", source: "Sahih al-Bukhari (6406), Sahih Muslim (2694) — narrated by Abu Hurayrah" },
      { cat: "Tawhid", text: "The closest a servant comes to his Lord is when he is prostrating, so make abundant supplication then.", source: "Sahih Muslim (482) — narrated by Abu Hurayrah" },
      { cat: "Tawhid", text: "Allah is pleased with a servant who praises Him when he eats something and when he drinks something.", source: "Sahih Muslim (2734) — narrated by Anas ibn Malik" },
      { cat: "Tawhid", text: "Whoever says 'subhan Allah wa bihamdihi' in the morning and evening one hundred times, no one will come on the Day of Judgement with anything better than what he comes with, except one who says the same or more.", source: "Sahih Muslim (2692) — narrated by Abu Hurayrah" },

      { cat: "Salah", text: "The first matter that a servant will be brought to account for on the Day of Judgement is the prayer. If it is sound, the rest of his deeds will be sound; if it is corrupt, the rest of his deeds will be corrupt.", source: "Jami at-Tirmidhi (413), an-Nasa'i (465) — graded Sahih — narrated by Anas ibn Malik" },
      { cat: "Salah", text: "Between a man and disbelief and polytheism is abandoning the prayer.", source: "Sahih Muslim (82) — narrated by Jabir ibn Abdullah" },
      { cat: "Salah", text: "The covenant that separates us from them is the prayer. Whoever abandons it has committed disbelief.", source: "Jami at-Tirmidhi (2621), an-Nasa'i (463) — graded Sahih — narrated by Buraydah" },
      { cat: "Salah", text: "Prayer in congregation is twenty-seven times more rewarding than prayer performed alone.", source: "Sahih al-Bukhari (645), Sahih Muslim (650) — narrated by Ibn Umar" },
      { cat: "Salah", text: "The five prayers, and Friday to Friday, and Ramadan to Ramadan — expiation for what is between them, so long as major sins are avoided.", source: "Sahih Muslim (233) — narrated by Abu Hurayrah" },
      { cat: "Salah", text: "Whoever prays the dawn (Fajr) prayer in congregation is under the protection of Allah.", source: "Sahih Muslim (657) — narrated by Jundub ibn Abdullah" },
      { cat: "Salah", text: "The two rak'ahs of Fajr are better than the world and all it contains.", source: "Sahih Muslim (725) — narrated by Aisha" },
      { cat: "Salah", text: "Whoever prays the twelve rak'ahs of the voluntary prayers, a house will be built for him in Paradise.", source: "Sahih Muslim (728) — narrated by Umm Habibah" },
      { cat: "Salah", text: "There is no prayer after Fajr until the sun has risen, and no prayer after Asr until the sun has set.", source: "Sahih al-Bukhari (588), Sahih Muslim (827) — narrated by Abu Sa'id al-Khudri" },
      { cat: "Salah", text: "Whoever forgets a prayer or sleeps through it, its expiation is to pray it when he remembers.", source: "Sahih Muslim (684) — narrated by Anas ibn Malik" },
      { cat: "Salah", text: "The earth has been made a place of prostration and purification for me, so wherever a man of my ummah is when the time for prayer comes, let him pray.", source: "Sahih al-Bukhari (335), Sahih Muslim (521) — narrated by Jabir ibn Abdullah" },
      { cat: "Salah", text: "Whoever maintains the prayer, it will be a light for him, a proof, and a saviour on the Day of Judgement.", source: "Musnad Ahmad (6576), graded Hasan — narrated by Abu Hurayrah" },
      { cat: "Salah", text: "When one of you stands for prayer, he is conversing with his Lord, so let him be careful what he says.", source: "Sahih Muslim (551) — narrated by Abu Hurayrah" },

      { cat: "Character", text: "The best of you are those who are best to their families, and I am the best of you to my family.", source: "Jami at-Tirmidhi (3895) — graded Sahih — narrated by Aisha" },
      { cat: "Character", text: "The most complete of the believers in faith are those with the best character, and the best of you are those who are best to their women.", source: "Jami at-Tirmidhi (1162) — graded Sahih — narrated by Abu Hurayrah" },
      { cat: "Character", text: "Nothing is placed on the scales heavier than good character.", source: "Jami at-Tirmidhi (2003) — graded Sahih — narrated by Abu Darda" },
      { cat: "Character", text: "The heaviest thing that will be placed on the scales of a believer on the Day of Judgement is good character.", source: "Sunan Abi Dawud (4799), Jami at-Tirmidhi (2002) — graded Sahih — narrated by Abu Darda" },
      { cat: "Character", text: "I was only sent to perfect good character.", source: "Musnad Ahmad (8952) — graded Sahih — narrated by Abu Hurayrah" },
      { cat: "Character", text: "Fear Allah wherever you are; follow a bad deed with a good one to erase it, and treat people with good character.", source: "Jami at-Tirmidhi (1987) — graded Hasan — narrated by Abu Dharr" },
      { cat: "Character", text: "Whoever believes in Allah and the Last Day, let him not harm his neighbour. Whoever believes in Allah and the Last Day, let him honour his guest.", source: "Sahih al-Bukhari (6018), Sahih Muslim (47) — narrated by Abu Hurayrah" },
      { cat: "Character", text: "A believer does not taunt, does not curse, does not use obscenity, and does not speak foully.", source: "Jami at-Tirmidhi (1977) — graded Sahih — narrated by Ibn Mas'ud" },
      { cat: "Character", text: "The believer is not the one who slanders, nor the one who curses, nor the one who is obscene or abusive.", source: "Jami at-Tirmidhi (1977) — graded Sahih — narrated by Ibn Mas'ud" },
      { cat: "Character", text: "Whoever is deprived of gentleness is deprived of all good.", source: "Sahih Muslim (2592) — narrated by Aisha" },
      { cat: "Character", text: "Gentleness is not found in anything except that it beautifies it, and it is not removed from anything except that it disfigures it.", source: "Sahih Muslim (2594) — narrated by Aisha" },
      { cat: "Character", text: "Allah is Gentle and loves gentleness in all things.", source: "Sahih al-Bukhari (6927), Sahih Muslim (2593) — narrated by Aisha" },
      { cat: "Character", text: "The strong person is not the one who overcomes people by his strength, but the one who controls himself while in anger.", source: "Sahih al-Bukhari (6114), Sahih Muslim (2609) — narrated by Abu Hurayrah" },
      { cat: "Character", text: "When one of you becomes angry, let him remain silent.", source: "Musnad Ahmad (2137) — graded Sahih — narrated by Ibn Abbas" },
      { cat: "Character", text: "None of you should wish for death because of a calamity that has befallen him; but if he must, let him say: 'O Allah, keep me alive so long as life is good for me, and cause me to die when death is better for me.'", source: "Sahih al-Bukhari (5671), Sahih Muslim (2680) — narrated by Anas ibn Malik" },
      { cat: "Character", text: "Make things easy and do not make them difficult. Give glad tidings and do not drive people away.", source: "Sahih al-Bukhari (69), Sahih Muslim (1734) — narrated by Anas ibn Malik" },
      { cat: "Character", text: "Smiling in your brother's face is charity for you.", source: "Jami at-Tirmidhi (1956) — graded Sahih — narrated by Abu Dharr" },
      { cat: "Character", text: "Every act of kindness is charity.", source: "Sahih al-Bukhari (6021), Sahih Muslim (1009) — narrated by Jabir ibn Abdullah" },
      { cat: "Character", text: "Do not belittle any act of goodness, even if it is meeting your brother with a cheerful face.", source: "Sahih Muslim (2626) — narrated by Abu Dharr" },
      { cat: "Character", text: "Whoever does not show mercy to our young and does not respect our elders is not one of us.", source: "Jami at-Tirmidhi (1919), Sunan Abi Dawud (4943) — graded Sahih — narrated by Anas ibn Malik" },
      { cat: "Character", text: "A kind word is charity.", source: "Sahih al-Bukhari (2989), Sahih Muslim (1009) — narrated by Abu Hurayrah" },
      { cat: "Character", text: "Whoever is given a share of gentleness has been given a share of good, and whoever is deprived of gentleness has been deprived of good.", source: "Jami at-Tirmidhi (2013) — graded Sahih — narrated by Aisha" },
      { cat: "Character", text: "Modesty does not bring anything except good.", source: "Sahih al-Bukhari (6117), Sahih Muslim (37) — narrated by Imran ibn Husayn" },
      { cat: "Character", text: "Modesty is part of faith, and faith is in Paradise; obscenity is part of harshness, and harshness is in the Fire.", source: "Jami at-Tirmidhi (2009) — graded Sahih — narrated by Abu Hurayrah" },

      { cat: "Family", text: "Whoever wishes to have his provision expanded and his lifespan extended, let him maintain the ties of kinship.", source: "Sahih al-Bukhari (5986), Sahih Muslim (2557) — narrated by Anas ibn Malik" },
      { cat: "Family", text: "The one who maintains the ties of kinship is not the one who merely reciprocates; the one who maintains them is the one who, when his relatives sever ties, maintains them.", source: "Sahih al-Bukhari (5991) — narrated by Abdullah ibn Amr" },
      { cat: "Family", text: "No one severs ties of kinship except one who is cut off.", source: "Sahih al-Bukhari (5984) — narrated by Jubayr ibn Mut'im" },
      { cat: "Family", text: "The best of you are those who are best to their families, and I am the best of you to my family.", source: "Jami at-Tirmidhi (3895), Sunan Ibn Majah (1977) — graded Sahih — narrated by Aisha" },
      { cat: "Family", text: "The best of you are those best to their wives.", source: "Jami at-Tirmidhi (3895) — graded Sahih — narrated by Aisha" },
      { cat: "Family", text: "He is not one of us who does not show kindness to our young and does not respect our elders.", source: "Jami at-Tirmidhi (1919) — graded Sahih — narrated by Ibn Abbas" },
      { cat: "Family", text: "Whoever does not show mercy will not be shown mercy.", source: "Sahih al-Bukhari (5997), Sahih Muslim (2318) — narrated by Jarir ibn Abdullah" },
      { cat: "Family", text: "A man asked: 'O Messenger of Allah, who deserves my best companionship?' He said: 'Your mother, then your mother, then your mother, then your father, then your nearest relatives.'", source: "Sahih al-Bukhari (5971), Sahih Muslim (2548) — narrated by Abu Hurayrah" },
      { cat: "Family", text: "Be dutiful to your father and your mother, for Paradise lies beneath their pleasure.", source: "Musnad Ahmad (1538), graded Sahih — narrated by Abdullah ibn Amr (paraphrase of the hadith of Mu'awiyah ibn Jahimah)" },
      { cat: "Family", text: "The rights of the parent over the child include that the child does not call the parent by name, does not walk ahead of them, and does not sit in their place.", source: "Sunan al-Bayhaqi — graded Hasan (mentioned in some narrations)" },
      { cat: "Family", text: "Do not hate one another, do not envy one another, do not turn away from one another, and be brothers, O servants of Allah.", source: "Sahih Muslim (2563) — narrated by Abu Hurayrah" },
      { cat: "Family", text: "Whoever severs the ties of kinship will not enter Paradise.", source: "Sahih al-Bukhari (5984), Sahih Muslim (2556) — narrated by Jubayr ibn Mut'im" },
      { cat: "Family", text: "The most beloved of deeds to Allah after the obligatory prayers is to bring joy to a Muslim.", source: "Al-Mu'jam al-Awsat by al-Tabarani (5267) — graded Hasan" },

      { cat: "Knowledge", text: "Whoever follows a path in search of knowledge, Allah will make easy for him a path to Paradise.", source: "Sahih Muslim (2699) — narrated by Abu Hurayrah" },
      { cat: "Knowledge", text: "Whoever Allah wishes good for, He gives him understanding of the religion.", source: "Sahih al-Bukhari (71), Sahih Muslim (1037) — narrated by Mu'awiyah" },
      { cat: "Knowledge", text: "When a person dies, his deeds come to an end except three: ongoing charity, knowledge that is benefited from, and a righteous child who prays for him.", source: "Sahih Muslim (1631) — narrated by Abu Hurayrah" },
      { cat: "Knowledge", text: "Whoever seeks knowledge to compete with the scholars, or to argue with the foolish, or to turn the people's faces towards himself, Allah will admit him to the Fire.", source: "Jami at-Tirmidhi (2654), Sunan Ibn Majah (254) — graded Hasan — narrated by Ibn Umar" },
      { cat: "Knowledge", text: "The best of you are those who learn the Qur'an and teach it.", source: "Sahih al-Bukhari (5027) — narrated by Uthman ibn Affan" },
      { cat: "Knowledge", text: "Knowledge is only acquired by study, and forbearance is only acquired by practising it.", source: "Sahih al-Bukhari (in meaning), Sunan al-Khatib al-Baghdadi — graded Sahih" },
      { cat: "Knowledge", text: "Whoever is asked about knowledge and conceals it, will be bridled with a bridle of Fire on the Day of Judgement.", source: "Sunan Abi Dawud (3658), Jami at-Tirmidhi (2649) — graded Sahih — narrated by Abu Hurayrah" },
      { cat: "Knowledge", text: "Convey from me even if it is a single verse.", source: "Sahih al-Bukhari (3461) — narrated by Abdullah ibn Amr" },
      { cat: "Knowledge", text: "Whoever does not learn from his youth shall not learn in his old age.", source: "Al-Bayhaqi, Shu'ab al-Iman — graded Hasan" },
      { cat: "Knowledge", text: "There is no envy except in two cases: a man whom Allah has given wealth and who spends it in truth, and a man whom Allah has given wisdom and who judges by it and teaches it.", source: "Sahih al-Bukhari (73), Sahih Muslim (816) — narrated by Ibn Mas'ud" },
      { cat: "Knowledge", text: "Whoever reads a letter from the Book of Allah will have a reward, and that reward will be multiplied by ten.", source: "Jami at-Tirmidhi (2910) — graded Sahih — narrated by Abdullah ibn Mas'ud" },

      { cat: "Patience", text: "The believer who mixes with people and patiently bears the harm they cause is better than the one who avoids people and does not bear their harm.", source: "Sunan Ibn Majah (4032) — graded Sahih — narrated by Ibn Umar" },
      { cat: "Patience", text: "No one has been given a gift better or more abundant than patience.", source: "Sahih al-Bukhari (1469), Sahih Muslim (1053) — narrated by Abu Sa'id al-Khudri" },
      { cat: "Patience", text: "Amazing is the affair of the believer — all of it is good. If he is given ease, he is grateful, and that is good for him; if he is given hardship, he is patient, and that is good for him.", source: "Sahih Muslim (2999) — narrated by Suhayb" },
      { cat: "Patience", text: "No fatigue, illness, worry, grief, harm, or distress afflicts a Muslim — not even the prick of a thorn — except that Allah expiates some of his sins by it.", source: "Sahih al-Bukhari (5642), Sahih Muslim (2573) — narrated by Abu Sa'id al-Khudri" },
      { cat: "Patience", text: "The greatest reward comes with the greatest trial. When Allah loves a people, He tests them. Whoever is content will receive pleasure, and whoever is displeased will receive wrath.", source: "Jami at-Tirmidhi (2396) — graded Hasan — narrated by Anas ibn Malik" },
      { cat: "Patience", text: "Whoever is patient, Allah will make him patient, and no one is given a gift better or more abundant than patience.", source: "Sahih al-Bukhari (1469) — narrated by Abu Sa'id al-Khudri" },
      { cat: "Patience", text: "When a servant of Allah is tested with a calamity and responds with 'verily to Allah we belong and to Him we return; O Allah, reward me for my calamity and replace it with something better', Allah will replace it with something better.", source: "Sahih Muslim (918) — narrated by Umm Salamah" },
      { cat: "Patience", text: "If Allah wants good for His servant, He hastens the punishment in this world; and if He wants evil, He withholds the punishment until it comes on the Day of Judgement.", source: "Jami at-Tirmidhi (2396) — graded Hasan — narrated by Anas ibn Malik" },
      { cat: "Patience", text: "Whoever suffers a calamity and says 'inna lillahi wa inna ilayhi raji'un' and remembers Allah with patience — will be rewarded.", source: "Sahih Muslim (918) — narrated by Umm Salamah" },

      { cat: "Charity", text: "Charity does not decrease wealth.", source: "Sahih Muslim (2588) — narrated by Abu Hurayrah" },
      { cat: "Charity", text: "The upper hand is better than the lower hand. The upper hand is the one that gives, and the lower hand is the one that receives.", source: "Sahih al-Bukhari (1429), Sahih Muslim (1033) — narrated by Ibn Umar" },
      { cat: "Charity", text: "Give charity without delay, for it stands in the way of calamity.", source: "Jami at-Tirmidhi (589) — graded Hasan — narrated by Ali ibn Abi Talib" },
      { cat: "Charity", text: "Protect yourselves from the Fire, even with half a date given in charity.", source: "Sahih al-Bukhari (1417), Sahih Muslim (1016) — narrated by Adi ibn Hatim" },
      { cat: "Charity", text: "Every good deed is charity.", source: "Sahih al-Bukhari (6021), Sahih Muslim (1009) — narrated by Jabir ibn Abdullah" },
      { cat: "Charity", text: "A man's spending on his family is charity.", source: "Sahih al-Bukhari (5351), Sahih Muslim (1002) — narrated by Abu Mas'ud al-Ansari" },
      { cat: "Charity", text: "Whoever gives charity equal to a date from good earnings, Allah accepts it with His right hand and nurtures it as one of you nurtures his foal, until it becomes like a mountain.", source: "Sahih al-Bukhari (1410), Sahih Muslim (1014) — narrated by Abu Hurayrah" },
      { cat: "Charity", text: "The example of the one who spends in charity and the one who hoards is like the example of two men in iron armour from their chests to their collarbones.", source: "Sahih al-Bukhari (1442) — narrated by Abu Hurayrah" },
      { cat: "Charity", text: "Whoever gives in charity what equals one date from good earnings, Allah will accept it from him, for Allah does not accept except what is good.", source: "Sahih al-Bukhari (1410) — narrated by Abu Hurayrah" },
      { cat: "Charity", text: "There is no day on which people wake up except that two angels descend. One says: 'O Allah, compensate the one who spends.' The other says: 'O Allah, destroy the one who withholds.'", source: "Sahih al-Bukhari (1442), Sahih Muslim (1010) — narrated by Abu Hurayrah" },
      { cat: "Charity", text: "The believer's shade on the Day of Judgement will be his charity.", source: "Jami at-Tirmidhi (604) — graded Sahih — narrated by Uqbah ibn Amir" },
      { cat: "Charity", text: "Whoever relieves a believer's distress in this world, Allah will relieve his distress on the Day of Judgement.", source: "Sahih Muslim (2699) — narrated by Abu Hurayrah" },
      { cat: "Charity", text: "He who does not thank people does not thank Allah.", source: "Sunan Abi Dawud (4811), Jami at-Tirmidhi (1954) — graded Sahih — narrated by Abu Hurayrah" },
      { cat: "Charity", text: "Charity given to the poor is charity, and charity given to a relative is two: charity and maintaining family ties.", source: "Jami at-Tirmidhi (658), Sunan an-Nasa'i (2543) — graded Sahih — narrated by Salman ibn Amir" },

      { cat: "Honesty", text: "Truthfulness leads to righteousness, and righteousness leads to Paradise. A man keeps speaking the truth until he is recorded with Allah as a truthful one.", source: "Sahih al-Bukhari (6094), Sahih Muslim (2607) — narrated by Abdullah ibn Mas'ud" },
      { cat: "Honesty", text: "Whoever cheats is not one of us.", source: "Sahih Muslim (102) — narrated by Abu Hurayrah" },
      { cat: "Honesty", text: "Sincerity in trade is blessed, and deception is cursed.", source: "Jami at-Tirmidhi (1208) — graded Sahih — narrated by Hakim ibn Hizam" },
      { cat: "Honesty", text: "The truthful, trustworthy merchant will be with the prophets, the truthful, and the martyrs on the Day of Judgement.", source: "Sunan Ibn Majah (2139), Jami at-Tirmidhi (1209) — graded Sahih — narrated by Abu Sa'id al-Khudri" },
      { cat: "Honesty", text: "A hypocrite has three signs: when he speaks, he lies; when he makes a promise, he breaks it; and when he is entrusted, he betrays.", source: "Sahih al-Bukhari (33), Sahih Muslim (59) — narrated by Abu Hurayrah" },
      { cat: "Honesty", text: "Whoever does not give up false speech and evil actions, Allah is not in need of his leaving food and drink.", source: "Sahih al-Bukhari (1903) — narrated by Abu Hurayrah" },
      { cat: "Honesty", text: "It is not lawful for a Muslim to frighten another Muslim.", source: "Sunan Abi Dawud (5004) — graded Sahih — narrated by Ibn Umar" },
      { cat: "Honesty", text: "The signs of a hypocrite are three: when he speaks, he lies; when he makes a promise, he breaks it; when he is trusted, he betrays.", source: "Sahih al-Bukhari (33), Sahih Muslim (59) — narrated by Abu Hurayrah" },
      { cat: "Honesty", text: "Whoever deceives us is not one of us.", source: "Sahih Muslim (101) — narrated by Abu Hurayrah" },

      { cat: "Dua", text: "Dua is worship.", source: "Jami at-Tirmidhi (2969), Sunan Abi Dawud (1479) — graded Sahih — narrated by Nu'man ibn Bashir" },
      { cat: "Dua", text: "The best dhikr is 'there is no god but Allah', and the best supplication is 'all praise is for Allah'.", source: "Jami at-Tirmidhi (3383), Sunan Ibn Majah (3800) — graded Hasan — narrated by Jabir" },
      { cat: "Dua", text: "Our Lord descends every night to the lowest heaven when one-third of the night remains, and says: 'Who is calling upon Me so that I may answer him? Who is asking of Me so that I may give him? Who is seeking My forgiveness so that I may forgive him?'", source: "Sahih al-Bukhari (1145), Sahih Muslim (758) — narrated by Abu Hurayrah" },
      { cat: "Dua", text: "Whoever does not ask Allah, He becomes angry with him.", source: "Jami at-Tirmidhi (3373) — graded Hasan — narrated by Abu Hurayrah" },
      { cat: "Dua", text: "Do not curse yourselves, do not curse your children, do not curse your wealth, in case your curse coincides with a time when Allah is asked and He grants it.", source: "Sahih Muslim (3009) — narrated by Jabir ibn Abdullah" },
      { cat: "Dua", text: "Whoever says 'subhan Allah wa bihamdihi' one hundred times in a day, his sins will be wiped away even if they are like the foam of the sea.", source: "Sahih al-Bukhari (6405), Sahih Muslim (2691) — narrated by Abu Hurayrah" },
      { cat: "Dua", text: "The nearest a servant comes to his Lord is in prostration, so make abundant dua then.", source: "Sahih Muslim (482) — narrated by Abu Hurayrah" },
      { cat: "Dua", text: "Whoever sends one blessing upon me, Allah sends ten blessings upon him.", source: "Sahih Muslim (408) — narrated by Abu Hurayrah" },
      { cat: "Dua", text: "The one who makes dua does not return empty-handed.", source: "Jami at-Tirmidhi (3604) — graded Hasan — narrated by Abu Hurayrah" },
      { cat: "Dua", text: "The dua of a Muslim for his brother in his absence is answered. There is an angel at his head: whenever he makes dua for his brother, the angel says: 'Ameen, and the same for you.'", source: "Sahih Muslim (2733) — narrated by Abu Darda" },
      { cat: "Dua", text: "Three supplications are answered: the supplication of the fasting person, the supplication of the traveller, and the supplication of a parent for his child.", source: "Sunan Abi Dawud (1536), Jami at-Tirmidhi (1894) — graded Sahih — narrated by Abu Hurayrah" },
      { cat: "Dua", text: "Whoever seeks forgiveness for the believing men and believing women, Allah will write for him a good deed for every believing man and woman.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },

      { cat: "Akhirah", text: "The likeness of the one who remembers his Lord and the one who does not is like the living and the dead.", source: "Sahih al-Bukhari (1046 in al-Adab al-Mufrad), Sahih Muslim (779) — narrated by Abu Musa al-Ash'ari" },
      { cat: "Akhirah", text: "Everyone will be resurrected on the Day of Judgement barefoot, naked and uncircumcised.", source: "Sahih al-Bukhari (6527), Sahih Muslim (2860) — narrated by Aisha" },
      { cat: "Akhirah", text: "The first matter that a servant will be brought to account for on the Day of Judgement is his prayer. If it is sound, the rest of his deeds will be sound; if it is corrupt, the rest of his deeds will be corrupt.", source: "Jami at-Tirmidhi (413) — graded Sahih — narrated by Anas ibn Malik" },
      { cat: "Akhirah", text: "Whoever meets Allah without associating anything with Him will enter Paradise, and whoever meets Him associating anything with Him will enter the Fire.", source: "Sahih Muslim (93) — narrated by Jabir ibn Abdullah" },
      { cat: "Akhirah", text: "The first of the people to be judged on the Day of Judgement will be a man who was martyred, a man who sought knowledge and taught it, and a man who was given wealth and spent it. Then it will be said to the one who spent his wealth: 'You spent it only for the sake of being called generous, and you were called so.'", source: "Sahih Muslim (1905) — narrated by Abu Hurayrah" },
      { cat: "Akhirah", text: "Whoever desires the Hereafter, Allah will place richness in his heart, and He will gather his affairs for him, and the world will come to him in humiliation.", source: "Jami at-Tirmidhi (2465) — graded Hasan — narrated by Anas ibn Malik" },
      { cat: "Akhirah", text: "The world is a prison for the believer and a paradise for the disbeliever.", source: "Sahih Muslim (2956) — narrated by Abu Hurayrah" },
      { cat: "Akhirah", text: "If the son of Adam had a valley of gold, he would wish for a second; and nothing will fill the mouth of the son of Adam except dust, and Allah accepts the repentance of the one who repents.", source: "Sahih al-Bukhari (6439), Sahih Muslim (1048) — narrated by Ibn Abbas" },
      { cat: "Akhirah", text: "Whoever's concern is the Hereafter, Allah will make his richness in his heart, and He will gather his affairs for him, and the world will come to him unwillingly.", source: "Sunan Ibn Majah (4105), Jami at-Tirmidhi (2465) — graded Sahih" },
      { cat: "Akhirah", text: "The Day of Judgement will not come until the sun rises from the west.", source: "Sahih al-Bukhari (4635), Sahih Muslim (157) — narrated by Abu Hurayrah" },
      { cat: "Akhirah", text: "Whoever loves to meet Allah, Allah loves to meet him; and whoever hates to meet Allah, Allah hates to meet him.", source: "Sahih al-Bukhari (6507), Sahih Muslim (2683) — narrated by Aisha" },
      { cat: "Akhirah", text: "Every person will be with those he loves.", source: "Sahih al-Bukhari (6168), Sahih Muslim (2640) — narrated by Abdullah ibn Mas'ud" },
      { cat: "Akhirah", text: "Whoever wishes to be saved from the Fire and enter Paradise, let him die believing in Allah and the Last Day, and treat people as he wishes to be treated.", source: "Sahih Muslim (1844) — narrated by Abdullah ibn Amr" },

      { cat: "General", text: "Fear Allah and He will teach you.", source: "Narration attributed to Ali ibn Abi Talib — mentioned in several collections" },
      { cat: "General", text: "The best of deeds are those done consistently, even if they are small.", source: "Sahih al-Bukhari (6464), Sahih Muslim (783) — narrated by Aisha" },
      { cat: "General", text: "Take advantage of five before five: your youth before your old age, your health before your illness, your wealth before your poverty, your free time before your preoccupation, and your life before your death.", source: "Al-Hakim, Al-Mustadrak (7846), graded Sahih — narrated by Ibn Abbas" },
      { cat: "General", text: "Be in this world like a stranger or a traveller on a path.", source: "Sahih al-Bukhari (6416) — narrated by Abdullah ibn Umar" },
      { cat: "General", text: "He who does not thank people does not thank Allah.", source: "Sunan Abi Dawud (4811), Jami at-Tirmidhi (1954) — graded Sahih — narrated by Abu Hurayrah" },
      { cat: "General", text: "Whoever believes in Allah and the Last Day, let him speak good or remain silent.", source: "Sahih al-Bukhari (6018), Sahih Muslim (47) — narrated by Abu Hurayrah" },
      { cat: "General", text: "Avoid the seven destructive sins. They asked: 'What are they, O Messenger of Allah?' He said: 'Associating anything with Allah, magic, killing a soul which Allah has forbidden except by right, consuming usury, consuming the wealth of an orphan, turning back on the day of battle, and slandering chaste, believing women.'", source: "Sahih al-Bukhari (2766), Sahih Muslim (89) — narrated by Abu Hurayrah" },
      { cat: "General", text: "Whoever humbles himself for the sake of Allah, Allah will raise him.", source: "Sahih Muslim (2588) — narrated by Abu Hurayrah" },
      { cat: "General", text: "The best of you are those who are best to their families, and I am the best of you to my family.", source: "Jami at-Tirmidhi (3895), Sunan Ibn Majah (1977) — graded Sahih — narrated by Aisha" },
      { cat: "General", text: "Whoever performs Hajj and does not commit obscenity or wrongdoing will return as pure as the day his mother gave birth to him.", source: "Sahih al-Bukhari (1521), Sahih Muslim (1350) — narrated by Abu Hurayrah" },
      { cat: "General", text: "The reward of deeds depends upon the intentions.", source: "Sahih al-Bukhari (1), Sahih Muslim (1907) — narrated by Umar ibn al-Khattab" },
      { cat: "General", text: "Allah does not look at your appearance or your wealth, but He looks at your hearts and your deeds.", source: "Sahih Muslim (2564) — narrated by Abu Hurayrah" },
      { cat: "General", text: "Beware of envy, for envy consumes good deeds just as fire consumes wood.", source: "Sunan Abi Dawud (4903) — graded Hasan — narrated by Abu Hurayrah" },
      { cat: "General", text: "The deeds most beloved to Allah are those done consistently, even if small.", source: "Sahih al-Bukhari (6464), Sahih Muslim (783) — narrated by Aisha" },
      { cat: "General", text: "None of you should wish for death, nor should he pray for it before it comes to him.", source: "Sahih al-Bukhari (5671), Sahih Muslim (2680) — narrated by Anas ibn Malik" },
      { cat: "General", text: "Whoever takes a path seeking knowledge, Allah makes easy for him a path to Paradise.", source: "Sahih Muslim (2699) — narrated by Abu Hurayrah" },
      { cat: "General", text: "The best of people are those most beneficial to others.", source: "Al-Mu'jam al-Awsat by al-Tabarani (5787) — graded Hasan — narrated by Jabir" },
      { cat: "General", text: "Beware of the supplication of the oppressed, for there is no barrier between it and Allah.", source: "Sahih al-Bukhari (1496), Sahih Muslim (19) — narrated by Ibn Abbas" },
      { cat: "General", text: "Whoever is not grateful to people is not grateful to Allah.", source: "Sunan Abi Dawud (4811), Jami at-Tirmidhi (1954) — graded Sahih — narrated by Abu Hurayrah" },
      { cat: "General", text: "Whoever seeks forgiveness for the believing men and women, Allah will write for him a good deed for every believing man and woman.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
    ];

    const TAWHID = [
      {
        key: "rububiyyah",
        title: "Tawhid ar-Rububiyyah",
        sub: "Oneness of Lordship",
        body: "Affirming that Allah alone is the Creator, Owner, Sustainer and Controller of everything that exists. He brings life and death, provides sustenance, and governs the affairs of all creation without any partner or helper. This is the foundation that even the disbelievers Muhammad ﷺ addressed generally acknowledged (Qur'an 31:25), yet Tawhid ar-Rububiyyah alone was not enough to enter Islam — it must be joined with Tawhid al-Uluhiyyah."
      },
      {
        key: "uluhiyyah",
        title: "Tawhid al-Uluhiyyah",
        sub: "Oneness of Worship",
        body: "Directing every act of worship — prayer, supplication, reliance (tawakkul), hope, fear, sacrifice, vows and seeking help — to Allah alone, without directing any of it to a prophet, angel, righteous person, grave, or object. This is the Tawhid that the Messengers were sent to call people to (Qur'an 21:25), and the essence of the testimony 'there is no god worthy of worship except Allah'."
      },
      {
        key: "asma",
        title: "Tawhid al-Asma wa's-Sifat",
        sub: "Oneness of Names & Attributes",
        body: "Affirming all the Names and Attributes that Allah has affirmed for Himself in the Qur'an, and that the Prophet ﷺ affirmed for Him in authentic Sunnah — without distorting their meaning, denying them, asking 'how', or comparing them to the attributes of creation. Qur'an 42:11 summarises this balance: 'There is nothing like unto Him, and He is the All-Hearing, the All-Seeing.'"
      },
    ];

    const SUNNAH_ITEMS = [

      { cat: "Prayer", title: "Duha (mid-morning) prayer", type: "Sunnah", desc: "A short voluntary prayer after sunrise until just before Dhuhr." },
      { cat: "Prayer", title: "Sunnah of Fajr (2 rak'ahs)", type: "Sunnah", desc: "Two rak'ahs before Fajr — the Prophet ﷺ never left them, even while travelling." },
      { cat: "Prayer", title: "Sunnah of Dhuhr (4 before, 2 after)", type: "Sunnah", desc: "Four rak'ahs before and two after the obligatory Dhuhr." },
      { cat: "Prayer", title: "Sunnah of Maghrib (2 after)", type: "Sunnah", desc: "Two rak'ahs performed after Maghrib." },

      { cat: "Prayer", title: "Reciting Surah Al-Kahf on Friday", type: "Sunnah", desc: "A light shines for the reciter from one Friday to the next." },
      { cat: "Prayer", title: "Sending abundant salawat on Friday", type: "Sunnah", desc: "The Prophet ﷺ said the best of days is Friday, and to send abundant blessings upon him then." },
      { cat: "Prayer", title: "Reciting Ayat al-Kursi after each prayer", type: "Sunnah", desc: "Nothing stands between the reciter and Paradise except death." },
      { cat: "Prayer", title: "Reciting Al-Ikhlas, Al-Falaq and An-Nas after prayer", type: "Sunnah", desc: "Recited after each obligatory prayer." },
      { cat: "Prayer", title: "Reciting Al-Ikhlas, Al-Falaq and An-Nas before sleep", type: "Sunnah", desc: "Blow into cupped hands, wipe over the body — as the Prophet ﷺ used to do." },

      { cat: "Prayer", title: "Straightening the rows in prayer", type: "Sunnah", desc: "The Prophet ﷺ commanded the rows to be straightened before prayer." },
      { cat: "Prayer", title: "Saying 'Ameen' aloud in audible prayers", type: "Sunnah", desc: "When the imam says 'Ameen', the congregation says it too." },

      { cat: "Fasting", title: "Fasting Mondays and Thursdays", type: "Sunnah", desc: "The Prophet ﷺ observed these voluntary fasts regularly." },
      { cat: "Fasting", title: "Fasting the White Days (13, 14, 15)", type: "Sunnah", desc: "Three days of fasting around the middle of every lunar month." },
      { cat: "Fasting", title: "Fasting six days of Shawwal", type: "Sunnah", desc: "Whoever fasts Ramadan then six of Shawwal is as if he fasted a lifetime." },
      { cat: "Fasting", title: "Fasting on the Day of Arafah", type: "Sunnah", desc: "Expiation for the year before and the year after (for non-pilgrims)." },
      { cat: "Fasting", title: "Fasting on Ashura (10th Muharram)", type: "Sunnah", desc: "Expiation for the previous year. Combine with the 9th." },

      { cat: "Fasting", title: "Suhur (pre-dawn meal)", type: "Sunnah", desc: "Eat suhur, for in it there is blessing." },
      { cat: "Fasting", title: "Delaying suhur and hastening iftar", type: "Sunnah", desc: "The Prophet ﷺ would delay suhur and hasten to break the fast." },

      S.quranBookmark = { ...S.quranProgress };

    async function getDay(ds) {
      if (S.dayCache[ds]) return S.dayCache[ds];
      let d = await getJSON('day:' + ds);
      if (!d) d = {
        date: ds, salah: { fajr: 'pending', dhuhr: 'pending', asr: 'pending', maghrib: 'pending', isha: 'pending' },
        routine: {}, adhkar: { morning: false, evening: false }, quranVerses: 0, quranVersesRead: {}, reflection: null
      };
      S.dayCache[ds] = d; return d;
    }
     async function saveDay(ds, d) {
      const key = 'day:' + ds;

      // Merge with whatever the live snapshot already put in cache (source of truth),
      // NOT with a fresh getDoc (which races the snapshot and clobbers fresh writes).
      const cached = S.dayCache[ds] || {};
      d = {
        ...cached,
        ...d,
        salah:   { ...(cached.salah   || {}), ...(d.salah   || {}) },
        routine: { ...(cached.routine || {}), ...(d.routine || {}) },
        adhkar:  { ...(cached.adhkar  || {}), ...(d.adhkar  || {}) }
      };

      S.dayCache[ds] = d;
      await setJSON(key, d);
    }

    async function trackQuranVerses(surahNum, verseNum) {
      if (!surahNum || !verseNum) return;
      const ds = dateStr(new Date());
      const day = await getDay(ds);
      if (!day.quranVersesRead) day.quranVersesRead = {};
      if (!day.quranVersesRead[surahNum]) day.quranVersesRead[surahNum] = [];
      const arr = day.quranVersesRead[surahNum];
      if (!arr.includes(verseNum)) {
        arr.push(verseNum);
        day.quranVerses = (day.quranVerses || 0) + 1;
        await saveDay(ds, day);
        if (S.screen === 'home') hydrateHome();
        if (S.screen === 'tracker') hydrateTracker();
      }
    }

            let _subscribedDayKey = null;

    function subscribeToCurrentDay(force = false) {
      const ds = dateStr(new Date());
      const key = 'day:' + ds;

      // Only skip if a LIVE listener still exists for this exact key.
      // The old code skipped whenever the KEY matched — which was wrong,
      // because on mobile the listener underneath dies while the key
      // stays the same, silently killing the real-time stream.
      const uid = window.fb?.auth?.currentUser?.uid || 'guest';
      const liveListenerId = uid + ':' + key;

      if (!force && _subscribedDayKey === key && _cloudListeners[liveListenerId]) {
        return;
      }

      // Tear down the old day listener if it exists
      if (_subscribedDayKey && _cloudListeners[_subscribedDayKey]) {
        try { _cloudListeners[_subscribedDayKey](); } catch (e) {}
        delete _cloudListeners[_subscribedDayKey];
      }
      if (_cloudListeners[liveListenerId]) {
        try { _cloudListeners[liveListenerId](); } catch (e) {}
        delete _cloudListeners[liveListenerId];
      }

      _subscribedDayKey = key;

      subscribeToKey(key, (remoteDay) => {
        if (!remoteDay) return;

        // Skip repaint if nothing actually changed — prevents render loops
        // that were swallowing mobile taps.
        const prev = JSON.stringify(S.dayCache[ds] || {});
        const next = JSON.stringify(remoteDay);
        if (prev === next) return;

        S.dayCache[ds] = remoteDay;

        const s = S.screen;
        if (s === 'home')         hydrateHome();
        else if (s === 'routine') hydrateRoutine();
        else if (s === 'tracker') hydrateTracker();
        else if (s === 'adhkar')  hydrateAdhkar();
      });
    }

  if (val && val.surah && val.verse) {
    if (_fullSurahOwnsPointer) return;   // ← whole session owns the pointer
    S.quranProgress = val;

      el.textContent = (sur ? sur.translit : 'Surah ' + val.surah) + ' ' + val.verse;
    }
  }
});

    function greeting() { const h = new Date().getHours(); if (h < 12) return 'Good morning'; if (h < 17) return 'Good afternoon'; return 'Good evening'; }
    function niceDate(d = new Date()) { return d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }); }

    /* ============================= BIRTHDAY ============================= */
    function isBirthday() {
      const bd = S.settings && S.settings.birthday;
      if (!bd) return false;
      const today = new Date();
      const [, mm, dd] = bd.split('-').map(Number);
      return today.getMonth() + 1 === mm && today.getDate() === dd;
    }
    function fmtBirthday(bd) {
      if (!bd) return 'Not set';
      const [y, m, d] = bd.split('-').map(Number);
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return months[m - 1] + ' ' + d + (y ? ', ' + y : '');
    }

    function isRamadanMonth() {
      try {
        const parts = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { month: 'numeric' })
          .formatToParts(new Date());
        const m = parts.find(p => p.type === 'month')?.value;
        return String(m) === '9';
      } catch (e) { return false; }
    }
    function hijriDayOfMonth() {
      try {
        const parts = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { day: 'numeric' })
          .formatToParts(new Date());
        return parseInt(parts.find(p => p.type === 'day')?.value || '0', 10);
      } catch (e) { return 0; }
    }

    /* ============================= RENDER: SHELL ============================= */
       function go(screen, arg, verseArg) {
      // Always tear down any Settings freeze when navigating
      teardownSettingsFreeze();

      if (window._quranScrollHandler) {
        window.removeEventListener('scroll', window._quranScrollHandler, true);
        window._quranScrollHandler = null;
      }
      if (window._quranScrollTimer) {
        clearTimeout(window._quranScrollTimer);
        window._quranScrollTimer = null;
      }

      const leavingSplash = (S.screen === 'splash' && screen !== 'splash');
      

      const doNavigation = () => {
        S.screen = screen;
        S.arg = arg;
        S.verseArg = verseArg;

               try {
          if (['home', 'salah', 'routine', 'quran-library', 'quran-reader', 'adhkar', 'hadith',
            'tawhid', 'sunnah', 'ramadan', 'tracker', 'profile', 'settings', 'sources',
            'deenguide', 'jumuah', 'birthday', 'reflection'].includes(screen)) {
            localStorage.setItem(_lsKey('lastScreen'), screen);
            if (arg !== undefined) localStorage.setItem(_lsKey('lastArg'), String(arg));
            else localStorage.removeItem(_lsKey('lastArg'));
            // Backup to sessionStorage too — survives bfcache restores better on mobile.
            try {
              sessionStorage.setItem('__lastScreen', screen);
              if (arg !== undefined) sessionStorage.setItem('__lastArg', String(arg));
              else sessionStorage.removeItem('__lastArg');
            } catch (_) {}
          }
        } catch (e) { }

        render();

        if (screen === 'profile') {
          (async () => {
            try {
              const fresh = await getJSON('quran-progress');
              if (fresh && fresh.surah && fresh.verse) S.quranProgress = fresh;
              const el = document.getElementById('profile-quran-progress');
              if (el) {
                const sur = SURAHS.find(s => s.num === S.quranProgress.surah);
                el.textContent = (sur ? sur.translit : 'Surah ' + S.quranProgress.surah) + ' ' + S.quranProgress.verse;
              }
            } catch (e) { }
          })();
        }
      };

           doNavigation();
    }
    function navHtml(active) {

      return `<div class="sidebar">
            <div class="brand">${logoSvg(26)}<div><div class="brand-name">Deen Sphere</div><div class="brand-sub">Daily companion</div></div></div>
            <div class="navlist">${items}</div>

            <button class="navitem" data-action="logout">${ICONS.logout}<span>Log out</span></button></div>
          </div>`;

    function bottomNavHtml(active) {
      return `<div class="bottomnav"><ul>${BOTTOM_NAV.map(([id, label, icon]) =>
        `<li><button class="${active === id ? 'active' : ''}" data-nav="${id}">${ICONS[icon]}${label}</button></li>`).join('')}</ul></div>`;
    }
    function logoSvg(size) { return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" fill="none"><path d="M8 30V20a12 12 0 0124 0v10" stroke="#2FAE7B" stroke-width="2.6" stroke-linecap="round"/><circle cx="20" cy="10" r="2.4" fill="#C9A961"/></svg>`; }

    function render() {
      const app = $('#app');
      document.body.classList.toggle('profile-locked', S.screen === 'profile');
      const s = S.screen;
      if (s === 'splash') { app.innerHTML = renderSplash(); return; }
      if (s === 'onboarding') { app.innerHTML = renderOnboarding(); bindOnboarding(); return; }
      if (s === 'auth') { app.innerHTML = renderAuth(); bindAuth(); return; }
      if (s === 'forgot-password') { app.innerHTML = renderForgotPassword(); bindForgotPassword(); return; }
      if (s === 'reset-password') { app.innerHTML = renderResetPassword(); bindResetPassword(); return; }
      if (s === 'setup-location') { app.innerHTML = renderSetupLocation(); bindSetupLocation(); return; }
      if (s === 'setup-calc') { app.innerHTML = renderSetupCalc(); bindSetupCalc(); return; }
      if (s === 'setup-birthday') { app.innerHTML = renderSetupBirthday(); bindSetupBirthday(); return; }
      if (s === 'setup-notif') { app.innerHTML = renderSetupNotif(); bindSetupNotif(); return; }

      const activeNavId = s === 'quran-reader' ? 'quran-library' : s;
      let bodyHtml = '';
      if (s === 'home') bodyHtml = renderHome();
      else if (s === 'routine') bodyHtml = renderRoutine();
      else if (s === 'quran-library') bodyHtml = renderQuranLibrary();
      else if (s === 'quran-reader') bodyHtml = renderQuranReader(S.arg);
      else if (s === 'adhkar') bodyHtml = renderAdhkar();
      else if (s === 'hadith') bodyHtml = renderHadith();
      else if (s === 'tawhid') bodyHtml = renderTawhid();
      else if (s === 'sunnah') bodyHtml = renderSunnah();
      else if (s === 'jumuah') bodyHtml = renderJumuah();
      else if (s === 'birthday') bodyHtml = renderBirthday();
      else if (s === 'ramadan') bodyHtml = renderRamadan();
      else if (s === 'reflection') bodyHtml = renderReflection();
      else if (s === 'tracker') bodyHtml = renderTracker();
      else if (s === 'profile') bodyHtml = renderProfile();
      else if (s === 'settings') bodyHtml = renderSettings();
      else if (s === 'sources') bodyHtml = renderSources();
      else if (s === 'deenguide') bodyHtml = renderDeenGuide();
      else bodyHtml = renderHome();

            const existingShell = app.querySelector('.shell');
      const existingContent = app.querySelector('.content');

      /* PROFILE TOPBAR SAFETY: if a mobile/browser lifecycle event ever
         removes or hides the shared topbar, recreate it before rendering
         Profile. This keeps the top bar persistent without rebuilding the
         whole application shell. */
      if (existingShell && existingContent && s === 'profile') {
        let profileTopbar = existingShell.querySelector('.topbar');
        if (!profileTopbar) {
          profileTopbar = document.createElement('div');
          profileTopbar.className = 'topbar';
          existingContent.parentNode.insertBefore(profileTopbar, existingContent);
        }
        profileTopbar.innerHTML = `${logoSvg(22)}<span style="font-weight:700;font-size:15px;margin-left:6px;flex:1">Deen Sphere</span>
          <button data-nav="settings" aria-label="Settings" style="color:var(--tx2)">${ICONS.settings}</button>`;
        profileTopbar.style.display = 'flex';
        profileTopbar.style.visibility = 'visible';
        profileTopbar.style.opacity = '1';
      }

      if (existingShell && existingContent) {
        // Shell already exists — swap content instantly, no fade, no blink
        existingContent.innerHTML = bodyHtml;

        // Update which nav item is active without rebuilding the nav
        $$('.navitem[data-nav]').forEach(b => {
          b.classList.toggle('active', b.dataset.nav === activeNavId);
        });
        $$('.bottomnav button[data-nav]').forEach(b => {
          b.classList.toggle('active', b.dataset.nav === activeNavId);
        });
      } else {
        app.innerHTML = `<div class="shell">
              ${navHtml(activeNavId)}
              <div class="main">
              <div class="topbar">${logoSvg(22)}<span style="font-weight:700;font-size:15px;margin-left:6px;flex:1">Deen Sphere</span>
                <button data-nav="settings" style="color:var(--tx2)">${ICONS.settings}</button></div>
              <div class="content">${bodyHtml}</div>
              </div>
              ${bottomNavHtml(activeNavId)}
            </div>`;
      }
      bindGlobalNav();
      bindScreenActions(s);
      if (s === 'home') startCountdown(); else stopCountdown();
    }

    function bindGlobalNav() {
      $$('[data-nav]').forEach(b => b.onclick = () => go(b.dataset.nav));
      const lo = $('[data-action="logout"]'); if (lo) lo.onclick = doLogout;
    }

    /* ============================= SPLASH / ONBOARDING / AUTH ============================= */
        function renderSplash() {
      return `<div class="scr" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg)">

    function renderOnboarding() {

       function bindOnboarding() {
      $('#ob-skip').onclick = async () => { S.onboardingDone = true; await setJSON('onboarding-done', true); go('auth'); };
      $('#ob-next').onclick = async () => {
        const i = S.onbIdx || 0;
        if (i < ONBOARD_SLIDES.length - 1) { S.onbIdx = i + 1; render(); }

      };
