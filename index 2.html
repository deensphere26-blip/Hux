    /* ===== Restore-last-screen helpers (used by DOMContentLoaded below) ===== */
    const VALID_RESTORE_SCREENS = [
      'home', 'routine', 'quran-library', 'quran-reader', 'adhkar', 'hadith',
      'tawhid', 'sunnah', 'ramadan', 'tracker', 'profile', 'settings', 'sources',
      'deenguide', 'jumuah', 'birthday', 'reflection'
    ];

       function readLastScreen() {
      let lastScreen = null, lastArg = null;
      try {
        lastScreen = localStorage.getItem(_lsKey('lastScreen'));
        lastArg = localStorage.getItem(_lsKey('lastArg'));
      } catch (e) {}
      if (!lastScreen) {
        try {
          lastScreen = sessionStorage.getItem('__lastScreen');
          lastArg = sessionStorage.getItem('__lastArg');
        } catch (e) {}
      }
      if (!lastScreen || !VALID_RESTORE_SCREENS.includes(lastScreen)) {
        return { screen: null, arg: undefined };
      }
      if (lastScreen === 'quran-reader') {
        const num = parseInt(lastArg, 10);
        if (!(num >= 1 && num <= 114)) return { screen: 'quran-library', arg: undefined };
        return { screen: 'quran-reader', arg: num };
      }
      return { screen: lastScreen, arg: undefined };
    }

    async function bootSplash() {
  subscribeToGlobalKeys();
  subscribeToCurrentDay(true);

  // If DOMContentLoaded already restored a screen, don't touch it.
  if (S.screen !== 'splash') {
    applyArabicSize(S.settings && S.settings.arabicFontSize);
    return;
  }

  let targetScreen;
  let targetArg;

  if (S.profile && S.settings && S.settings.setupDone) {
    // Restore the last screen the user was on, if it's valid.
    const restored = readLastScreen();
    targetScreen = restored.screen || 'home';
    targetArg = restored.arg;
  } else if (!S.profile) {
    targetScreen = 'auth';
  } else {
    targetScreen = 'setup-location';
  }

  go(targetScreen, targetArg);
  applyArabicSize(S.settings && S.settings.arabicFontSize);
}

    /* ============================= AUTHENTICATION ============================= */
    let _authMode = 'signin';

    function renderAuth() {

      const isSignUp = mode === 'signup';
      return `<div class="scr" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">

                  <button id="tab-signin" style="flex:1;padding:9px;border-radius:7px;font-size:13.5px;font-weight:600;transition:all .15s;${!isSignUp ? 'background:var(--green);color:#fff;' : 'color:var(--tx2);'}">Sign In</button>
                  <button id="tab-signup" style="flex:1;padding:9px;border-radius:7px;font-size:13.5px;font-weight:600;transition:all .15s;${isSignUp ? 'background:var(--green);color:#fff;' : 'color:var(--tx2);'}">Sign Up</button>
                </div>
                <button class="btn btn-ghost btn-block" id="google-btn" style="margin-bottom:14px;">
                  <svg width="16" height="16" viewBox="0 0 24 24" style="margin-right:2px;"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                  Continue with Google
                </button>
                <div class="divider"></div>
                <div style="display:flex;flex-direction:column;gap:10px;">
                  ${isSignUp ? `<input id="auth-name" placeholder="Full name" autocomplete="name">` : ''}
                  <input id="auth-email" placeholder="Email" type="email" autocomplete="email">
                  <div class="password-wrapper">
          <input id="auth-pass" placeholder="Password (min 6 characters)" type="password" autocomplete="${isSignUp ? 'new-password' : 'current-password'}">

          </button>

                ${!isSignUp ? `
                  <div style="text-align:right;margin:10px 0 14px;">

                  </div>
                ` : `<div style="height:24px;"></div>`}
                <button class="btn btn-primary btn-block" id="auth-submit">
                  ${isSignUp ? 'Create Account' : 'Sign In'}
                </button>
                <div style="text-align:center;color:var(--tx3);font-size:11.5px;margin-top:16px;line-height:1.6;">
                  By continuing you agree to the Terms and Privacy Policy.<br>All data stays saved to your account, even after logging out.
                </div>
              </div>
            </div>`;
    }

    function bindAuth() {
      $('#tab-signin').onclick = () => { _authMode = 'signin'; render(); };
      $('#tab-signup').onclick = () => { _authMode = 'signup'; render(); };
      $('#google-btn').onclick = async () => {
        try {
          const result = await window.fb.signInWithPopup(window.fb.auth, window.fb.googleProvider);
          const u = result.user;
          S.profile = { name: u.displayName || 'Friend', email: u.email, uid: u.uid, joined: u.metadata.creationTime, photoURL: u.photoURL || null };
          await setJSON('profile', S.profile);
          await loadAll();
          if (!S.settings.setupDone) go('setup-location'); else go('home');
        } catch (e) {
          console.error(e);
          if (e.code === 'auth/popup-closed-by-user') return;
          if (e.code === 'auth/popup-blocked') { toast('Popup blocked. Allow popups and try again.'); return; }
          toast('Google sign-in failed: ' + (e.code || e.message));
        }
      };
      const forgotBtn = $('#forgot-btn');
      if (forgotBtn) forgotBtn.onclick = () => go('forgot-password');
      $('#auth-submit').onclick = async () => {
        const isSignUp = _authMode === 'signup';
        const name = isSignUp ? ($('#auth-name')?.value || '').trim() : '';
        const email = ($('#auth-email')?.value || '').trim();
        const pass = $('#auth-pass')?.value || '';
        if (!email || !email.includes('@')) { toast('Enter a valid email address.'); return; }
        if (!pass || pass.length < 6) { toast('Password must be at least 6 characters.'); return; }
        if (isSignUp && !name) { toast('Please enter your full name.'); return; }
        const btn = $('#auth-submit');
        const originalText = btn.textContent;
        btn.textContent = isSignUp ? 'Creating account…' : 'Signing in…';
        btn.disabled = true;
        try {
          if (isSignUp) {
            const cred = await window.fb.createUserWithEmailAndPassword(window.fb.auth, email, pass);
            if (name) await window.fb.updateProfile(cred.user, { displayName: name });
            S.profile = { name: name || 'Friend', email, uid: cred.user.uid, joined: new Date().toISOString(), photoURL: null };
            await setJSON('profile', S.profile);
            await loadAll();
            toast('Welcome to Deen Sphere, ' + name.split(' ')[0] + '!');
            if (!S.settings.setupDone) go('setup-location'); else go('home');
          } else {
            const cred = await window.fb.signInWithEmailAndPassword(window.fb.auth, email, pass);
            S.profile = {
              name: cred.user.displayName || (email.split('@')[0]),
              email: cred.user.email,
              uid: cred.user.uid,
              joined: cred.user.metadata?.creationTime || new Date().toISOString(),
              photoURL: cred.user.photoURL || null
            };
            await setJSON('profile', S.profile);
            await loadAll();
            toast('Welcome back, ' + S.profile.name.split(' ')[0] + '!');
            if (!S.settings.setupDone) go('setup-location'); else go('home');
          }
        } catch (e) {
          console.error('Auth error:', e);
          btn.textContent = originalText;
          btn.disabled = false;
          handleAuthError(e, isSignUp);
        }
      };
      ['auth-name', 'auth-email', 'auth-pass'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('keydown', ev => {
          if (ev.key === 'Enter') { ev.preventDefault(); $('#auth-submit').click(); }
        });
      });
    }

    function handleAuthError(e, isSignUp) {
      const code = e.code || '';
      if (code === 'auth/email-already-in-use') { toast('This email is already registered. Try signing in instead.'); }
      else if (code === 'auth/invalid-email') { toast('That email address looks invalid.'); }
      else if (code === 'auth/weak-password') { toast('Password must be at least 6 characters.'); }
      else if (code === 'auth/user-not-found') { toast('No account found with this email. Try Sign Up.'); }
      else if (code === 'auth/wrong-password') { toast('Incorrect password. Try again or reset it.'); }
      else if (code === 'auth/invalid-credential') { toast('Wrong email or password. Please try again.'); }
      else if (code === 'auth/too-many-requests') { toast('Too many attempts. Please wait a minute and try again.'); }
      else if (code === 'auth/network-request-failed') { toast('Network error. Check your internet connection.'); }
      else { toast('Sign-in failed: ' + (e.message || code)); }
    }

    /* ---- setup: location ---- */
    const CITY_PRESETS = [['Chennai, India', 13.0827, 80.2707], ['Bengaluru, India', 12.9716, 77.5946], ['Mumbai, India', 19.0760, 72.8777], ['Delhi, India', 28.6139, 77.2090], ['Hyderabad, India', 17.3850, 78.4867],
    ['Mecca, Saudi Arabia', 21.4225, 39.8262], ['Medina, Saudi Arabia', 24.4672, 39.6142], ['Cairo, Egypt', 30.0444, 31.2357], ['Istanbul, Turkey', 41.0082, 28.9784],
    ['London, UK', 51.5072, -0.1276], ['New York, USA', 40.7128, -74.0060], ['Karachi, Pakistan', 24.8607, 67.0011], ['Jakarta, Indonesia', -6.2088, 106.8456], ['Kuala Lumpur, Malaysia', 3.1390, 101.6869]];

    let _locationWatchId = null;
    let _lastAutoLocation = null;
    let _locationSearchTimer = null;

    function locationDistanceKm(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function formatGeocodedPlace(props) {
      const city = props.city || props.town || props.village || props.county || props.name || '';
      const country = props.country || '';
      return city && country ? `${city}, ${country}` : (city || country || 'Current location');
    }

    async function reverseGeocodeLocation(lat, lng) {
      try {
        const url = `https://photon.komoot.io/reverse?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lng)}`;
        const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!res.ok) throw new Error('Reverse geocoding failed');
        const data = await res.json();
        const props = data?.features?.[0]?.properties || {};
        return formatGeocodedPlace(props);
      } catch (e) {
        return '';
      }
    }

    async function searchLocations(query) {
      const q = String(query || '').trim();
      if (!q) return CITY_PRESETS.slice(0, 8).map(c => ({ label: c[0], lat: c[1], lng: c[2] }));
      try {
        const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=8`;
        const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!res.ok) throw new Error('Search failed');
        const data = await res.json();
        return (data?.features || []).map(f => {
          const p = f.properties || {};
          const coords = f.geometry?.coordinates || [];
          return { label: formatGeocodedPlace(p), detail: [p.state, p.country].filter(Boolean).join(', '), lat: Number(coords[1]), lng: Number(coords[0]) };
        }).filter(x => Number.isFinite(x.lat) && Number.isFinite(x.lng) && x.label);
      } catch (e) {
        const needle = q.toLowerCase();
        return CITY_PRESETS.filter(c => c[0].toLowerCase().includes(needle)).map(c => ({ label: c[0], lat: c[1], lng: c[2] }));
      }
    }

    function applyLocationToForm(lat, lng, label) {
      const latEl = $('#lat-in'), lngEl = $('#lng-in'), labelEl = $('#location-label');
      if (latEl) latEl.value = Number(lat).toFixed(5);
      if (lngEl) lngEl.value = Number(lng).toFixed(5);
      if (labelEl) labelEl.textContent = label || `${Number(lat).toFixed(2)}, ${Number(lng).toFixed(2)}`;
    }

    async function saveAutoLocation(lat, lng, label, shouldRender = false) {
      if (!S.settings) return;
      const resolvedLabel = label || S.settings.location?.label || `${lat.toFixed(2)}, ${lng.toFixed(2)}`;
      S.settings.location = { lat, lng, label: resolvedLabel };
      S.settings.locationAuto = true;
      _lastAutoLocation = { lat, lng };
      try { await setJSON('settings', S.settings); } catch (e) {}
      if (shouldRender && S.screen !== 'setup-location') render();
    }

    async function updateLocationFromDevice(pos, shouldRender = true) {
      const lat = Number(pos.coords.latitude);
      const lng = Number(pos.coords.longitude);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
      if (_lastAutoLocation && locationDistanceKm(_lastAutoLocation.lat, _lastAutoLocation.lng, lat, lng) < 1.5) return;
      const label = await reverseGeocodeLocation(lat, lng);
      await saveAutoLocation(lat, lng, label || 'Current location', shouldRender);
      if (S.screen === 'setup-location') applyLocationToForm(lat, lng, label || 'Current location');
      toast(label ? `Location updated to ${label}.` : 'Location updated from your device.');
    }

    function startAutomaticLocationUpdates() {
      if (!navigator.geolocation || _locationWatchId !== null || !S.settings?.locationAuto) return;
      _locationWatchId = navigator.geolocation.watchPosition(
        pos => updateLocationFromDevice(pos, true),
        () => {},
        { enableHighAccuracy: true, maximumAge: 300000, timeout: 15000 }
      );
    }

    function stopAutomaticLocationUpdates() {
      if (_locationWatchId !== null && navigator.geolocation) {
        navigator.geolocation.clearWatch(_locationWatchId);
        _locationWatchId = null;
      }
    }

    function bindSetupLocation() {
      const search = $('#location-search');
      const results = $('#location-results');

      if (search) {
        search.addEventListener('input', () => {
          clearTimeout(_locationSearchTimer);

    /* ---------- Mobile-only logout pop-up ---------- */
    function openLogoutModal() {
      const bd = document.getElementById('logout-modal-backdrop');
      const md = document.getElementById('logout-modal');
      if (!bd || !md) return;

      bd.style.display = 'block';
      md.style.display = 'block';
      void bd.offsetWidth;

      bd.style.opacity = '1';
      md.style.opacity = '1';
      md.style.transform = 'translate(-50%,-50%) scale(1)';

      const bindTap = (el, fn) => {
        if (!el) return;
        let tapped = false;
        const handler = (e) => {
          if (tapped) return;
          tapped = true;
          if (e) { e.preventDefault(); e.stopPropagation(); }
          fn();
          setTimeout(() => { tapped = false; }, 400);
        };
        el.addEventListener('click', handler);
        el.style.touchAction = 'manipulation';
        el.style.webkitTapHighlightColor = 'transparent';
        el.style.cursor = 'pointer';
      };

      bindTap(document.getElementById('logout-modal-x'), closeLogoutModal);
      bindTap(document.getElementById('logout-modal-cancel'), closeLogoutModal);
      bindTap(document.getElementById('logout-modal-backdrop'), closeLogoutModal);
      bindTap(document.getElementById('logout-modal-confirm'), () => {
        closeLogoutModal();
        performLogout();
      });

      document.addEventListener('keydown', _logoutEscHandler);
    }

    function closeLogoutModal() {
      const bd = document.getElementById('logout-modal-backdrop');
      const md = document.getElementById('logout-modal');
      if (!bd || !md) return;

      bd.style.opacity = '0';
      md.style.opacity = '0';
      md.style.transform = 'translate(-50%,-50%) scale(.92)';

      setTimeout(() => {
        bd.style.display = 'none';
        md.style.display = 'none';
      }, 200);

      document.removeEventListener('keydown', _logoutEscHandler);
    }

    function _logoutEscHandler(e) {
      if (e.key === 'Escape') closeLogoutModal();
    }

    function doLogout() {
      const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
        || window.matchMedia('(max-width: 880px)').matches;
      if (isMobile) {
        openLogoutModal();
      } else {
        if (confirm('Log out of Deen Sphere? Your saved worship data will still be here next time you log in.')) {
          performLogout();
        }
      }
    }

    async function performLogout() {
      const uid = window.fb?.auth?.currentUser?.uid || null;

      try { if (window.fb) await window.fb.signOut(window.fb.auth); } catch (e) { }

      try {
        const prefix = 'u:' + uid + ':';
        const rm = [];

        const playButtons = [...document.querySelectorAll('[data-play]')];

    let _ramadanTimer = null;

    function _hijriFromJD(jd) {
      const islamic = jd - 1948439.5;
      const cycles = Math.floor(islamic / 10631);
      let rem = islamic - cycles * 10631;
      let yearIdx = Math.floor(rem / 354.36667);
      rem -= Math.floor(yearIdx * 354.36667);

      const leapInCycle = [2, 5, 7, 10, 13, 16, 18, 21, 24, 26, 29];
      const isLeapYear = leapInCycle.includes(yearIdx + 1);

      const monthLens = [30, 29, 30, 29, 30, 29, 30, 29, 30, 29, 30, isLeapYear ? 30 : 29];

      let daysLeft = Math.floor(rem);
      let month = 1, day = 1;
      for (let m = 0; m < 12; m++) {
        if (daysLeft < monthLens[m]) { month = m + 1; day = daysLeft + 1; break; }
        daysLeft -= monthLens[m];
      }
      return { day, month, year: cycles * 30 + yearIdx + 1 };
    }

    function _julianDay(y, m, d) {
      if (m <= 2) { y -= 1; m += 12; }
      const A = Math.floor(y / 100);
      const B = 2 - A + Math.floor(A / 4);
      return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
    }

    function _hijriFromDate(d) {
      try {
        const parts = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',
          { day: 'numeric', month: 'numeric', year: 'numeric' }).formatToParts(d);
        const day = parseInt(parts.find(p => p.type === 'day')?.value || '0', 10);
        const month = parseInt(parts.find(p => p.type === 'month')?.value || '0', 10);
        const year = parseInt(parts.find(p => p.type === 'year')?.value || '0', 10);
        if (day > 0 && month > 0 && year > 0 && month <= 12) {
          return { day, month, year };
        }
      } catch (e) { }
      return _hijriFromJD(_julianDay(d.getFullYear(), d.getMonth() + 1, d.getDate()));
    }

    function _findRamadanStart(nearDate) {
      let best = null, bestDist = Infinity;
      for (let i = -400; i <= 400; i++) {
        const d = new Date(nearDate);
        d.setHours(0, 0, 0, 0);
        d.setDate(d.getDate() + i);
        const h = _hijriFromDate(d);
        if (h.month === 9 && h.day === 1) {
          const dist = Math.abs(d - nearDate);
          if (dist < bestDist) { best = d; bestDist = dist; }
        }
      }
      return best;
    }

    function _findShawwalStart(ramadanStart) {
      for (let i = 1; i <= 40; i++) {
        const d = new Date(ramadanStart);
        d.setDate(d.getDate() + i);
        const h = _hijriFromDate(d);
        if (h.month === 10 && h.day === 1) return d;
      }
      const fb = new Date(ramadanStart);
      fb.setDate(fb.getDate() + 30);
      return fb;
    }

    function _startRamadanCountdown(target) {
      if (_ramadanTimer) clearInterval(_ramadanTimer);
      const tick = () => {
        const el = document.getElementById('ramadan-countdown');
        if (!el) { clearInterval(_ramadanTimer); _ramadanTimer = null; return; }
        const now = new Date();
        let diff = target - now;
        if (diff <= 0) {
          el.innerHTML = `<div style="font-size:22px;font-weight:800;color:var(--green-l);">Ramadan Mubarak!</div>`;
          clearInterval(_ramadanTimer); _ramadanTimer = null;
          return;
        }
        const d = Math.floor(diff / 86400000); diff -= d * 86400000;
        const h = Math.floor(diff / 3600000); diff -= h * 3600000;
        const m = Math.floor(diff / 60000); diff -= m * 60000;
        const s = Math.floor(diff / 1000);
        const cell = (v, lab) =>
          `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
                <div style="font-size:34px;font-weight:800;color:var(--green-l);line-height:1;font-variant-numeric:tabular-nums;">${String(v).padStart(2, '0')}</div>
                <div style="font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:1.2px;">${lab}</div>
              </div>`;
        el.innerHTML = `
              <div style="display:flex;justify-content:center;gap:16px;align-items:flex-start;">
                ${cell(d, 'Days')}
                <div style="font-size:28px;font-weight:800;color:var(--tx3);line-height:1;">:</div>
                ${cell(h, 'Hours')}
                <div style="font-size:28px;font-weight:800;color:var(--tx3);line-height:1;">:</div>
                ${cell(m, 'Minutes')}
                <div style="font-size:28px;font-weight:800;color:var(--tx3);line-height:1;">:</div>
                ${cell(s, 'Seconds')}
              </div>`;
      };
      tick();
      _ramadanTimer = setInterval(tick, 1000);
    }

    function hydrateRamadanCalendar() {
      const el = document.getElementById('ramadan-cal');
      if (!el) return;

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const ramadanStart = _findRamadanStart(today);
      if (!ramadanStart) {
        el.innerHTML = `<div class="empty">Couldn't determine the Ramadan date. Please check your device date settings.</div>`;
        return;
      }
      const ramadanEnd = _findShawwalStart(ramadanStart);

      const msPerDay = 86400000;
      const daysToStart = Math.round((ramadanStart - today) / msPerDay);
      const daysToEnd = Math.round((ramadanEnd - today) / msPerDay);

      if (daysToStart > 0) {
        el.innerHTML = `

               function renderTracker() {

            <div id="tracker-cats"></div>`;

 async function hydrateTracker() {
  const range = S.trackerRange || 'week';

  const sel = document.getElementById('tracker-range');
  if (sel) {
    sel.onchange = () => {
      S.trackerRange = sel.value;
      hydrateTracker();
    };
  }

  const now = new Date();
  const todayStr = dateStr(now);
  let days = [];

  if (range === 'week') {
    const dayOfWeek = now.getDay();
    const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    const monday = new Date(now);
    monday.setDate(now.getDate() + mondayOffset);
    monday.setHours(0, 0, 0, 0);
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      days.push(d);
    }
  } else {
    const y = now.getFullYear(), m = now.getMonth();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      days.push(new Date(y, m, d));
    }
  }

  const todayStr2 = dateStr(new Date());
  const allRecords = await Promise.all(days.map(dd => {
    const ds = dateStr(dd);
    if (ds === todayStr2) {
      delete S.dayCache[ds];
      return getJSON('day:' + ds);
    }
    if (S.dayCache[ds]) return Promise.resolve(S.dayCache[ds]);
    return getJSON('day:' + ds);
  }));

  const emptyDay = () => ({
    salah: {}, routine: {}, adhkar: {},
    quranVerses: 0, quranVersesRead: {}
  });

  let totalPct = 0, countedDays = 0;
  let catTotals = { salah: 0, salahMax: 0, routine: 0, routineMax: 0, adhkar: 0, adhkarMax: 0, quranVerses: 0, quranVersesMax: 0 };
  let dayResults = [];

  const routineMaxFromStruct = getRoutineStruct().reduce((sum, s) => sum + s[2].length, 0) || 16;

  for (let i = 0; i < days.length; i++) {
    const dd = days[i];
    const ds = dateStr(dd);
    const isFuture = dd > now && ds !== todayStr;

    // A day with no record is treated as an empty (0%) day.
    const rec = allRecords[i] || emptyDay();

    let salahDone = 0, salahMax = 5;
    let routineDone = 0, routineMax = routineMaxFromStruct;
    let adhkarDone = 0, adhkarMax = 2;
    let quranVerses = 0, quranGoal = 50;

    salahDone = Object.values(rec.salah || {}).filter(v => v === 'completed').length;
    const rv = Object.values(rec.routine || {});
    routineDone = rv.filter(Boolean).length;
    adhkarDone = (rec.adhkar?.morning ? 1 : 0) + (rec.adhkar?.evening ? 1 : 0);

    // Qur'an Tracker is driven ONLY by bookmarks. One or more bookmarks
    // made on this day gives the full Qur'an 15% category.
    const hasQuranBookmarkToday = Array.isArray(S.bookmarks) && S.bookmarks.some(bm => {
      if (!bm || !bm.date || !bm.surah || !bm.verse) return false;
      const d = new Date(bm.date);
      return !isNaN(d.getTime()) && dateStr(d) === ds;
    });
    quranVerses = hasQuranBookmarkToday ? quranGoal : 0;

    const pS = salahMax ? salahDone / salahMax : 0;
    const pR = routineMax ? routineDone / routineMax : 0;
    const pA = adhkarMax ? adhkarDone / adhkarMax : 0;
    const pQ = quranGoal ? Math.min(quranVerses / quranGoal, 1) : 0;
    const dayPct = Math.round(pS * 40 + pR * 30 + pA * 15 + pQ * 15);

    catTotals.salah += salahDone; catTotals.salahMax += salahMax;
    catTotals.routine += routineDone; catTotals.routineMax += routineMax;
    catTotals.adhkar += adhkarDone; catTotals.adhkarMax += adhkarMax;
    catTotals.quranVerses += quranVerses; catTotals.quranVersesMax += quranGoal;

    if (!isFuture) {
      totalPct += dayPct; countedDays++;
    }

    dayResults.push({ ds, dayPct, rec, dd, isFuture });
  }

  // ---- Weekly / Monthly average ----
  // Every PAST day counts, whether or not it was opened/ticked.
  // Future days are ignored so the rest of the week doesn't drag you down.
  let pctSum = 0;
  let pastDays = 0;

  for (const dr of dayResults) {
    if (dr.isFuture) continue;
    pastDays++;

    const rec = dr.rec || emptyDay();

    const salahDone = Object.values(rec.salah || {}).filter(v => v === 'completed').length;
    const salahPct = (salahDone / 5) * 100;

    const routineDone = Object.values(rec.routine || {}).filter(Boolean).length;
    const rMax = getRoutineStruct().reduce((s, x) => s + x[2].length, 0) || 16;
    const routinePct = (routineDone / rMax) * 100;

    const adhkarDone = (rec.adhkar?.morning ? 1 : 0) + (rec.adhkar?.evening ? 1 : 0);
    const adhkarPct = (adhkarDone / 2) * 100;

    // Qur'an contributes its full 15% only when at least one bookmark
    // was created on that specific day. Missed days remain 0%.
    const hasQuranBookmark = Array.isArray(S.bookmarks) && S.bookmarks.some(bm => {
      if (!bm || !bm.date || !bm.surah || !bm.verse) return false;
      const d = new Date(bm.date);
      return !isNaN(d.getTime()) && dateStr(d) === dr.ds;
    });
    const quranPct = hasQuranBookmark ? 100 : 0;

    const dayScore =
      salahPct   * 0.40 +
      routinePct * 0.30 +
      adhkarPct  * 0.15 +
      quranPct   * 0.15;

    pctSum += dayScore;
  }

  const avgPct = pastDays > 0 ? Math.round(pctSum / pastDays) : 0;

  // ---------- OVERALL CARD ----------
  const overall = document.getElementById('tracker-overall');
  if (overall) {
    let trend = '';
    if (range === 'week') {
      const first3 = dayResults.slice(0, 3).filter(d => !d.isFuture);
      const last3 = dayResults.slice(4, 7).filter(d => !d.isFuture);
      const avgOf = arr => arr.length ? Math.round(arr.reduce((s, x) => s + x.dayPct, 0) / arr.length) : null;
      const a1 = avgOf(first3);
      const a2 = avgOf(last3);
      if (a1 !== null && a2 !== null) {
        const diff = a2 - a1;
        if (diff >= 5) trend = `<span style="color:var(--green-l);font-size:13px;font-weight:600;">↑ Up ${diff}%</span>`;
        else if (diff <= -5) trend = `<span style="color:var(--amber);font-size:13px;font-weight:600;">↓ Down ${Math.abs(diff)}%</span>`;
        else trend = `<span style="color:var(--tx3);font-size:13px;font-weight:600;">→ Steady</span>`;
      }
    }

    const totalDays = range === 'week' ? 7 : days.length;
    overall.innerHTML = `
      <div style="padding:18px 20px;">
        <div style="position:relative;">
          <div class="rowsub" style="margin-bottom:2px;">${range === 'week' ? 'Weekly average' : 'Monthly average'}</div>
          <div style="font-size:30px;font-weight:800;color:var(--green-l);line-height:1.1;">${avgPct}%</div>
          <div class="rowsub" style="margin-top:4px;">${countedDays} of ${totalDays} day${totalDays === 1 ? '' : 's'} recorded</div>
          ${trend ? `<div style="position:absolute;right:0;top:50%;transform:translateY(-50%);">${trend}</div>` : ''}
        </div>
        <div class="progress-bar" style="margin-top:14px;"><div class="progress-fill" style="width:${avgPct}%;"></div></div>
      </div>
    `;
  }

  // ---------- DAY GRID ----------
  const grid = document.getElementById('tracker-grid');
  if (grid) {
    const cells = dayResults.map(({ ds, dayPct, rec, dd, isFuture }) => {
      const isToday = ds === todayStr;
      const hasRec = rec && (
        Object.values(rec.salah || {}).some(v => v === 'completed') ||
        Object.values(rec.routine || {}).some(Boolean) ||
        rec.adhkar?.morning || rec.adhkar?.evening ||
        (Array.isArray(S.bookmarks) && S.bookmarks.some(bm => {
          if (!bm || !bm.date || !bm.surah || !bm.verse) return false;
          const d = new Date(bm.date);
          return !isNaN(d.getTime()) && dateStr(d) === ds;
        }))
      );
      let bg = 'var(--card-el)', fg = 'var(--tx3)';
      if (isFuture) { bg = 'transparent'; fg = 'var(--tx3)'; }
      else if (!hasRec) { bg = 'var(--card-el)'; fg = 'var(--tx3)'; }
      else {
        if (dayPct >= 80) { bg = 'var(--green)'; fg = '#fff'; }
        else if (dayPct >= 50) { bg = 'var(--green-dim2)'; fg = 'var(--green-l)'; }
        else if (dayPct >= 20) { bg = 'var(--amber-dim)'; fg = 'var(--amber)'; }
        else { bg = 'var(--card-el)'; fg = 'var(--tx2)'; }
      }
      const wd = dd.toLocaleDateString('en-US', { weekday: 'short' }).slice(0, 2);
      return `<button data-tracker-day="${ds}"
        title="${dd.toDateString()} — ${isFuture ? 'future' : dayPct + '%'}"
        style="aspect-ratio:1;min-width:0;border-radius:10px;background:${bg};color:${fg};
        border:1px solid ${isToday ? 'var(--green-l)' : 'var(--border)'};
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:0;padding:2px;overflow:hidden;">
        <span style="font-size:8px;opacity:.8;text-transform:uppercase;letter-spacing:.3px;line-height:1;">${wd}</span>
        <span style="font-size:12px;font-weight:700;line-height:1.1;margin-top:1px;">${dd.getDate()}</span>
        ${(!isFuture) ? `<span style="font-size:8px;opacity:.9;line-height:1;margin-top:1px;">${dayPct}%</span>` : ''}
      </button>`;
    }).join('');

    grid.innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;overflow:hidden;">${cells}</div>
      <div style="display:flex;gap:14px;margin-top:14px;font-size:10.5px;color:var(--tx3);flex-wrap:wrap;">
        <span><span style="display:inline-block;width:10px;height:10px;background:var(--green);border-radius:3px;vertical-align:middle;margin-right:4px;"></span>80%+</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:var(--green-dim2);border-radius:3px;vertical-align:middle;margin-right:4px;"></span>50-79%</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:var(--amber-dim);border-radius:3px;vertical-align:middle;margin-right:4px;"></span>20-49%</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:var(--card-el);border:1px solid var(--border);border-radius:3px;vertical-align:middle;margin-right:4px;"></span>&lt;20% / missed</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:transparent;border:1px solid var(--border);border-radius:3px;vertical-align:middle;margin-right:4px;"></span>Future</span>
      </div>`;

    $$('[data-tracker-day]').forEach(b => b.onclick = () => showTrackerDay(b.dataset.trackerDay));
  }

 // ---------- CATEGORY TOTALS ----------
const cats = document.getElementById('tracker-cats');
if (cats) {
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

  // Qur'an Tracker "Latest Verse" follows the actual Qur'an order:
  // Surah 1 (Al-Fatihah) -> Surah 2 (Al-Baqarah) -> ... -> Surah 114.
  // The latest bookmark is the bookmark in the HIGHEST SURAH number.
  // If multiple bookmarks are in the same Surah, the HIGHEST verse number wins.
  // If the same verse is bookmarked more than once, the newest bookmark wins.
  // Example: Al-Fatihah 2 + Al-Baqarah 50 -> show Al-Baqarah 50/286.
  let displaySurah = null;
  let displayReached = 0;
  let displayTotal = 0;
  let displayPct = 0;

  let latestBookmark = null;
  let latestSurahNum = -Infinity;
  let latestVerse = -Infinity;
  let latestBookmarkTime = -Infinity;

  if (Array.isArray(S.bookmarks)) {
    for (const bm of S.bookmarks) {
      if (!bm || !bm.surah || !bm.verse) continue;
      const surahNum = Number(bm.surah);
      const verse = Number(bm.verse);
      if (surahNum < 1 || surahNum > 114 || verse <= 0) continue;

      const time = Date.parse(bm.date || '') || 0;

      // Qur'an order wins: highest Surah number first.
      // Within the same Surah, highest verse wins.
      // Same verse: newest bookmark wins.
      if (surahNum > latestSurahNum ||
          (surahNum === latestSurahNum && verse > latestVerse) ||
          (surahNum === latestSurahNum && verse === latestVerse && time >= latestBookmarkTime)) {
        latestSurahNum = surahNum;
        latestVerse = verse;
        latestBookmarkTime = time;
        latestBookmark = bm;
      }
    }
  }

  if (latestBookmark) {
    const surMeta = SURAHS.find(x => x.num === Number(latestBookmark.surah));
    const verse = Number(latestBookmark.verse);
    if (surMeta && verse > 0) {
      displaySurah = surMeta;
      displayReached = Math.min(verse, surMeta.verses);
      displayTotal = surMeta.verses;
      displayPct = Math.min(100, Math.round((displayReached / displayTotal) * 100));
    }
  }

  cats.innerHTML = `
    <div class="card" style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span class="rowtitle">Salah</span>
        <span style="font-weight:700;">${catTotals.salah} / ${catTotals.salahMax}</span>
      </div>
      <div class="progress-bar" style="margin-top:8px;"><div class="progress-fill" style="width:${pct(catTotals.salah, catTotals.salahMax)}%;"></div></div>
    </div>
    <div class="card" style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span class="rowtitle">Daily Routine</span>
        <span style="font-weight:700;">${catTotals.routine} / ${catTotals.routineMax}</span>
      </div>
      <div class="progress-bar" style="margin-top:8px;"><div class="progress-fill" style="width:${pct(catTotals.routine, catTotals.routineMax)}%;"></div></div>
    </div>
    <div class="card" style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span class="rowtitle">Adhkar</span>
        <span style="font-weight:700;">${catTotals.adhkar} / ${catTotals.adhkarMax}</span>
      </div>
      <div class="progress-bar" style="margin-top:8px;"><div class="progress-fill" style="width:${pct(catTotals.adhkar, catTotals.adhkarMax)}%;"></div></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <span class="rowtitle">Qur'an</span>
        <span style="font-size:11.5px;color:var(--tx3);">${range === 'week' ? 'Weekly' : 'Monthly'}</span>
      </div>
      ${displaySurah ? `
        <div style="position:relative;margin-bottom:10px;">
          <div style="font-weight:600;font-size:13.5px;padding-right:60px;">
            ${displayReached}/${displayTotal} (Surah ${displaySurah.translit})
          </div>
          <div style="position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:12px;font-weight:600;color:var(--green-l);">
            ${displayPct}%
          </div>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${displayPct}%;"></div>
        </div>
      ` : `<div class="empty" style="padding:6px 0;font-size:12px;">No reading recorded this ${range === 'week' ? 'week' : 'month'}.</div>`}
    </div>
    ${countedDays === 0 ? `<div class="empty" style="margin-top:14px;">No entries yet. Complete a prayer or routine item to see this fill up.</div>` : ''}
  `;
}
}

    async function showTrackerDay(ds) {

       /* ============================= PFP MODAL & CROPPER LOGIC ============================= */
    let _cropperState = {
      img: null, baseScale: 1, zoom: 1, offsetX: 0, offsetY: 0,
      startX: 0, startY: 0, isDragging: false,
      startPinchDist: 0, startZoom: 1, isPinching: false
    };

    function openPfpModal() {
      const overlay = $('#pfp-modal-overlay');
      if (!overlay) return;
      const actionList = $('#pfp-action-list');
      const cropContainer = $('#pfp-crop-container');
      if (actionList) actionList.style.display = 'flex';
      if (cropContainer) cropContainer.classList.remove('active');
      overlay.style.display = 'flex';
      requestAnimationFrame(() => { overlay.classList.add('show'); });
    }

    function closePfpModal() {
      const overlay = $('#pfp-modal-overlay');
      if (!overlay) return;
      overlay.classList.remove('show');
      setTimeout(() => {
        overlay.style.display = 'none';
        const imgEl = $('#pfp-crop-image');
        if (imgEl && imgEl.src && imgEl.src.startsWith('blob:')) {
          URL.revokeObjectURL(imgEl.src);
        }
        _cropperState = { img: null, baseScale: 1, zoom: 1, offsetX: 0, offsetY: 0, isDragging: false, isPinching: false };
      }, 200);
    }

    function openCropper(inputEl) {
      const file = inputEl.files && inputEl.files[0];
      inputEl.value = '';
      if (!file) return;
      if (!file.type.startsWith('image/')) { toast('Please pick an image file.'); return; }

      const overlay = $('#pfp-modal-overlay');
      if (overlay && !overlay.classList.contains('show')) {
        overlay.style.display = 'flex';
        requestAnimationFrame(() => overlay.classList.add('show'));
      }

      const imgEl = $('#pfp-crop-image');
      const cropContainer = $('#pfp-crop-container');
      const actionList = $('#pfp-action-list');

      imgEl.src = URL.createObjectURL(file);
      
      if (actionList) actionList.style.display = 'none';
      if (cropContainer) cropContainer.classList.add('active');

      _cropperState.zoom = 1;
      _cropperState.offsetX = 0;
      _cropperState.offsetY = 0;
      $('#pfp-zoom-slider').value = 1;

      imgEl.onload = () => {
        _cropperState.img = imgEl;
        const viewport = $('#pfp-crop-viewport').getBoundingClientRect();
        const vw = viewport.width;
        const vh = viewport.height;
        const iw = imgEl.naturalWidth;
        const ih = imgEl.naturalHeight;
        _cropperState.baseScale = Math.max(vw / iw, vh / ih);
        imgEl.style.width = iw + 'px';
        imgEl.style.height = ih + 'px';
        updateCropperTransform();
      };
    }

    function updateCropperTransform() {
      const imgEl = $('#pfp-crop-image');
      if (!imgEl || !_cropperState.img) return;

      const totalScale = _cropperState.baseScale * _cropperState.zoom;
      const viewport = $('#pfp-crop-viewport').getBoundingClientRect();
      const vw = viewport.width;
      const vh = viewport.height;
      const iw = imgEl.naturalWidth * totalScale;
      const ih = imgEl.naturalHeight * totalScale;

      const maxOffsetX = Math.max(0, (iw - vw) / 2);
      const maxOffsetY = Math.max(0, (ih - vh) / 2);

      _cropperState.offsetX = Math.max(-maxOffsetX, Math.min(maxOffsetX, _cropperState.offsetX));
      _cropperState.offsetY = Math.max(-maxOffsetY, Math.min(maxOffsetY, _cropperState.offsetY));

      imgEl.style.transform = `translate(-50%, -50%) translate(${_cropperState.offsetX}px, ${_cropperState.offsetY}px) scale(${totalScale})`;
    }

    function setupCropperEvents() {
      const viewport = $('#pfp-crop-viewport');
      const slider = $('#pfp-zoom-slider');
      const imgEl = $('#pfp-crop-image');
      if (!viewport || !slider || !imgEl) return;

      slider.oninput = (e) => {
        _cropperState.zoom = parseFloat(e.target.value);
        updateCropperTransform();
      };

      viewport.addEventListener('pointerdown', (e) => {
        if (!_cropperState.img) return;
        e.preventDefault();
        if (e.pointerType === 'touch' && e.touches && e.touches.length === 2) {
          _cropperState.isPinching = true;
          _cropperState.startPinchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          _cropperState.startZoom = _cropperState.zoom;
        } else {
          _cropperState.isDragging = true;
          _cropperState.startX = e.clientX - _cropperState.offsetX;
          _cropperState.startY = e.clientY - _cropperState.offsetY;
          viewport.setPointerCapture(e.pointerId);
        }
      });

      viewport.addEventListener('pointermove', (e) => {
        if (!_cropperState.img) return;
        e.preventDefault();

        if (_cropperState.isPinching && e.touches && e.touches.length === 2) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const scaleFactor = dist / _cropperState.startPinchDist;
          _cropperState.zoom = Math.max(1, Math.min(4, _cropperState.startZoom * scaleFactor));
          slider.value = _cropperState.zoom;
          updateCropperTransform();
        } else if (_cropperState.isDragging) {
          _cropperState.offsetX = e.clientX - _cropperState.startX;
          _cropperState.offsetY = e.clientY - _cropperState.startY;
          updateCropperTransform();
        }
      });

      const endDrag = (e) => {
        _cropperState.isDragging = false;
        _cropperState.isPinching = false;
        try { viewport.releasePointerCapture(e.pointerId); } catch (_) {}
      };
      viewport.addEventListener('pointerup', endDrag);
      viewport.addEventListener('pointercancel', endDrag);
      viewport.addEventListener('pointerleave', endDrag);

      $('#pfp-crop-save').onclick = async () => {
        if (!_cropperState.img) return;
        toast('Saving picture…');
        try {
          const dataUrl = await cropAndResize(_cropperState);
          await setJSON('pfp', { dataUrl });
          S.profile = S.profile || {};
          S.profile.photoURL = dataUrl;
          toast('Profile picture updated.');
          closePfpModal();
          render();
        } catch (e) {
          console.error(e);
          toast('Could not save image.');
        }
      };

      $('#pfp-crop-cancel').onclick = () => {
        closePfpModal();
      };
    }

    function cropAndResize(state) {
      return new Promise((resolve, reject) => {
        const imgEl = $('#pfp-crop-image');
        if (!imgEl) return reject('No image element');
        
        const canvas = document.createElement('canvas');
        const size = 200;
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        
        const viewport = $('#pfp-crop-viewport').getBoundingClientRect();
        const vw = viewport.width;
        const vh = viewport.height;
        const totalScale = state.baseScale * state.zoom;
        const viewportCenterX = vw / 2;
        const viewportCenterY = vh / 2;
        const imgCenterX = viewportCenterX + state.offsetX;
        const imgCenterY = viewportCenterY + state.offsetY;
        const sx = (imgCenterX - vw / 2) / totalScale;
        const sy = (imgCenterY - vh / 2) / totalScale;
        const sWidth = vw / totalScale;
        const sHeight = vh / totalScale;
        
        ctx.drawImage(imgEl, sx, sy, sWidth, sHeight, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      });
    }

        /* ============================= WEBCAM CAPTURE (DESKTOP) ============================= */
    let _webcamStream = null;

    function isDesktopBrowser() {
      const hasFinePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      const hasTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
      return hasFinePointer && !hasTouch;
    }

    async function openWebcam() {
      const overlay = $('#webcam-overlay');
      const video = $('#webcam-video');
      const errEl = $('#webcam-error');
      if (!overlay || !video) return;

      errEl.classList.remove('show');
      errEl.textContent = '';
      overlay.style.display = 'flex';
      requestAnimationFrame(() => overlay.classList.add('show'));

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        errEl.textContent = 'Your browser does not support camera access. Please use "Choose from gallery" instead.';
        errEl.classList.add('show');
        return;
      }

            try {
        _webcamStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 1280, min: 640 },
            height: { ideal: 720, min: 480 },
            frameRate: { ideal: 30, min: 15 },
            advanced: [
              { exposureMode: 'continuous' },
              { whiteBalanceMode: 'continuous' },
              { colorTemperature: 5200 },
              { brightness: 128 },
              { contrast: 128 },
              { saturation: 100 },
              { sharpness: 128 }
            ]
          },
          audio: false
        });
        video.srcObject = _webcamStream;

        // Force the camera out of any auto-boosted "low light" mode.
        // Some cheap webcams ignore `advanced` in the initial call —
        // re-applying on the live track fixes the orange cast.
        try {
          const track = _webcamStream.getVideoTracks()[0];
          const caps = track.getCapabilities ? track.getCapabilities() : {};
          const wants = {};
          if (caps.exposureMode && caps.exposureMode.includes('continuous'))
            wants.exposureMode = 'continuous';
          if (caps.whiteBalanceMode && caps.whiteBalanceMode.includes('continuous'))
            wants.whiteBalanceMode = 'continuous';
          if (caps.colorTemperature) wants.colorTemperature = 5200;
          if (caps.brightness) wants.brightness = 128;
          if (caps.contrast) wants.contrast = 128;
          if (caps.saturation) wants.saturation = 100;
          if (Object.keys(wants).length) {
            await track.applyConstraints({ advanced: [wants] }).catch(() => {});
          }
        } catch (_) {}
      } catch (e) {
        console.warn('Camera error:', e);
        let msg = 'Could not access the camera.';
        if (e.name === 'NotAllowedError') msg = 'Camera permission was denied. Allow camera access in your browser settings, or use "Choose from gallery".';
        else if (e.name === 'NotFoundError' || e.name === 'DevicesNotFoundError') msg = 'No camera found on this device. Please use "Choose from gallery" instead.';
        else if (e.name === 'NotReadableError') msg = 'Your camera is already in use by another app. Close it and try again.';
        errEl.textContent = msg;
        errEl.classList.add('show');
      }
    }

    function closeWebcam() {
      const overlay = $('#webcam-overlay');
      const video = $('#webcam-video');
      if (!overlay) return;

      if (_webcamStream) {
        try { _webcamStream.getTracks().forEach(t => t.stop()); } catch (e) {}
        _webcamStream = null;
      }
      if (video) video.srcObject = null;

      overlay.classList.remove('show');
      setTimeout(() => { overlay.style.display = 'none'; }, 200);
    }

    function captureWebcamPhoto() {
      const video = $('#webcam-video');
      const canvas = $('#webcam-canvas');
      if (!video || !canvas || !_webcamStream) return;

      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) { toast('Camera not ready yet. Wait a moment and try again.'); return; }

      const side = Math.min(vw, vh);
      const sx = (vw - side) / 2;
      const sy = (vh - side) / 2;

      const size = 200;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      ctx.translate(size, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, sx, sy, side, side, 0, 0, size, size);

      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);

      (async () => {
        try {
          closeWebcam();
          await setJSON('pfp', { dataUrl });
          S.profile = S.profile || {};
          S.profile.photoURL = dataUrl;
          toast('Profile picture updated.');
          render();
        } catch (e) {
          console.error(e);
          toast('Could not save image.');
        }
      })();
    }

    window.addEventListener('DOMContentLoaded', () => {
      setupCropperEvents();
    });

     const PIN_TOP = 68;

      // Bottom nav bar height + iOS safe-area + a small breathing gap.

      const safeArea = parseFloat(getComputedStyle(document.documentElement)

      const BOTTOM_RESERVED = navH + 16; // extra 16px gap so nothing is flush against the nav

      // How many pixels of vertical space the pinned Birthday + Arabic + Privacy
      // headers occupy BELOW the Birthday pin line.
      const pinnedStackHeight = (ARABIC_TOP - PIN_TOP) + (PRIVACY_TOP - ARABIC_TOP);
      // = 32 + 32 = 64px

      const computeFreezePoint = () => {
        const wasFrozen = _settingsFrozen;
        if (wasFrozen) content.classList.remove('settings-frozen');

        // Live measurements
        const bdayHeaderTop = birthdayHeader.getBoundingClientRect().top;
        const bdayCardH     = birthdayCard.getBoundingClientRect().height;
        const arabicCardH   = sections[3].querySelector('.card').getBoundingClientRect().height;
        const privacyCardH  = privacyCard.getBoundingClientRect().height;

        // Total space needed BELOW the Birthday pin line so that
        // Birthday card + Arabic header + Arabic card + Privacy header + Privacy card
        // all fit above the bottom nav.
               const neededBelowPin =
            bdayCardH              // Birthday card
          + (ARABIC_TOP - PIN_TOP) // Arabic header offset (32)
          + arabicCardH            // Arabic card
          + (PRIVACY_TOP - ARABIC_TOP) // Privacy header offset (32)
          + privacyCardH           // Privacy card
          + 200;                    // gap between cards / breathing room

        // Available viewport space below the Birthday pin line, minus the nav bar.
        const viewportH = window.innerHeight;
        const availableBelowPin = viewportH - PIN_TOP - BOTTOM_RESERVED;

        // If everything fits naturally, we lock when the Birthday header
        // would reach its pin line. If it DOESN'T fit, we lock EARLIER —
        // pulling up by the shortfall so the whole stack is on-screen.
        const shortfall = Math.max(0, neededBelowPin - availableBelowPin);

        // scrollTop at which Birthday header reaches PIN_TOP:
        const scrollAtPin = content.scrollTop + (bdayHeaderTop - PIN_TOP);
        // Lock EARLIER by the shortfall so the entire stack fits.
        _settingsFreezePoint = Math.max(0, scrollAtPin - shortfall);

        if (wasFrozen) content.classList.add('settings-frozen');
      };

      const lock = () => {
        computeFreezePoint();
        content.scrollTop = _settingsFreezePoint;
        content.classList.add('settings-frozen');
        _settingsFrozen = true;
      };

      const onScroll = () => {
        if (_settingsFrozen) {
          if (content.scrollTop > _settingsFreezePoint + 0.5) {
            content.scrollTop = _settingsFreezePoint;
          } else if (content.scrollTop < _settingsFreezePoint - 2) {
            content.classList.remove('settings-frozen');
            _settingsFrozen = false;
          }
          return;
        }

        // Trigger: once we're within `shortfall` px of the pin point, lock.
        // We compute the trigger dynamically so it stays in sync with the live layout.
        const bdayHeaderTop = birthdayHeader.getBoundingClientRect().top;
        const bdayCardH     = birthdayCard.getBoundingClientRect().height;
        const arabicCardH   = sections[3].querySelector('.card').getBoundingClientRect().height;
        const privacyCardH  = privacyCard.getBoundingClientRect().height;

                const neededBelowPin =
            bdayCardH
          + (ARABIC_TOP - PIN_TOP)
          + arabicCardH
          + (PRIVACY_TOP - ARABIC_TOP)
          + privacyCardH
          + 200;

        const availableBelowPin = window.innerHeight - PIN_TOP - BOTTOM_RESERVED;
        const shortfall = Math.max(0, neededBelowPin - availableBelowPin);

        // Birthday header's current distance from the pin line:
        const distanceFromPin = bdayHeaderTop - PIN_TOP;

        if (distanceFromPin <= shortfall) {
          lock();
        }
      };

      // If we enter Settings already past the trigger, lock right away.
      {
        const bdayHeaderTop = birthdayHeader.getBoundingClientRect().top;
        const bdayCardH     = birthdayCard.getBoundingClientRect().height;
        const arabicCardH   = sections[3].querySelector('.card').getBoundingClientRect().height;
        const privacyCardH  = privacyCard.getBoundingClientRect().height;

                const neededBelowPin =
            bdayCardH
          + (ARABIC_TOP - PIN_TOP)
          + arabicCardH
          + (PRIVACY_TOP - ARABIC_TOP)
          + privacyCardH
          + 200;

        const availableBelowPin = window.innerHeight - PIN_TOP - BOTTOM_RESERVED;
        const shortfall = Math.max(0, neededBelowPin - availableBelowPin);

        if (bdayHeaderTop - PIN_TOP <= shortfall) {
          lock();
        }
      }

      _settingsFreezeHandler = onScroll;
      content.addEventListener('scroll', onScroll, { passive: true });
    }

    function applyTheme(mode, persist = true) {
      document.documentElement.setAttribute('data-theme', mode);

      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', mode === 'light' ? '#FFFFFF' : '#000000');

      if (persist) {
        try { localStorage.setItem('theme', mode); } catch (e) { }
      }
    }

    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = cur === 'dark' ? 'light' : 'dark';

      // Synchronous flip. No fade, no opacity change, no rAF, no overlay.
      // The browser repaints once, straight into the new theme — no
      // split-second washed-out state on any of the colored elements.
      applyTheme(next);
    }

    function applyArabicSize(mode) {
      document.documentElement.setAttribute('data-arabic-size', mode || 'medium');

          } catch (e) {}
